R 2021。  \n**版本／范围：** 作者预印本对应图；Fig. 1；PDF 页 3。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 图像网格被拆到一排可辨识的 patch 缩略片；上方对应嵌入与位置标记，旁边展开 encoder。\n\n**值得保留：** 保留二维到一维的对应、图像纹理、独立 class token；按需要裁局部。\n\n**需要取舍：** 网格数量不代表真实模型配置；不要把 patch、token 与向量分量混为一类。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/2010.11929/assets/x1.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r15\"\u003e\u003c/a\u003e\n\n## R15 · 稀疏输入与双路网络\n\n**来源：** [DeepFM](https://www.ijcai.org/proceedings/2017/0239.pdf)；IJCAI 2017。  \n**版本／范围：** IJCAI PDF 页码以当前文件为准；图像另取作者预印本；Fig. 1；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 字段分组的稀疏圆点经共享 embedding 接到 FM 和 DNN 两条分支；节点内运算符可辨。\n\n**值得保留：** 保留字段边界、共享嵌入层、分叉和运算节点；抽取局部减少密集连线。\n\n**需要取舍：** 不要把共享 embedding 画成两个独立参数副本。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/1703.04247/assets/img/architecture-deepfm.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r16\"\u003e\u003c/a\u003e\n\n## R16 · 字段内的稀疏到稠密扇入\n\n**来源：** [DeepFM](https://ar5iv.labs.arxiv.org/html/1703.04247)；IJCAI 2017。  \n**版本／范围：** 作者预印本原图；Fig. 4；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 底部字段中的少量激活圆点，通过局部扇入连接到同宽的 embedding 节点行。\n\n**值得保留：** 保留每个字段独立映射、输入激活和输出等宽；可替换字段名。\n\n**需要取舍：** 连线表示权重映射，不能当网络设备的物理全互连。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/1703.04247/assets/img/embedding.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r17\"\u003e\u003c/a\u003e\n\n## R17 · 计算阵列与单元剖面\n\n**来源：** [Eyeriss](https://eems.mit.edu/wp-content/uploads/2016/04/eyeriss_isca_2016.pdf)；ISCA 2016。  \n**版本／范围：** 作者托管论文 PDF；Fig. 1；PDF 页 2。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 阵列内有重复 PE 与互连；外接缓冲/FIFO；引出线展开单个 PE 的 ALU 多边形、RF 和路径。\n\n**值得保留：** 保留重复结构、局部剖面、特殊运算形体和分层存储；不用孤立芯片剪影代替。\n\n**需要取舍：** 该结构属于特定 CNN 加速器，不能冒充 NVIDIA GPU 实际 floorplan。\n\n\u003ca id=\"r18\"\u003e\u003c/a\u003e\n\n## R18 · 交叉网络与归约树装进执行单元\n\n**来源：** [SIGMA](https://anands09.github.io/papers/sigma_hpca2020.pdf)；HPCA 2020。  \n**版本／范围：** 作者托管论文 PDF；Fig. 5；PDF 页 6。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** Flex-DPE 中排列多级交叉线网、乘法阵列和归约树；旁边矩阵映射解释数据去向。\n\n**值得保留：** 保留内部三段结构、端点对齐、选中路径；装置边界包住拓扑而非取代拓扑。\n\n**需要取舍：** 逻辑互连不等于任意 GPU 的片上布局；复制此形体必须保留抽象层说明。\n\n\u003ca id=\"r19\"\u003e\u003c/a\u003e\n\n## R19 · 存储层级与分块流动\n\n**来源：** [FlashAttention](https://arxiv.org/pdf/2205.14135)；NeurIPS 2022。  \n**版本／范围：** 作者预印本原图；Fig. 1；PDF 页 2。  \n**审阅状态：** 2026-10-02 重新查看实际 PDF 图面；来源审阅与本次改编图认可分开。\n\n**观察或依据：** 层次金字塔与矩阵切块视图并列；Q/K/V 条带围绕虚线计算平面，移动块沿路径进入局部计算。\n\n**值得保留：** 分开裁取存储层级或 tile 流动；保留块边界和路径，不带原性能数值。\n\n**需要取舍：** 金字塔不按面积解释容量；虚线得分平面不表示完整矩阵已写入 HBM。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/2205.14135/assets/x1.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n**本次取舍：** 借鉴不同形体区分存储位置与计算tile、细线连接实际搬移端点；原图红绿强调较密，不照搬配色。此图不提供GPU板卡外观依据。\n\n\u003ca id=\"r20\"\u003e\u003c/a\u003e\n\n## R20 · 多级汇总的形状分工\n\n**来源：** [Decima](https://web.mit.edu/decima/content/sigcomm-2019.pdf)；SIGCOMM 2019。  \n**版本／范围：** 作者托管论文 PDF；Fig. 5；PDF 页 5。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 相同作业小图多次出现；节点、作业汇总和全局汇总有不同形状与扇入连线。\n\n**值得保留：** 保留 DAG 内部结构、汇总层次和稳定身份；只摘取一条汇总链。\n\n**需要取舍：** 三角形不是全领域统一的 embedding 符号，必须注明层级含义。\n\n\u003ca id=\"r21\"\u003e\u003c/a\u003e\n\n## R21 · 请求内部的长短 token 行\n\n**来源：** [Orca](https://www.usenix.org/system/files/osdi22-yu.pdf)；OSDI 2022。  \n**版本／范围：** USENIX 正式 PDF；页码包含封面；Fig. 4；PDF 页 6。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 请求池中的每个请求包含不同长度的 token 行；输入和已生成 token 有区分。\n\n**值得保留：** 保留请求身份与内部内容，按迭代只更新新 token；裁掉无关模块外框。\n\n**需要取舍：** 本例顺序不是全部场景的 FCFS 承诺；分量格和 token 格不能混淆。\n\n\u003ca id=\"r22\"\u003e\u003c/a\u003e\n\n## R22 · 逻辑页—映射记录—物理页\n\n**来源：** [PagedAttention / vLLM](https://arxiv.org/pdf/2309.06180)；SOSP 2023。  \n**版本／范围：** 作者预印本原图；Fig. 6–7；PDF 页 6。  \n**审阅状态：** 2026-10-02 重新查看实际 PDF 图面；来源审阅与本次改编图认可分开。\n\n**观察或依据：** 请求圆标对应逻辑页格，经中间映射记录指向不连续的物理页；两请求共享一个物理视图。\n\n**值得保留：** 保留块内 token、映射端点、空位和请求身份；不能简化成 Memory 字框。\n\n**需要取舍：** 逻辑相邻不代表物理相邻；不要把不同请求同色等同共享同一 KV。\n\n**本次取舍：** 页内保留词元内容或分格，使状态页区别于没有粒度的空方块；概览可省映射表细目，解释分页机制时则保留逻辑与物理两侧及映射。\n\n\u003ca id=\"r23\"\u003e\u003c/a\u003e\n\n## R23 · 前缀树的连续状态\n\n**来源：** [SGLang 正式论文](https://papers.nips.cc/paper_files/paper/2024/file/724be4472168f31ba1c9ac630f15dec8-Paper-Conference.pdf)；NeurIPS 2024。  \n**版本／范围：** 正式会议版本 Fig. 3；PDF 页 5。早期预印本 Fig. 6 的记录由此次正式版核对更新。  \n**审阅状态：** 2026-10-02 实际查看正式版 PDF 图面；未据此认定改编图已获用户认可。\n\n**观察或依据：** 树的公共前缀、分裂、新增和驱逐在九个时刻保持可追踪；驱逐位置以退出痕迹说明。\n\n**值得保留：** 保留公共主干、分支身份和变化事件；概览只取三四帧，正文再展开。\n\n**需要取舍：** 正式版图号为 3，与早期展示版本的 6 区分；请求完成不必清空前缀缓存。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/2312.07104/assets/x6.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n**本次取舍：** 提炼固定节点身份、细折线树和少量状态强调，避免为每帧增加大外框；不把九帧和长对话标签整体复制到概览图。\n\n\u003ca id=\"r24\"\u003e\u003c/a\u003e\n\n## R24 · 按 rank 保留比例的状态条\n\n**来源：** [ZeRO](https://arxiv.org/pdf/1910.02054)；SC 2020。  \n**版本／范围：** 作者预印本原图；Fig. 1；PDF 页 3。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 参数、梯度和优化器状态使用分层条带；不同 rank 对齐；不同阶段保留或切分对应部分。\n\n**值得保留：** 保留三种状态的层次与跨 rank 一致标尺；重画时删掉原实验数值。\n\n**需要取舍：** 条带长度代表示例容量而非时间；切片不等于完整副本。\n\n\u003ca id=\"r25\"\u003e\u003c/a\u003e\n\n## R25 · 长 prefill 与短 decode 的执行节奏\n\n**来源：** [Sarathi-Serve](https://www.usenix.org/system/files/osdi24-agrawal.pdf)；OSDI 2024。  \n**版本／范围：** USENIX 正式 PDF；页码包含封面；Fig. 7；PDF 页 7。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 同一组请求在四条策略时间线中重复；长块、短块、分块和显式停顿形成不同节奏。\n\n**值得保留：** 保留相同事件起点、请求身份、阶段长短、入场/退出；不是等长框串。\n\n**需要取舍：** 这里只描述论文当时比较，不当作当前 vLLM 的行为说明。\n\n\u003ca id=\"r26\"\u003e\u003c/a\u003e\n\n## R26 · 节点内重复设备与占用\n\n**来源：** [Tiresias](https://www.usenix.org/system/files/nsdi19-gu.pdf)；NSDI 2019。  \n**版本／范围：** USENIX 正式 PDF；页码包含封面；Fig. 6；PDF 页 5。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** GPU 集群以机器单元重复，单元内含四个设备格，实填/空白表示占用。\n\n**值得保留：** 只保留集群局部的两层归属与占用；其他类不必沿用格子。\n\n**需要取舍：** 每机器四卡是图中示例；该图形适合容量，不作为形体多样性的唯一范本。\n\n\u003ca id=\"r27\"\u003e\u003c/a\u003e\n\n## R27 · 逻辑到执行的工作流层次\n\n**来源：** [Murakkab](https://www.usenix.org/system/files/osdi26-chaudhry.pdf)；OSDI 2026。  \n**版本／范围：** USENIX 正式 PDF；官网录用/发表信息已核对；Fig. 5；PDF 页 7。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 逻辑工作流、优化后的分支结构与具体执行资源在连续阶段间对应。\n\n**值得保留：** 保留小型 DAG 的变化及任务—资源对应；去掉人物、锤子等与机制无关的装饰。\n\n**需要取舍：** 只借鉴对应关系，不把此系统的机制强加到待画系统。\n\n\u003ca id=\"r28\"\u003e\u003c/a\u003e\n\n## R28 · 计算格点与遍历路径\n\n**来源：** [FlexGen](https://proceedings.mlr.press/v202/sheng23a/sheng23a.pdf)；ICML 2023。  \n**版本／范围：** PMLR 正式 PDF；Fig. 2；PDF 页 4。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 计算对象放在具有 batch、layer、token 含义的格点结构中。\n\n**值得保留：** 保留轴的含义与计算顺序；只为解释遍历使用格点，不能泛化为全部对象模板。\n\n**需要取舍：** 这是一种有语义的网格，不是避免方块的形体范本。\n\n\u003ca id=\"r29\"\u003e\u003c/a\u003e\n\n## R29 · Agent 与记忆、工具和规划的组织\n\n**来源：** [LLM Powered Autonomous Agents](https://lilianweng.github.io/posts/2023-06-23-agent/)；Lilian Weng 2023。  \n**版本／范围：** 作者博客原图；主动筛除形体层面的误用；Agent overview；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 原图主要仍是带文字的模块矩形，展示中心 Agent 与记忆、工具、规划、行动的关系。\n\n**值得保留：** 仅用于组织层次参考；具体 Agent、记忆和工具小组件需要另配图形。\n\n**需要取舍：** 不能因为博客经典就把该图宣传成多样化形体范本。\n\n**原图入口：** [查看原图](https://lilianweng.github.io/posts/2023-06-23-agent/agent-overview.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"ag01\"\u003e\u003c/a\u003e\n\n## AG01 · AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation\n\n**来源：** [AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation](https://arxiv.org/pdf/2308.08155v2)；arXiv / 按记录版本。  \n**版本／范围：** 2308.08155v2；Fig. 1; Fig. 3；PDF 页 [1, 6]。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 小机器人头像配能力徽标；通过同族对象的连线形成联合对话、层级协作与动态群聊。对话内容使用气泡，角色身份与消息形态分开。\n\n**值得保留：** 角色头像＋能力条；对话气泡；同一套图元复用于不同协作拓扑。\n\n**需要取舍：** 减少灰底大容器和高密度小图标。能力徽标可改成通用短标签，不照搬品牌。\n\n\u003ca id=\"ag02\"\u003e\u003c/a\u003e\n\n## AG02 · GPTSwarm: Language Agents as Optimizable Graphs\n\n**来源：** [GPTSwarm: Language Agents as Optimizable Graphs](https://arxiv.org/pdf/2402.16823v3)；arXiv / 按记录版本。  \n**版本／范围：** 2402.16823v3；Fig. 1；PDF 页 [2]。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 用不同形状的操作节点组成单个 Agent 的局部图，再将各 Agent 小图连接为群体网络；角落的角色形象标记 Agent 身份。\n\n**值得保留：** 操作—局部图—群体图的尺度层次；局部展开；跨 Agent 的通信边。\n\n**需要取舍：** 去掉贯穿画面的彩虹渐变、棋盘纹理、冗余 Logo、厚阴影；不要把饱满装饰当成结构。\n\n\u003ca id=\"ag03\"\u003e\u003c/a\u003e\n\n## AG03 · Magentic-One: A Generalist Multi-Agent System for Solving Complex Tasks\n\n**来源：** [Magentic-One: A Generalist Multi-Agent System for Solving Complex Tasks](https://arxiv.org/pdf/2411.04468v1)；arXiv / 按记录版本。  \n**版本／范围：** 2411.04468v1；Fig. 1；PDF 页 [1]。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 角色用文件、代码、终端、浏览器等小符号识别；编号执行步骤下摆放相应代码、浏览器或终端产物。\n\n**值得保留：** 角色图标＋实际产物；步骤编号；同一角色在多个时刻重复出现。\n\n**需要取舍：** 压缩截图文字，简化长距离虚线路径；不能把步骤重复误画成新增 Agent。\n\n\u003ca id=\"ag04\"\u003e\u003c/a\u003e\n\n## AG04 · AFlow: Automating Agentic Workflow Generation\n\n**来源：** [AFlow: Automating Agentic Workflow Generation](https://arxiv.org/pdf/2410.10762v4)；arXiv / 按记录版本。  \n**版本／范围：** 2410.10762v4；Fig. 2；PDF 页 [4]。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 圆节点及颜色区分操作；扇入结构表现 ensemble，局部反馈与条件节点表现 debate 和 self-refine；另列节点配置与代码/图等关系表示。\n\n**值得保留：** 可复用小拓扑：生成—评审—修改回路、并行候选—汇总、带历史状态的局部交互。\n\n**需要取舍：** 降低粗边框和投影，少用多层虚线卡片。节点不自动等于独立 Agent 或模型实例。\n\n\u003ca id=\"ag05\"\u003e\u003c/a\u003e\n\n## AG05 · Agent Lightning: Train ANY AI Agents with Reinforcement Learning\n\n**来源：** [Agent Lightning: Train ANY AI Agents with Reinforcement Learning](https://arxiv.org/pdf/2508.03680v1)；arXiv / 按记录版本。  \n**版本／范围：** 2508.03680v1；Fig. 1；PDF 页 [2]。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 左侧是 Agent、工具和小网络；上方弧线把训练轨迹送向训练引擎，下方反向弧线返回更新模型。\n\n**值得保留：** 执行侧与训练侧分开；轨迹与模型更新两种返回路径。\n\n**需要取舍：** 不继承中心 Logo 的较大视觉占比；训练器可按需要局部展开，而非所有图都保留空框。\n\n\u003ca id=\"ag06\"\u003e\u003c/a\u003e\n\n## AG06 · AgentOrchestra: Orchestrating Multi-Agent Intelligence with the Tool-Environment-Agent (TEA) Protocol\n\n**来源：** [AgentOrchestra: Orchestrating Multi-Agent Intelligence with the Tool-Environment-Agent (TEA) Protocol](https://arxiv.org/html/2506.12508v6)；arXiv / 按记录版本。  \n**版本／范围：** 2506.12508v6；Fig. 2；PDF 页 []。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 同风格动物头像配角色名；上方主规划器有局部展开，右上是紧凑层级角色图；下方依次放置专用子 Agent、工具、环境和管理组件。\n\n**值得保留：** 统一角色图标家族；角色总览与局部展开；角色—工具的明确归属。\n\n**需要取舍：** 不要搬入整页协议栈和密集图标；只取当前系统有关的局部，角色图标保持相同尺度。\n\n\u003ca id=\"ag07\"\u003e\u003c/a\u003e\n\n## AG07 · The OpenHands Software Agent SDK: A Composable and Extensible Foundation for Production Agents\n\n**来源：** [The OpenHands Software Agent SDK: A Composable and Extensible Foundation for Production Agents](https://arxiv.org/pdf/2511.03690v2)；arXiv / 按记录版本。  \n**版本／范围：** 2511.03690v2；Fig. 1；PDF 页 [2]。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 左右比较 V0 与 V1；多层组件边界和命名连接表达应用、SDK、workspace、tools 与 server 的依赖及运行边界，主体依然是文字矩形。\n\n**值得保留：** 相同颜色追踪重构前后相对应的模块；边界和依赖关系。\n\n**需要取舍：** 不能作为形体多样性范例；应由我们的词条补充进程、事件、工作区和执行产物等具体对象。\n\n\u003ca id=\"ag08\"\u003e\u003c/a\u003e\n\n## AG08 · Orchestra-o1: Omnimodal Agent Orchestration\n\n**来源：** [Orchestra-o1: Omnimodal Agent Orchestration](https://arxiv.org/html/2606.13707v1)；arXiv / 按记录版本。  \n**版本／范围：** 2606.13707v1；Fig. 2；PDF 页 []。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 文件图标区分模态，主 Agent 与多个子 Agent 组合，任务依赖与并行执行局部展开；同时存在大面积金属机器人、厚阴影、多种图标及字体处理。\n\n**值得保留：** 按模态呈现输入；主/子 Agent 与任务依赖对照；实际等待关系。\n\n**需要取舍：** 不继承金属机器人、厚阴影和图标风格混杂。不要原样复用价格数字。\n\n\u003ca id=\"s01\"\u003e\u003c/a\u003e\n\n## S01 · Habitat: A Runtime-Based Computational Performance Predictor for Deep Neural Network Training\n\n**来源：** [Habitat: A Runtime-Based Computational Performance Predictor for Deep Neural Network Training](https://www.usenix.org/system/files/atc21-yu.pdf)；USENIX ATC 2021。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；图面未核验；PDF 页 []。  \n**审阅状态：** 已读技术文本，未核验图面；本轮补充记录。\n\n**观察或依据：** 读到跨 GPU 性能预测、算子测量与硬件条件的技术说明；本轮网页 PDF 截图未取得。\n\n**值得保留：** 硬件条件与预测对象分开、算子到任务预测的语义。\n\n**需要取舍：** 不把 Habitat 描述为 GNN；不从正文推定图形外观。\n\n\u003ca id=\"s02\"\u003e\u003c/a\u003e\n\n## S02 · Daydream: Accurately Estimating the Efficacy of Optimizations for DNN Training\n\n**来源：** [Daydream: Accurately Estimating the Efficacy of Optimizations for DNN Training](https://arxiv.org/pdf/2006.03318)；USENIX ATC 2020。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；图面未核验；PDF 页 []。  \n**审阅状态：** 已读技术文本，未核验图面；本轮补充记录。\n\n**观察或依据：** 读到低层事件依赖、图变换与模拟执行关系；本轮 PDF 图像读取失败。\n\n**值得保留：** 性能预测应保留计算、通信、等待和依赖；轨迹与关键路径的关系。\n\n**需要取舍：** 不把只读到的文字说明写成已观察的视觉构图；会议为 ATC 2020。\n\n\u003ca id=\"s03\"\u003e\u003c/a\u003e\n\n## S03 · Heterogeneity-Aware Cluster Scheduling Policies for Deep Learning Workloads (Gavel)\n\n**来源：** [Heterogeneity-Aware Cluster Scheduling Policies for Deep Learning Workloads (Gavel)](https://www.usenix.org/system/files/osdi20-narayanan_deepak.pdf)；OSDI 2020。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；Fig. 3–4；PDF 页 [5]。  \n**审阅状态：** 已看图面；本轮补充记录。\n\n**观察或依据：** 同一作业的时间份额用分段条呈现；任务对的相对吞吐用三角配对矩阵呈现，并区分不可共置条件。\n\n**值得保留：** 时间份额、任务身份与设备类型一致；配对矩阵只展开焦点单元。\n\n**需要取舍：** 时间段不是显存容量；原热图数值和评价配色不迁移成示意实验结果。\n\n\u003ca id=\"s04\"\u003e\u003c/a\u003e\n\n## S04 · Alpa: Automating Inter- and Intra-Operator Parallelism for Distributed Deep Learning\n\n**来源：** [Alpa: Automating Inter- and Intra-Operator Parallelism for Distributed Deep Learning](https://www.usenix.org/system/files/osdi22-zheng-lianmin.pdf)；OSDI 2022。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；Fig. 2；PDF 页 [4]。  \n**审阅状态：** 已看图面；本轮补充记录。\n\n**观察或依据：** 多种并行方式用重复张量、分块、阶段与时间维度对照。\n\n**值得保留：** 复本与分片的区别；同一个数据片跨设备、阶段保持身份。\n\n**需要取舍：** 只借切分与组织方式；EP/CP 具体通信方案不是此图直接给出的范例。\n\n\u003ca id=\"s05\"\u003e\u003c/a\u003e\n\n## S05 · HybridFlow: A Flexible and Efficient RLHF Framework\n\n**来源：** [HybridFlow: A Flexible and Efficient RLHF Framework](https://arxiv.org/pdf/2409.19256)；EuroSys 2025。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；Fig. 1–3；PDF 页 [3, 4]。  \n**审阅状态：** 已看图面；本轮补充记录。\n\n**观察或依据：** 圆形角色节点组织 RLHF 数据流；同角色可从逻辑图、放置表对应到设备执行泳道。\n\n**值得保留：** 逻辑角色—放置—执行的对应；不同数据与模型角色分开。\n\n**需要取舍：** 压缩代码块、密集箭头和多层虚线容器；不同 RL 算法不统一成固定四模型图。\n\n\u003ca id=\"s06\"\u003e\u003c/a\u003e\n\n## S06 · Getting Started with Fully Sharded Data Parallel (FSDP2)\n\n**来源：** [Getting Started with Fully Sharded Data Parallel (FSDP2)](https://docs.pytorch.org/tutorials/intermediate/FSDP_tutorial.html)；PyTorch 官方教程。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；仅技术文本；PDF 页 []。  \n**审阅状态：** 已读技术文本，未核验图面；本轮补充记录。\n\n**观察或依据：** 官方说明参数、梯度与优化器状态分片，以及聚合、归约、预取和配置相关的重分片。\n\n**值得保留：** 为三状态快照与计算通信泳道提供语义依据。\n\n**需要取舍：** 未审其图面；NVMe 或其他扩展为原创提案，须有实现依据。\n\n\u003ca id=\"s07\"\u003e\u003c/a\u003e\n\n## S07 · TVM: An Automated End-to-End Optimizing Compiler for Deep Learning\n\n**来源：** [TVM: An Automated End-to-End Optimizing Compiler for Deep Learning](https://www.usenix.org/system/files/osdi18-chen.pdf)；OSDI 2018。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；Fig. 2–3；PDF 页 [4]。  \n**审阅状态：** 已看图面；本轮补充记录。\n\n**观察或依据：** 整体图按图级和算子级分层；局部计算图用不同形状区分输入数据与操作。\n\n**值得保留：** 只借层次分工、数据与操作形态分工，转换后仍保留输入输出身份。\n\n**需要取舍：** 整张文字框层叠和品牌行不作审美模板；代码页与张量切片属于重新构造。\n\n\u003ca id=\"s08\"\u003e\u003c/a\u003e\n\n## S08 · SmoothQuant: Accurate and Efficient Post-Training Quantization for Large Language Models\n\n**来源：** [SmoothQuant: Accurate and Efficient Post-Training Quantization for Large Language Models](https://arxiv.org/pdf/2211.10438)；ICML 2023。  \n**版本／范围：** arXiv v7，2024-03-29；Fig. 2–3；PDF 页 [2, 3]。  \n**审阅状态：** 已看图面；本轮补充记录。\n\n**观察或依据：** 激活与权重幅度前后对照；矩阵旁的尺度条区分 tensor、token、channel 级量化。\n\n**值得保留：** 矩阵维度、尺度边条和对应关系；异常通道的局部对照。\n\n**需要取舍：** 不用红绿评价标签替代证据；通用量化不必具备平滑变换。\n\n\u003ca id=\"s09\"\u003e\u003c/a\u003e\n\n## S09 · vAttention: Dynamic Memory Management for Serving LLMs without PagedAttention\n\n**来源：** [vAttention: Dynamic Memory Management for Serving LLMs without PagedAttention](https://arxiv.org/pdf/2405.04437)；ASPLOS 2025。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；Fig. 5–6；PDF 页 [6]。  \n**审阅状态：** 已看图面；本轮补充记录。\n\n**观察或依据：** 固定虚拟张量与物理页布局的多时刻快照；请求完成后仍保留映射，后来请求可复用。\n\n**值得保留：** 同坐标状态变化；请求身份、映射与物理回收分别表达。\n\n**需要取舍：** 只在有真实回收时清空；前缀树形体另参考 R23，此处不声称展示 radix tree。\n\n**相关依据：** [补充来源1](https://doi.org/10.1145/3669940.3707256)\n\n\u003ca id=\"s10\"\u003e\u003c/a\u003e\n\n## S10 · DistServe: Disaggregating Prefill and Decoding for Goodput-optimized Large Language Model Serving\n\n**来源：** [DistServe: Disaggregating Prefill and Decoding for Goodput-optimized Large Language Model Serving](https://www.usenix.org/system/files/osdi24-zhong-yinmin.pdf)；OSDI 2024。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；Fig. 6；PDF 页 [9]。  \n**审阅状态：** 已看图面；本轮补充记录。\n\n**观察或依据：** Prefill 和 Decode 实例分组，每组内部有模型与执行层；组间显式连接 KV 传输。\n\n**值得保留：** 保留阶段分组、实例边界和中间状态交接。\n\n**需要取舍：** 原图主要是嵌套矩形，取其语义而重画模型层与 KV 薄片；不继承整体方框密度。\n\n\u003ca id=\"s11\"\u003e\u003c/a\u003e\n\n## S11 · Controllers / Device Plugins / Kubernetes Components\n\n**来源：** [Controllers / Device Plugins / Kubernetes Components](https://kubernetes.io/docs/concepts/architecture/controller/)；Kubernetes 官方文档。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；仅技术文本；PDF 页 []。  \n**审阅状态：** 已读技术文本，未核验图面；本轮补充记录。\n\n**观察或依据：** 协调循环围绕期望与实际状态；设备插件提供设备发现和分配接口；调度绑定与节点启动执行职责分开。\n\n**值得保留：** 控制与执行职责、事件与状态、资源管理与内核提交分开。\n\n**需要取舍：** 工作队列、双状态页等形体为原创提案；插件不放在每次 kernel 提交的必经路径。\n\n**相关依据：** [补充来源1](https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/device-plugins/)、[补充来源2](https://kubernetes.io/docs/concepts/overview/components/)\n\n\u003ca id=\"s12\"\u003e\u003c/a\u003e\n\n## S12 · Getting Started with CUDA Graphs\n\n**来源：** [Getting Started with CUDA Graphs](https://developer.nvidia.com/blog/cuda-graphs/)；NVIDIA 作者技术博客，2019。  \n**版本／范围：** 所链接论文版本／官方页面，查阅日 2026-10-01；仅技术文本；PDF 页 []。  \n**审阅状态：** 已读技术文本，未核验图面；本轮补充记录。\n\n**观察或依据：** 说明捕获、实例化、图提交与减少主机启动开销。\n\n**值得保留：** 同一依赖图的复用，CPU 提交和 GPU 内核保持区分。\n\n**需要取舍：** 重放不是缓存结果，不把原有多个 kernel 画成一个融合算子。\n\n\n\u003ca id=\"c01\"\u003e\u003c/a\u003e\n\n## C01 · Kubernetes Components\n\n[官方来源](https://kubernetes.io/docs/concepts/overview/components/)\n\n核验：2026-10-01，仅技术／素材说明文本，未审图面。控制面、节点与实际运行职责。\n\n借鉴：参考组件归属，不把逻辑层次等同物理机位置。 具体构图是原创描述，未生成图片。\n\n\u003ca id=\"c02\"\u003e\u003c/a\u003e\n\n## C02 · CNCF artwork\n\n[官方来源](https://github.com/cncf/artwork)\n\n核验：2026-10-01，仅技术／素材说明文本，未审图面。官方项目标识的获取入口与素材版本说明。\n\n借鉴：取准确素材；不把素材存在等同已经应用到本库成图。 具体构图是原创描述，未生成图片。\n\n\u003ca id=\"c03\"\u003e\u003c/a\u003e\n\n## C03 · Persistent Volumes\n\n[官方来源](https://kubernetes.io/docs/concepts/storage/persistent-volumes/)\n\n核验：2026-10-01，仅技术／素材说明文本，未审图面。PV、PVC、卷后端及生命周期等技术语义。\n\n借鉴：区分管理声明与实际数据读写，避免串行控制器读写路径。 具体构图是原创描述，未生成图片。\n\n\u003ca id=\"c04\"\u003e\u003c/a\u003e\n\n## C04 · Kubernetes Icons Set\n\n[官方来源](https://github.com/kubernetes/community/blob/main/icons/README.md)\n\n核验：2026-10-01，仅技术／素材说明文本，未审图面。Kubernetes 资源图标集合及使用入口。\n\n借鉴：可采用资源身份图标；不要求整图全部套用图标外形。 具体构图是原创描述，未生成图片。\n\n\u003ca id=\"c05\"\u003e\u003c/a\u003e\n\n## C05 · Kubernetes Service\n\n[官方来源](https://kubernetes.io/docs/concepts/services-networking/service/)\n\n核验：2026-10-01，仅技术／素材说明文本，未审图面。逻辑服务与后端端点的抽象关系。\n\n借鉴：服务图标不是新增物理交换机，逻辑调用与网络连通分层。 具体构图是原创描述，未生成图片。\n\n\n## 综合绘图方法与配色来源（2026-10-02）\n\n以下来源的具体取舍已写入本技能入口、视觉规范与构图规则，不是独立技能依赖：\n\n- [Vivid Figures](vivid-figures-ideas.md)：表达形式选择、视觉基线与有共同参照的叠加。\n- [figures4papers](figures4papers-ideas.md)：已看三幅实际图；多色对象身份、同族变体、主图与局部展开。\n- [Framework Studio](framework-studio-ideas.md)：已看两幅实际图；真实关系与画面分组分开核对、操作位置和连线语义。\n\n来源审阅范围和版本见各记录；新增配色组合是候选，需要在实际成图中判断，未标为用户验收。\n\n\n## 混合配色的方法来源（2026-10-05）\n\n\u003ca id=\"pa01\"\u003e\u003c/a\u003e\n\n### PA01 · Scientific illustration for commissioned content: Our guiding principles for conceptual figures\n\n[Nature editorial art teams](https://www.nature.com/documents/Nature_scientific_illustration_author_guide.pdf) · PDF pp. 1–3: hierarchy, accessibility and common mistakes。\n\n期刊概念图指南把上下文、主体与强调组织为视觉层次。 借鉴同图混合强弱色及复杂图的扩展类别色。 适用范围是该刊约稿概念图；不把刊物样式或少色倾向设为所有系统论文的硬规则。\n\n\u003ca id=\"pa02\"\u003e\u003c/a\u003e\n\n### PA02 · How to pick more beautiful colors for your data visualizations\n\n[Lisa Charlotte Muth / Datawrapper](https://www.datawrapper.de/blog/beautifulcolors) · 2020-09-04; sections on saturation/lightness and background contrast。\n\n示例通过不同明度与饱和度协调色相，提醒浅色细线在白底上可能不清楚。 同时调整色相、明度和饱和度；检查色彩在实际面积和背景上的表现。 类别图的同等权重与概念图的主次层次需区别处理。\n\n\u003ca id=\"pa03\"\u003e\u003c/a\u003e\n\n### PA03 · Emphasize what you want readers to see with color\n\n[Lisa Charlotte Muth / Datawrapper](https://www.datawrapper.de/blog/emphasize-with-color-in-data-visualizations) · 2023-07-24; sections 04–07 on category identity and emphasis。\n\n文章列出较浅类别色与更饱和类别色共存的实例，讨论面积和颜色强度共同影响注意力。 保留多个类别色，在同色族内调节强调程度。 不要把同一对象换成无关色相来表示变重要，也不固定只允许一个强调色。\n\n\u003ca id=\"pa04\"\u003e\u003c/a\u003e\n\n### PA04 · Ten simple rules for designing graphical abstracts\n\n[PLOS Computational Biology](https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1011789) · Rule 8: Colors; Figure 7 caption and related prose。\n\n颜色可用于强调、数量编码和物体外观；语义一致和非颜色线索也参与可读性。 区分概念图色彩层次、类别身份与定量色标。 不将装饰性混合色板直接用作连续热力图或数据量值尺度。\n\n本轮依据取得的正文和图注记录方法，来源状态为 text_reviewed。新增混合组合为项目自主选色，并非从来源图面取样。\n\n\n## 整图审美与开源方法（2026-10-05）\n\n\u003ca id=\"pa05\"\u003e\u003c/a\u003e\n\n### PA05 · Data visualization: A view of every Points of View column\n\n[Daniel Evanko / Nature Methods](https://blogs.nature.com/methagora/2013/07/data-visualization-points-of-view.html) · Composition and layout; Improving figure clarity。\n\n编辑部概述将层次、留白、知觉分组与相关信息的显著性联系起来。 将上述因素转化为整图观察问题。 本轮读到编辑部汇总正文；单篇 Layout、Negative space、Salience to relevance 正文获取受限，不标为全文已读。\n\n\u003ca id=\"pa06\"\u003e\u003c/a\u003e\n\n### PA06 · Viz Palette — redesign notes\n\n[Susie Lu](https://susielu.com/data-viz/viz-palette) · Redesign section。\n\n作者记录了突出交互、减少字号和字重变化、增加空间、减弱分隔线及澄清分组的改动。 借鉴从实际画面发现问题、再调整视觉重量和分组的复核方式。 这是交互工具界面设计记录；只迁移可用的视觉原则，不把界面布局套入论文系统图。\n\n\u003ca id=\"pa07\"\u003e\u003c/a\u003e\n\n### PA07 · SciencePlots\n\n[SciencePlots contributors](https://github.com/garrettj403/SciencePlots) · README: Using the Styles; Other color cycles; MIT license。\n\n项目提供可叠加的 Matplotlib 样式和多组颜色循环。 统计图可参考字体、线条、尺寸和颜色协调设置；核对实际目标版面。 本轮阅读 README，未安装或运行；样式选择不能验证系统机制图美感，不新增强制依赖。\n\n\u003ca id=\"pa08\"\u003e\u003c/a\u003e\n\n### PA08 · Penrose\n\n[Penrose contributors](https://github.com/penrose/penrose) · README: Domain, Substance, Style example; MIT license。\n\n开源示例分别声明对象关系与外观，并用包含、分离和层叠约束安排图面。 借鉴语义关系与视觉布局分别表达，以及基于对象约束调整间距。 本轮阅读 README 示例，未安装或运行；不引入 DSL，也不把布局约束满足视为审美验收。\n", "topics": []}, {"id": "rule-static-hosting", "type": "使用规则", "path": "references/static-hosting.md", "title": "Static hosting preparation", "text": "# Static hosting preparation\n\nThe guide works by opening `guide.html` locally. Its scripts, styles and search payload are embedded; no CDN, account, database or network search service is needed. External source links require a network connection.\n\nFor ordinary local browsing, open the maintained `guide.html` directly; do not create a second site/skill tree. For an authorized publication, run the rebuild and README checks, then `python3 scripts/prepare_site.py --output /path/outside/repository/new-temporary-site`. The destination must not already exist and must be outside the maintained repository. It includes relative documentation/artifact links. Remove this temporary bundle after use; it is not another maintained skill installation. The Pages workflow uses its runner's temporary directory. This command does not deploy.\n\nThe optional GitHub Pages workflow is manual-only (`workflow_dispatch`). After explicit owner authorization, configure the repository Pages source as GitHub Actions, review the bundle, then manually run “Publish static guide”. The workflow publishes only the staged static files and uses the GitHub Pages environment. It is not triggered by push or pull request. No public URL is advertised until a real deployment succeeds.\n\nHash state uses `topic`, `q`, `term`, `variant` and `doc`, compatible with local files and static hosting without rewrite rules. Old term hashes are retained. Complex Markdown/HTML is displayed as safe text rather than executed; the renderer supports headings, lists, code, tables and links.\n", "topics": []}, {"id": "rule-topic-index", "type": "使用规则", "path": "references/topic-index.md", "title": "当前主题与词条索引", "text": "# 当前主题与词条索引\n\n按需读主题；Cloud 主题复用关联词条，不重复立项。\n\n## Cloud 与云原生组合\n\n[主题正文](../topics/cloud-native-kubernetes.md) · 云平台、Kubernetes Logo、连接线及相关节点、CPU/GPU、存储、控制与执行组件；下列关联条目复用同一知识目录，不重复计数。\n\n[Cloud、云平台与云原生集群](../topics/cloud-native-kubernetes.md#cloud-environment) · re drawing\n\nShow the actual complete prompt (or native composition brief) before tool execution, with key object constructions and the selected palette. Distinguish disclosure from approval; wait only when the user requests approval or facts remain unresolved.\n\n## Every generated image\n\n- For generated component assets, inspect silhouette, transparency, target-size recognizability and style compatibility; verify actual reuse in the final figure and declare any raster editability limits.\n- Inspect the actual image, not only its prompt. Compare it with the design shown to the user: check whether the promised silhouettes, focal relationship, local expansions and color roles actually appeared. Report missing visual choices as defects, not as successful recipe use.\n- Objects, boundaries, multiplicities and relationships match the source material.\n- Every critical arrow has the right source, target, direction and meaning.\n- Comparisons preserve input identity; selection and arithmetic agree.\n- Lifecycle counts, reservations, release and async order are coherent.\n- No invented implementation queues, online training, brands or hardware mappings.\n- Labels are legible and correct; logo approximations are identified as placeholders.\n- Overview scope stays distinct from mechanism details.\n- Selected component constructions are visible in the result: silhouettes, parts and organization suit the object; a structural-redesign request is not satisfied by recoloring or relabeling boxes.\n- Visual quality is checked separately: silhouette and proportions identify the object at target size; neither a filled recipe checklist nor added micro-detail proves a good drawing. Revisions for stiffness address composition and component form, not only effects.\n- Miniature objects identify the right entity or explain relevant structure; regions fit their contents without crowding.\n- Component variants preserve paper facts and object granularity; layers, ranks, instances, roles and devices are not conflated.\n- Icons/logos attach to the right owner, share a coherent style and leave connector endpoints clear.\n- Intended label language matches the destination document; Chinese glyphs, English spelling, mixed-language terms and mathematical symbols are correct. Recipe IDs and planning metadata do not leak into the figure.\n- Redraws retain source semantics; terminology, supported adaptations and figure roles agree with the destination chapter/section.\n- Dissertation-wide figures preserve recurring concepts and symbols without inventing dependencies among chapters.\n- Inherited source-review records, textual candidates and newly inspected images have separate statuses.\n- Data/control/feedback are distinguishable; local guides and state borders are clear.\n- Perform the [rendered aesthetic review](visual-quality.md#aesthetic-review) after new drawings or color revisions; record concrete visual findings and reinspect actual corrections.\n- Check color hierarchy in the actual composition: contextual fills, object identities and focal relationships have the intended relative weight; small paths and labels remain readable. Uniformly pale or uniformly vivid treatment should be a deliberate choice, not a palette-grouping artifact.\n- Neighboring figures maintain coherent identity and typography. Different figure roles may use different coordinated palettes; direct comparisons preserve color mapping. Judge reduced clutter by the actual composition rather than automatic retention of earlier colors.\n- Remove editorial subtitles that repeat what the composition shows; preserve labels/conditions that materially affect interpretation.\n\nReport scientific errors explicitly. A composition may be useful while still needing repair. Do not call it a final paper figure solely because it looks polished.\n\n## Raster preview / manual redraw\n\nDisplay the image and provide the saved prompt plus concise redraw notes. Assess readability at an approximate intended width where feasible, without inventing exact point-size measurements. Native editability, vector export, editor round-trip and LaTeX compilation are not default completion requirements.\n\n## Requested native production\n\nUse [editable-production](editable-production.md). Check separately addressable text/objects, intended editor reopening, export fidelity and actual-width fonts. The optional SVG/PDF script supplies limited structure/font evidence only; it is not a universal validator for draw.io, TikZ or PPTX. A passing automated structure check does not prove semantics, routing or editability.\n\n## Requested paper integration\n\nCompile the affected manuscript and inspect the containing page at intended width. Check caption, references, float layout and readable labels. Distinguish figure-internal whitespace from TeX spacing. Preserve results and unrelated text. If compilation or viewing is unavailable, state that limitation without claiming completed integration.\n", "topics": []}, {"id": "rule-visual-asset-library", "type": "使用规则", "path": "references/visual-asset-library.md", "title": "可复用视觉素材库", "text": "# 可复用视觉素材库\n\n实际素材见 [assets/visual-library](../assets/visual-library/)，机器可读记录见 [catalog.json](../assets/visual-library/catalog.json)。素材与主题画法互补：画法解释怎样表达对象，素材提供已经看过的具体造型。\n\n## 选择与积累\n\n范围开放，按任务需要积累模型、数据、张量、CPU/GPU、服务器、互连、存储、Agent角色、工具、运行时、队列和其他对象；不要求每类预建素材，也不把某次认可变为全部图的固定风格。仓库自带素材可作为候选或造型参考；根据语义、风格、尺度和构图选择复用、改编、生图生成局部或整图，也可使用原生图元。即使已有同类素材，也可以生成更合适的新造型，不要求先遍历或用完素材库。实际检查后按需登记。记录来源、认可范围、可编辑程度、保留与舍弃内容及适用尺度，不只保存名称和文字配方。\n\n用户认可的视觉参考与可直接使用的干净素材分开记录。未经清理的整图可以作参考，但不能标为可直接复用的独立元素。当前 mixed-task-scenes-reference.png 是项目历史造型参考：有内容的样本页束、展开模型层与节点网络、Agent角色和具体工具具有辨识度；不保留原图把工具等待画成KV缺口的错误。实际图像来源记录为 2026-10-02 的 GPT Image 概念图及开发过程中的参考输入，非官方产品图。\n\n## 组合前检查\n\n- 独立元素保留完整轮廓，不带旧标签、文字残片、半截箭头或旁边对象。紧缩裁切不能以切掉模型边缘或网络节点为代价；需要时重新提取或生成。\n- 整图已有独立标签时，素材中不再保留同一标签。文字应只有一份。\n- 同一对象从左至右的形体、颜色与语义一致：模型和权重对应，请求词元和KV对应，时间等待不能变成状态空间中的空洞。\n- 看实际导出和论文页宽缩小效果，不能用裁切坐标或Prompt替代验收。\n\n## 交付形式\n\n按图的用途选择GPT Image整图、图片元素与原生图元混合、或完整原生矢量图。论文说明图可以直接使用检查通过的GPT Image成图，不默认要求重建为draw.io；精确数据、频繁修改的关系或用户明确要求可编辑时选择相应原生源。混合图中的图片内部仍是像素，文字、箭头和布局可以独立编辑。保留已认可的视觉细节，不为矢量化便利简化成同形方框。\n\n## 多元素素材页拆分\n\n一次生成多个对象时，入库前按对象拆成独立文件，每项记录来源、裁切范围、用途和可编辑程度；整张素材页只作为来源与风格参考。用户要求忠实拆分或保留原形象时，保留实际像素；若任务允许重新设计，也可生成独立新素材，并说明它不是原图裁切件。将不能分开而不损坏轮廓的组合（例如重叠的终端与地球）作为一个组合素材；不要补造被遮挡部分。重复对象可复用完整版本。原图已有截断的对象标为仅供参考，不进入正式图。\n\n当前可复用素材及预览：[混合任务独立素材](../assets/visual-library/mixed-task-elements/index.html)。SVG 是对原 PNG 的独立视窗封装，内部仍是像素，不能宣称全矢量；图中的文字、箭头、状态和布局另用原生图元维护。\n\n\n\u003ca id=\"asset-selection\"\u003e\u003c/a\u003e\n## 按当前图选择复用、改编或生成\n\n仓库素材提供可选示例，不固定人物、模型、Agent或环境的形象。根据当前图的解释目标与整体风格选择直接复用、调整已有素材、通过生图生成新元素或绘制原生图元；生成不以“没有现成素材”为前提。需要延续图组风格或用户明确要求保留形象时，再检查相应已有图与素材。其他图或其他项目中的认可不自动成为当前图的约束。记录实际使用的素材文件或生成来源，不以制作便利代替语义和视觉判断。\n\n工具与执行环境例如可按实际语义选择终端、文件夹或网络入口，但不要求固定组合；标签说明其涉及的文件、进程和外部服务；不随意添加锁来暗示安全隔离，也不把图标误写成硬件节点。运行支撑可采用控制台、局部流程、上下文记录与调用接口的组合，但这些是身份概念插图，不推定某个产品的真实架构。\n\n用于透明叠加的素材应采用真实透明背景；整图或有意设计的背景按任务处理。检查PNG的alpha和目标论文背景上的实际合成；不要仅凭忽略alpha的RGB预览判断光晕，也不要把透明棋盘格作为背景像素写入。保留完整轮廓，原生文字与箭头置于独立图层，不能让外部连线穿入身份素材后被误解为内部机制。\n\n2026-10-04新增运行控制台和工具环境素材见 `assets/visual-library/agent-components/`；清单保存来源、像素级可编辑边界、生成提示词和论文页宽检查状态。已有mixed-task-elements也提供人物、模型和结果页候选；可选用或按当前图另行生成，不规定后续图必须沿用。\n", "topics": []}, {"id": "rule-visual-quality", "type": "使用规则", "path": "references/visual-quality.md", "title": "视觉选择与取舍", "text": "# 视觉选择与取舍\n\n## 选参考时\n\n分别看形体、内部组织、比例留白、配色、连线和缩小后的辨识度。选择整体借鉴、只借结构、只借配色／构图或不采用，写明具体理由。不要只打分而没有可执行的取舍。\n\n例如“保留错位薄片与局部展开；减薄轮廓；去掉大面积投影；把多套强调色统一到一组；重新安排图例”，比“高级、干净、顶会风格”更有用。\n\n经典与近期论文都能提供方法。老图的配色不必保留，新图也不因视觉饱满就更合适。一张密集机制图可以只提取一个局部；不能提取时就不作为小组件范例。\n\n## 使用 icon 时\n\n可以使用角色头像、工具、文件、终端、设备、锁或状态提示。看它在当前画面中的作用：身份定位、辅助分组、提示操作，或适量亲和性装饰。它应与周围的线条、视角、颜色及细节一致。\n\n只需识别角色时，头像＋短标签已经足够。需要解释执行或性能时，再组合状态、数据、时间轨道或资源剖面。装饰性帽子不承担全部角色含义，锁图标不代表已证明安全隔离。\n\n不同主题无需都采用机器人；允许独立地选择半具象对象、纯结构或两者组合。跨图复用同一个角色、设备或模型时尽量延续其视觉身份。\n\n## 降低生硬与过分 AI 感\n\n观察成图，而不是只检查提示词中是否出现“不要 AI 感”。重点处理：\n\n- 每个元素都被套进等大的圆角卡片，层级与对象失去差别。\n- 随机发光、塑料或金属材质、厚投影、无关星星和漂浮图形争夺视觉重点。\n- 一条彩虹粗箭头替代所有具体连接，端点、方向或含义不明确。\n- 头像、芯片、纸页、张量来自不同画风，比例和透视没有协调。\n- 模型自行加入“ZONE”“Input panel”等规划词，或文字拼写与原研究不符。\n\n这些是需要判断的失败现象，不构成一律禁用阴影、渐变、圆角或 icon 的规则。克制的厚度、轻明暗和少量装饰可以保留，只要整体协调。\n\n## 组件的形态与细节尺度\n\n先判断读者在图中需要辨认的是板卡、芯片、节点、模型实例还是存储数据。构造同一对象时，先调整外轮廓与主要部件的比例，再决定颜色与细节：\n\n- **GPU／加速卡**：小图标可用计算封装与存储件；较大图元可采用薄板卡、中央封装、两侧显存及局部金手指或安装挡片，形成清楚轮廓。主芯片不要成为没有身份的巨大空白框。散热器、风扇或外壳仅在符合所表示设备和整图风格时使用，不把消费卡外观默认套给全部加速器。\n- **模型**：实例可用错位薄层配局部网络，结构图则按实际算子或层展开。层数和神经元示意数量不冒充真实规格；不让模型体与文件页束只有标签不同。\n- **存储与状态**：权重文件、物理内存、逻辑KV页采用不同形体；页块的规则重复表达数据组织，文字说明其粒度。避免用几个空方块同时代表批次、显存容量、模型和配置。\n\n轮廓、留白和部件间距比微小纹理优先。少量侧面、明暗和圆角可以使形体自然；缩小后消失或糊成噪声的针脚和纹理应删减。先查看代表组件在目标图中的实际比例，必要时比较两种构造，自行选出更适合的一种，再批量复用。\n\n## 呆板图的重构顺序\n\n先找出视觉焦点和阅读路径，再检查大框是否承担真实边界、说明文字是否挤占机制。对齐同类对象，同时允许主要对象与辅助对象有不同尺寸。留白用于分隔关系，不用冗余副标题填空。最后修订组件轮廓、连线与配色；无需给每张图加入新图标或立体效果。\n\n单图放大检查负责发现端点、遮挡和细节问题，目标页宽预览负责判断整体观感与辨识度。若两者冲突，优先保住目标尺寸下的关系和主次。\n\n## 颜色与排版\n\n先让尺寸、留白、重复与连接形成层次，再通过颜色强调。颜色可表达类别、身份或状态，但一种局部颜色不要同时承担矛盾含义。量化色阶应有真实数据与图例。\n\n同层级字体一致，标题、标签、辅助说明可有差异；不要把“统一”理解成所有元素同样大。没有固定的全局三色上限，也没有所有会议统一的配色模板。\n\n## 成图检查\n\n遮去大标题后仍应看见图中有角色、层次、分支、映射、资源或数据组织，不要求完全无文字猜出模型品牌。检查目标论文尺寸，不只看放大的原图。\n\n具体成图才可被标为已验收。本库新增描述尚未生成图片；检索可用、链接完整、语义检查和审美验收分别记录。\n\n\u003ca id=\"aesthetic-review\"\u003e\u003c/a\u003e\n\n## 配色后的整图审美复核\n\n新图和配色修订完成后，模型必须打开实际导出图，判断整图是否协调、清楚、有吸引力，再决定是否需要修订。先看完整画面和目标版面宽度下的预览，再放大检查细节。只能读取源代码、颜色值或提示词时，将图面审美检查记为未验证。\n\n先描述第一眼的视觉印象，并指出图面依据：视线首先落在哪里、画面偏拥挤还是松散、主体是否突出、颜色是否舒服而有对比。随后检查以下相互关联的因素：\n\n| 观察维度 | 判断依据与可选修订 |\n| --- | --- |\n| 焦点与阅读顺序 | 最强对比是否落在要解释的对象或关系；边界、标题和 Logo 是否抢走注意力。调整局部面积、明暗或线宽。 |\n| 色彩协调与视觉重量 | 浅、中、强色是否在实际面积和相邻背景上形成层次；同等重要对象是否意外失衡。可调明度、饱和度或色相，不必把整图一律调淡。 |\n| 留白与构图平衡 | 组内和组间距离是否说明归属；两侧视觉重量、疏密节奏、留白是否自然。允许不对称，不以填满画布为目标。 |\n| 形体与风格 | 轮廓、视角、图标、适度立体感是否协调，关键对象是否可辨；避免为了统一而抹掉对象差异。 |\n| 文字与连接 | 字体层次、标签位置和线宽是否协调；折线绕行、交叉、贴边或穿字是否打断阅读。 |\n| 缩小后的整体观感 | 目标宽度下是否仍有清楚的主体、流向和标签；细节是否挤成噪声，浅色小对象是否消失。 |\n\n将主要发现简短记为“可见位置／现象 → 对阅读或观感的影响 → 实际修改 → 复看结果”，并保存对应预览路径。例：“右侧大面积深紫边界比调度器更醒目 → 焦点偏移 → 减弱边界填充，保留调度器颜色 → 重新导出查看”；这是记录示例，不是已执行历史。允许“整体协调，无需修改”，但应指出真实图面上的理由，不能只写“高级、专业、美观”。\n\n修订优先解决最影响整体的已观察问题；改完重新导出并查看整图。局部任务仅修改授权范围，范围外问题记录为建议。拿不准两种配色时，可在同一布局、同一尺寸比较候选；不默认额外调用收费生图。没有新的具体问题时结束，不设固定审美分数、色数、面积比例或反复打磨轮数。灰度、色觉模拟和对比度检查可提供辨识证据，不能单独代表整图美感或机制正确。\n\n方法依据：[Nature Methods 的层次、留白与显著性概述](sourcebook.md#pa05)、[Datawrapper 的明度和饱和度调整](sourcebook.md#pa02)、[Viz Palette 作者的分组与视觉重量修订](sourcebook.md#pa06)。开源方法参考：[SciencePlots](sourcebook.md#pa07) 提供字体、尺寸、线条和颜色循环的协调实践；[Penrose](sourcebook.md#pa08) 将关系与布局约束分别表达。按任务借鉴，不把工具默认样式当作审美验收。\n\n## Cloud、平台 Logo 与连接\n\n云轮廓、平台标识、资源类型图标与 CPU/GPU/存储形体可共存；统一视觉尺度、视角、留白与颜色角色，保留各自辨识度。标签、边界、数据流、物理链路和部署映射要一起布局。详见 [Cloud 与 Logo 组合](cloud-logo-composition.md)。\n\n## 表达收益与视觉基线\n\n图形选择以读者获得的信息为依据。对资源竞争，可比较设备上的占用叠加与执行时间线；对状态演化，可比较固定布局的前后快照与生命周期路径。采用哪一种取决于正文要解释的关系，不预设每张图都需要对照面板。多个视图同时保留时，各自应解决不同的理解问题。\n\n叠加视图应有共同参照：例如在同一设备上标出驻留模型与候选请求，候选用浅色或虚线，已选对象用较清晰轮廓；不要让浅色被误解为低性能。数据图中，散点、区间带和拟合线分别需要相应观测、统计定义和模型依据，不能把这些效果当作装饰套进机制图。\n\n修图前从现有图面辨认值得保留的设计，再修改导致误读或不协调的部分。图形层次不应在重新编码、导出矢量或改配色时丢失；若原结构需要重构，按新的表达任务安排。记录具体保留/改变的元素即可，不增加固定评分、表单或用户确认。\n\n每轮查看完整图面，集中修复已发现的问题。完成图内检查后再查看文稿中的字号和落页；若问题只在图题或浮动位置，修改排版而非重画组件。检查已通过的部分仅在输入或设计变化时重检，避免无新问题的反复打磨。\n\n\n## 从图例迁移到当前图\n\n参考 figures4papers 的实际图面时，可拆成三个可操作选择：用对象形态区分输入和处理；用同族浅色维持关系、局部深色建立焦点；用主流程与局部展开分配视觉空间。分别决定是否适合当前图，不把完整的生物结构、球面、问答框或大幅横版直接迁入系统论文。\n\n迁移后检查：遮去颜色还能否辨认对象？缩到论文宽度，局部展开是否仍可读？同一个颜色跨面板是否仍指同一对象？是否由于加粗轮廓、放大标题或装饰渐变压住了机制？选择的配色与构图见 [视觉规范](visual-system.md) 和 [图形组织](figure-grammars.md)，来源及已看的图例见 [阅读记录](figures4papers-ideas.md)。\n\n## 造型选择要改变实际画面\n\n对新图的主要视觉对象，或用户明确指出呆板的对象，比较有实质差异的候选：轮廓、视角、部件组织、局部展开和与邻近对象的关系。选出适合解释任务的构造再展开；已认可的局部修图无需重新选型。让创造性发生在这些选择中，例如实体与状态叠加、主体与爆炸展开、流动序列与固定资源的配合，而不靠随机添加装饰。不要把易于编码或库中排在最前面当作选择依据。\n\nGPU 的选择可以是：以薄板卡侧面、安装端和封装比例辨认设备；以错位计算面与存储面解释搬移；以小型设备身份配外置时间轨道解释共享；或按有依据的微架构展开计算阵列。通用“大矩形＋小方块＋GPU 标签”只有在那些小块确实表达本文关心的资源单元时才有解释价值。图要表现设备身份而不是单元分配时，应选择更有辨识度的轮廓；无需给每张图都添加风扇、针脚或同一种 PCB。\n\n整图的变化来自主次比例、形体差异、疏密节奏、适当的展开视角和协调色族。颜色可以丰富，层次也可以鲜明；不把“论文风格”解释为所有对象低饱和、相同浅填充和同粗黑框。先给主对象与辅助对象不同的视觉重量，再在目标尺寸检查是否形成焦点。\n\n对照绘制前展示的设计检查实际结果：承诺的轮廓和局部展开在哪里，颜色角色是否实现，关键关系是否一眼可读？如果输出仍退化成一排同形文字框，记录为本轮视觉设计未实现，并针对构造或布局重绘。不要用“语义正确”替代视觉通过，也不因单次失败增加无关的细节规则。\n\n\n## Component selection and production detail\n\n### Make selected recipes visible\n\nFor each object needing concrete representation, determine: **object and role → entry and variant → silhouette, parts and spatial organization → labels and connection endpoints**. Before drawing, briefly show the user the key choices and resulting visible forms. Code comments or private notes do not replace this disclosure. The actual figure must show the selected parts and relationships; a delivery statement claiming that the library was used is insufficient.\n\nFor example, a training overview can combine the network skeleton in `network-model` with the forward/backward paths in `training`. An inference model can use the layered body in `model-instance`, a `token` sequence and `kv-cache` state strips. For a GPU, choose board identity, an exploded package or compute structure from `accelerator` according to its role, rather than always using the same board construction. Use `kubernetes-platform-logo` for platform-title ownership. The manuscript determines the actual structure; the existence of a recipe does not justify adding a model, platform or deployment.\n\nWhen identity alone matters, an icon and short label can form a complete component. When explaining a mechanism, expose the relevant local network, state, data or resources. Allow structural drawings, icons and combinations, including coordinated avatars, modest decoration, subtle depth and approachable details where useful. Balance identity, structural explanation and the whole composition. Avoid reducing every object to a named box or requiring complex internals in every small icon.\n\n**Fix structural problems through structural changes.** If the user finds objects abstract, shapes repetitive or the library unused, reselect and develop the relevant components. Recoloring, retitling or adding icons to otherwise identical boxes does not complete that redraw.\n\nSee the [visual asset library](visual-asset-library.md) for actual images and reusable forms. Accumulate useful objects as needed, distinguishing accepted references from cleaned assets; inspect leftover text, cropped edges and arrows before reuse. Figures may use GPT Image for the whole image, mixed assets or native primitives as appropriate. Editability is not required for every figure by default.\n\n### Choose assets to fit the figure\n\nThe repository's visual assets are optional starting points and examples, not prescribed appearances. Depending on the manuscript's meaning, visual style, scale and composition, reuse a suitable asset, adapt one, generate a new element with an available image tool, or use native primitives. New generation is a normal design choice even when a related asset exists; there is no requirement to search or exhaust the library first. Briefly explain the selected approach when presenting the design.\n\nFor revisions or related figure sets, respect any explicit request to preserve an accepted identity or style. Prior acceptance in another figure or project does not make that asset mandatory. Keep repeated objects visually consistent within the current composition without fixing every person, Agent, model or environment to one repository image.\n\nGive each object a form suited to what it explains. A tool workspace might use a terminal, files or network endpoint where relevant, but this is one possible construction rather than a required component list. Simple shapes are appropriate when they clearly express topology, state or timing. Check reused or generated elements for semantic fit, readability and composition quality. For transparent assets, inspect the actual alpha composition on the intended background. See [asset selection](visual-asset-library.md#asset-selection).\n\n## Keep PowerPoint output easy to edit\n\nFollow the small-object workflow in [editable production](editable-production.md): retain the few parts that need independent editing and use coherent images for complex artwork. That file maintains the full PPT/WPS granularity rule.\n\n## Generate new local elements when needed\n\nThe knowledge base is an adaptable starting point, not a closed catalog. When no construction fits, or existing constructions look monotonous or inconsistent in the current composition, use GPT Image or the available image generator to design local elements for the figure. This applies to GPUs, CPUs, models, storage, nodes, Agents, tools, data objects and any other object requiring a custom form. Do not wait for the user to request every element or exhaust all entries first. Use capabilities actually exposed by the tool; writing a model name in a prompt does not select that model.\n\nChoose whole-image generation, separately generated elements followed by composition, or a representative component extended to the figure set according to the task. Before generating an element, show its purpose, design and complete prompt. Then display and inspect the result inline, and supply selected elements as actual image inputs or assets when composing the figure. Mentioning a filename in a prompt does not reuse its image. Coordinate color, perspective, silhouette, lighting and detail density at the final figure scale; reuse an element to preserve object identity.\n\nStandalone elements for composition usually need transparent backgrounds, complete contours and clear space for connections. Set the actual transparency parameter when supported. Keep variable labels, counts, states and arrows in the composition layer where possible instead of baking them into pixels. Generated constructions do not constitute real product photographs, official logos, precise microarchitectures or experimental results. See [element generation](generation-prompts.md) for prompts and checks.\n\nGenerated elements may be imported directly into draw.io or PowerPoint as separate image objects alongside native text, shapes, connectors and groups. This is a normal production path and requires no additional permission to mix assets. Each element can be moved, resized, replaced and grouped independently; text, arrows, state markers and layout remain separately editable. Rebuild internal geometry from the generated reference only when the user explicitly requires full vector output or editing of individual internal parts. Explain that image interiors remain pixels without treating every editable draw.io/PPT request as a requirement to reconstruct all elements as vectors. Do not flatten the entire figure into one image. Retain useful project assets and actual prompts without turning every candidate into a global entry or creating duplicate backups.\n\n## Develop recipes into visual designs\n\nRecipes provide alternative constructions, not fixed icon templates. For new figures, substantial redraws or feedback that a figure looks stiff or unattractive, first read [visual choices and trade-offs](visual-quality.md), then choose key objects' **silhouettes, proportions, part relationships and detail scale**. Draw on user references or library examples that have actually been inspected. Design missing forms yourself without claiming unseen sources as visual evidence.\n\nWhen the user requests inspiration from research figures, search for and inspect actual figures from leading AI or systems conferences relevant to the current objects, preferring official publications or author manuscripts. Extract silhouettes, parts, grouping, connections and color roles. Update existing entries and source records using “source and figure number → retained elements → omitted content → applicable objects.” Do not merely add paper links or assume that a conference's reputation makes an entire figure worth copying.\n\nProduce an actual preview of a key object and one representative relationship, inspect it at reduced size, then extend the design to the figure set. Show the representative preview to the user and state the adopted form. Continue authorized drawing without turning this disclosure into another approval gate. GPUs, models and storage should have recognizable features at their intended size. Adding an icon or including recipe parts does not by itself establish visual quality. Small objects may be simple; large objects should avoid empty placeholders. Precision comes from object relationships, not accumulated pins, screws or shadows.\n\nChoose paths, lanes, local expansions or state comparisons according to the reading relationships. Reuse shapes for objects of the same kind and frames for real ownership. Do not force every object into an identical card for symmetry. Revisions addressing stiffness must examine both component forms and the whole figure's emphasis, density and spacing, beyond colors, rounded corners or thickness. Assess technical correctness and visual quality separately; more detail is not automatically more attractive.\n", "topics": []}, {"id": "rule-visual-system", "type": "使用规则", "path": "references/visual-system.md", "title": "Visual system: coherent objects and composition", "text": "# Visual system: coherent objects and composition\n\n## Palette and typography\n\nCompare multiple suitable palettes and their interaction with the current shapes, density and reading path. Existing figures are references, not a permanently preferred palette. Honor an explicit request to preserve a specific color; otherwise select for overall beauty, legibility and document coherence. Reducing excessive colors means consolidating competing semantic roles, not automatically replacing the figure with blue-gray text boxes. A single figure may use a rich coordinated palette across many objects and regions. Choose as many distinguishable hues as the composition needs; there is no universal three-color limit, and low saturation or pale fills are not default requirements.\n\n\n## Mix color strengths within one composition\n\nTreat palette rows as color pools; a figure does not need to inherit one uniform level of softness or vividness. Compose light contextual colors, medium-strength object colors, and stronger or darker accents within the same figure. The earlier soft and vivid combinations remain available, including for mixed use.\n\nChoose the assignment from the explanatory task: which regions provide context, which objects need distinct identities, and which relationships should attract attention? A pale blue region can contain a medium teal resource and a stronger coral event; a pale lilac model body can carry a dark purple identity and an amber update. Several main objects may be colorful. Judge relative area, adjacency and label contrast together, without imposing a fixed area ratio or a single-accent limit.\n\nKeep these distinctions when composing:\n\n- **Context and scope:** light or restrained fills can carry larger regions; whitespace can serve the same purpose. Thin lines and small symbols may need stronger contrast than large filled regions.\n- **Objects and categories:** use recognizable hues and medium or varied strength for the actual components. Comparable categories should receive comparable visual weight unless the figure deliberately emphasizes one.\n- **Focal action or relationship:** use a stronger saturation, darker value, warm/cool contrast or an appropriate combination at its actual location. Maintain the object's hue family when highlighting the same identity; a different hue may imply a different category.\n- **Readability:** select text and connector contrast against the actual neighboring fills. Shape, labels and line styles continue to identify objects and relations independently of color.\n\nThese twelve mixed examples are original starting points inspired by the methods below. Each row is intended for use **within one figure**; the columns describe possible visual roles, not fixed system-component mappings. Text uses a readable dark neutral or a checked light label on a dark body.\n\n| Mixed combination | Context / larger regions | Object identities / medium strength | Focal actions / stronger contrast |\n| --- | --- | --- | --- |\n| Mist blue and copper / 雾蓝铜橙 | #DCE8F0, #F4E4CC | #78A6AD, #A494BE | #D77843, #315D86 |\n| Mint, lilac and berry / 薄荷紫藤莓红 | #DDECE3, #E9E2F0 | #6EAA92, #A990BF | #C85976, #C39834 |\n| Peach, sky and deep teal / 杏桃天蓝深青 | #F1D9CD, #DEE6F2 | #C19B79, #719BC0 | #287E82, #C75555 |\n| Sage, rose and cobalt / 鼠尾草玫瑰钴蓝 | #E2E8D6, #ECEFF2 | #90A66C, #AB91A9 | #3769A0, #D48A2D |\n\n| Glacier, apricot and indigo / 冰川杏橙靛蓝 | #E0EDF1, #F5E6D7 | #76A9BD, #C69A78 | #4157A6, #D86C43 |\n| Oat, olive and raspberry / 燕麦橄榄覆盆子 | #F0EBDD, #E5EBDA | #A8B77D, #BC97AA | #A84168, #357C78 |\n| Lavender, aqua and saffron / 薰衣草水绿藏黄 | #EAE4F2, #DBEEEA | #A493C3, #69AAA4 | #7450A1, #D28C28 |\n| Sand, denim and vermilion / 沙米丹宁朱红 | #EEE6DB, #E1E8F0 | #B7A18B, #799AB7 | #CB563E, #305E82 |\n| Celadon, plum and gold / 青瓷梅紫金黄 | #E1EDE5, #EEE2EA | #78A895, #AE87A6 | #7B487F, #BF8D27 |\n| Blush, steel and peacock / 胭脂钢蓝孔雀青 | #F2E1DF, #E2EBED | #C58C91, #7D9EA9 | #247D88, #B54C69 |\n| Butter, periwinkle and forest / 奶油长春花森林绿 | #F4EDD3, #E4E7F4 | #B6A76D, #909DCF | #357761, #7955A0 |\n| Seafoam, terracotta and navy / 海沫陶土海军蓝 | #DCECE8, #F0E2D8 | #6FA99E, #C18B70 | #315875, #C45F3E |\n\nMethod sources: Nature's conceptual-figure hierarchy guidance [PA01](sourcebook.md#pa01), Datawrapper on hue/lightness/saturation [PA02](sourcebook.md#pa02) and category emphasis [PA03](sourcebook.md#pa03), and PLOS on color roles [PA04](sourcebook.md#pa04). We adapt their guidance to systems diagrams rather than adopting an entire house style. Quantitative plots still need an appropriate categorical, sequential or diverging scale; these composition palettes do not define numerical encoding.\n\nAfter assigning colors, inspect the rendered composition using the [aesthetic review](visual-quality.md#aesthetic-review). A swatch sheet supports selection; it does not establish the beauty or accessibility of every eventual use.\n\nThe blue/orange palette below is an optional starting point among several palette families; it came from a particular systems-paper iteration, not a venue rule.\n\n| Role | Main | Pale fill |\n|---|---|---|\n| Ordinary requests / data paths | #4C78A8 | #E8EFF7 |\n| Focal request / control / added interference | #D98C3F | #FAEBD8 |\n| Text and boundaries | #252A34 | — |\n| Background / supporting region | #FFFFFF | #F3F4F6 |\n| Optional model layers | neutral outlines | #E9E4F2 |\n\nUse the orange roles only in contexts where object and relationship types make them clear. Do not recolor all preparing requests orange if orange identifies one focal request. Avoid encoding success, novelty and identity indiscriminately with the same fill.\n\nFor English labels, use Arial/Helvetica-like sans-serif labels by default. For Chinese labels, choose a compatible CJK family with complete glyph coverage and consistent Latin/math pairing, following the thesis template when specified. Titles are only modestly larger. Preserve an accepted paper font when appropriate. Prefer flat fills, fine outlines and modest headings. Restrained thickness or shading may help distinguish parts; avoid effects that dominate structure. Publication-scale text around 8–9 pt is a production target, not a measurable claim about an uncalibrated generated image.\n\n## Composition\n\nFor a new or substantially redesigned figure, select actual constructions from the integrated component topics linked directly in SKILL.md before settling the layout. Read their parts, organization and boundaries; an index entry alone is insufficient. Match the role with an icon, structural expansion, or a combination. Recoloring a generic box does not implement a new construction.\n\nPrefer a compact overview with open workload objects, shallow functional regions and a concrete execution region. One successful option is left workflows, middle prediction above scheduling, right runtime. This is an option for that relationship structure, not a template for every system.\n\nFit boundaries to content. Use borders for real modules, state, tables, resources or ownership. Omit a decorative canvas frame; a whole-system boundary is legitimate when it communicates scope. Real serial processing may be left-to-right. Matched alternatives may be symmetric. Avoid equal cards when they obscure different object roles, not merely because they are equal.\n\nA little whitespace separates ownership and paths. Repair large unused interiors by moving groups, shortening labels or simplifying scope. Small coherent decorative or personable details are allowed; choose them for the composition rather than filling every gap. Model stacks can use a few offset layers. Keep hardware perspective modest and consistent with surrounding objects; use the detail required for identification or mechanism explanation.\n\n## Arrow vocabulary\n\n| Relation | Default |\n|---|---|\n| Request/data transfer | Solid directed arrow in the chosen data color; payload label |\n| Control/decision | Directed arrow in the chosen control encoding; command label |\n| Completion/resource feedback | Gray dashed directed arrow; state/event label |\n| Local DAG dependency | Thin charcoal directed arrow within DAG |\n| Completion frontier | Charcoal vertical dashed guide, no arrowhead |\n| Candidate comparison | Neutral connector or selection mark; no implied dispatch |\n\nLine type, color, arrowheads, location and labels work together. A dashed preparing-slot border is not a feedback arrow. Keep encodings consistent for comparable entities across figures; allow defined context-specific guides. If print/grayscale makes the chosen colors ambiguous, retain explicit payload/command labels and add non-color distinctions where needed.\n\n## Visible text\n\nUse short object/role labels and necessary scientific annotations. Let composition express parallelism, grouping and dependency where it is sufficient. Remove redundant editorial subtitles such as “four parallel studies”; retain words like “design” only when technically informative. Keep explanation in the manuscript, while preserving units, conditions and distinctions needed to interpret the figure.\n\n## Small identifiers\n\nA small logo or product name is allowed when it identifies an actual model, device, engine or framework. It need not be an experimental variable. Use role labels where needed to distinguish model, framework, platform and device. A logo-plus-name endpoint can identify a collapsed object; repetition follows reading needs across instances, panels or deployments. Use accurate assets when available; otherwise use short text or reserve a placement area. Treat any generated approximate mark as an unresolved placeholder to replace or omit. Never import brands from a style reference as deployment facts.\n\n## Consistency\n\nKeep request identity, label scale, model glyphs and arrow semantics coherent across a figure set. Palettes may vary with figure role; preserve color mapping within direct comparisons and continuous views of the same object. Allow geometry to vary with the question: topology, comparison and lifecycle should not all look like the same pipeline. Adopt accepted choices progressively; change them when user feedback or semantics require it.\n\n## Icons and component variants\n\nRead the [component visual guide](visual-quality.md) when selecting icons or combining drawing families. Role avatars, devices, terminals, files and state markers are allowed. Identity-only objects need not expose internal mechanisms; mechanism views may combine an icon with a local structural expansion. Align perspective, stroke density, scale and color roles across the figure instead of turning everything into identical cards. Small personable details are acceptable when they leave the main relationships clear.\n\nFor cloud/platform figures, use [Cloud/Logo composition](cloud-logo-composition.md): distinguish a platform logo, resource-type icon and physical device. Place marks with their actual owner; plan storage scope and connector routes together. Do not infer cloud vendors, VPCs or deployment boundaries from a generic recipe.\n\n\n## Additional palette choices and color roles\n\nThese alternatives may complement or replace earlier palettes when they improve the current figure. The blue/green/rose values below are recorded from Chen Liu's [figures4papers API palette](https://github.com/ChenLiu-1996/figures4papers/blob/f0bb7559abe90f5e1828797126d4d133c1bd47d7/scientific-figure-making/references/api.md); the role assignments here are adapted for systems figures. Source and review scope: [reference record](figures4papers-ideas.md).\n\n| Choice | Colors | Useful role |\n|---|---|---|\n| Blue emphasis with neutral support | #0F4D92, #3775BA, #CFCECE | Focal method/path plus supporting alternatives; keep names and markers |\n| Related green variants | #DDF3DE, #AADCA9, #8BCF8B | Variants in one family; lightness alone does not imply better performance |\n| Rose comparison | #F6CFCB, #E9A6A1, #B64342 | A second family plus a local accent; red does not automatically mean failure |\n| Additional distinct identities | #42949E, #9A4D8E | Additional categories when existing hues cannot distinguish them |\n\nFor large mechanism objects, choose pale, medium or saturated fills according to their visual weight and surrounding colors. Several object families may carry strong color in the same figure. Choose dark or light label text for contrast, and balance colored areas with whitespace, spacing and neutral supports. Pale-fill/dark-accent treatment is one option, not a rule that confines vivid color to tiny details. For quantitative lines, use sufficient contrast against white; pale fills suited to regions are not automatically suitable for thin curves. Check grayscale and use markers, line styles or labels where hue is insufficient. Do not label any palette colorblind-safe without testing it.\n\nA useful soft mechanism combination can keep blue, green, pale yellow and lilac in separate input branches, with a darker outline or local warm accent. Derive the exact shades from the document's existing palette; this is a compositional option observed in the ImmunoStruct schematic, not a claim of pixel-sampled colors. Match one object's color through its input, representation and output only when identity really persists. Category, rank, state and measured magnitude are different encodings.\n\nFor ablations, one hue family and distinct labels can show related variants. Omitted components must be named; fading is not a performance score. Shared legends and stable ordering across metrics reduce decoding work. Avoid automatically painting every baseline gray or red when baseline identity matters.\n\n\n## Coordinated multi-hue options\n\nThe following are independently chosen starting combinations informed by the reviewed examples' color relationships, not sampled source palettes. Use only the roles needed by the figure; do not force every swatch into it.\n\n| Family | Pale object fills | Stronger focal colors | Possible use |\n|---|---|---|---|\n| Soft multibranch | #D4E5F3 blue, #DEE9CE green, #F7EDC9 yellow, #E5DAEC lilac | #386884, #805B88 | Different input/object families converging on a model or decision |\n| Teal and warm sand | #D9EBE7 teal, #F2DFC7 sand, #E4E7EF slate | #39756F, #A46939 | Resource/state diagrams with warm local changes |\n| Sage, rose and slate | #DEE7D7 sage, #EDD6DA rose, #DCE3ED slate | #637C51, #A65E6B, #526B8A | Related workloads, actors or alternative mechanisms |\n| Blue and lavender with amber | #D7E5F2 blue, #E4DEF0 lavender, #F2E3C6 amber | #3F678E, #766095, #A27C36 | Model identities and a distinct decision/update path |\n\nThe first option draws on the multibranch organization in figures4papers; the latter options also reflect muted teal/green, blue/violet and warm evaluation accents observed in Framework Studio examples. They do not impose those examples' scientific roles. A GPU can be sage or slate when that suits the figure; it does not have to be blue. Avoid assigning an ordering or positive/negative meaning to color unless defined. Use dark neutral text, restrained outlines and non-color identity cues. Final visual inspection determines suitability, not a palette name.\n\n\n## Rich color within one figure\n\nFor figures with many recognizable objects, actively consider a broader palette instead of reducing the scene to two dominant colors. A figure may use six, eight or more coordinated hues when they help distinguish branches, model families, Agent roles, hardware, data and state. These numbers are examples, not a target or ceiling. Compact figures can still use fewer colors.\n\nPlan color across the entire composition: assign recurring object families stable hues, use related shades for their parts, and give neighboring groups enough separation. A model body, GPU board, storage object and Agent scene can each contain several coordinated colors. Their small material or decorative colors need not all become semantic legend entries. Distinguish category colors from quantitative scales and state encodings; show state with a named overlay, marker or pattern when changing a whole object's hue would lose its identity.\n\nThe following original combinations are broad starting palettes, not colors sampled from a paper or prescribed mappings. Use, extend or mix compatible subsets according to the figure. Preserve existing palettes elsewhere in this guide as alternatives.\n\n| Family | Coordinated hues available within one figure | Composition direction |\n| --- | --- | --- |\n| Clear multicolor | blue #3B82C4, cyan #20A7B5, teal #2F9B78, leaf #8EBF50, gold #E6B545, orange #E88945, coral #DA6B78, violet #9270BD | Distinct branches and recognizable objects with a lively, legible overall appearance |\n| Warm/cool contrast | navy #4667A5, sky #69B5D0, jade #52A58A, olive #A5B76A, ochre #D5AD49, terracotta #CE7757, rose #C67D9C, purple #8C78B3 | Hardware, software and workload groups with varied warm/cool identities and balanced visual weight |\n| Light and vivid mix | light blue #BDDDF3, mint #B9E0CF, lemon #F3DF8B, peach #F2BE9F, pink #E8B6CB, lilac #CFC1E8, bright teal #279EAA, deep coral #C95869 | Generous colored regions alongside several vivid objects or paths, rather than making every object equally pale |\n\nChoose emphasis using size, position, contrast and color together. More than one region may be colorful; a clear reading path does not require everything outside one focal object to be gray. Keep repeated identities consistent, separate touching colors with suitable outlines or spacing, and inspect labels and paths at the intended paper size. Use labels, shapes or patterns where readers must distinguish categories without hue. Do not claim these palettes are colorblind-safe without testing.\n\n\n## More combinations: soft, balanced and vivid\n\nRetain all earlier soft combinations as first-class choices alongside richer and more vivid palettes. More colors and stronger saturation are independent choices: a figure can be softly multicolored, brightly multicolored, or mix light regions with stronger objects. Choose among these directions for the current content and accepted style; none is the universal default.\n\nThe following additional combinations are original starting points. Their names describe visual character, not required scientific roles. Each row can supply several colors within one figure. Keep selected identities consistent when combining compatible colors from different rows.\n\n| Family | Colors | Composition direction |\n| --- | --- | --- |\n| Mist garden / 雾蓝花园 | #C9DDEA, #CDE5DA, #E1E8C3, #F2E3BB, #EBCFD5, #DCD2EB | Soft blue, mint, leaf, cream, rose and lilac for several gently separated object families |\n| Peach and mint / 蜜桃薄荷 | #F1CAB5, #F2DCAE, #DCE7C5, #BFE0D4, #C6DEEB, #DBCDE4 | Warm and cool pale regions with a light, approachable appearance |\n| Lilac morning / 紫藤晨光 | #CFC5E6, #C6D6EF, #C4E0DF, #DCE5C9, #F1DFBD, #E9C9D9 | Cool model or data families balanced by cream and rose accents |\n| Soft earth / 柔和大地 | #D9CBB8, #EACDB9, #ECDDBF, #CBD7BD, #BFD4D2, #D4CCDF | Muted warm/cool objects for dense diagrams with restrained overall contrast |\n| Sea and apricot / 海盐杏橙 | #5B8FB9, #61AFAD, #9ABD86, #E6BF69, #DE9770, #AE88AE | Medium-strength color across several objects, retaining both cool and warm identities |\n| Berry and sage / 浆果鼠尾草 | #7597BF, #739F92, #A6B77E, #D0AC71, #BE8193, #927FAE | Balanced, distinct identities for related branches, workloads or role groups |\n| Ocean and citrus / 海洋柑橘 | #347CBD, #18A2B5, #36A17B, #A8BC3C, #ECAF35, #E77846 | Lively cool-to-warm contrasts with several clearly colored objects |\n| Iris and coral / 鸢尾珊瑚 | #5578C3, #8867BB, #BD71A5, #DE7580, #E7AA57, #43A59B | Vivid mixed hues for a colorful composition with differentiated branches or actors |\n\nUse dark readable labels over pale fills. For medium or strong fills, select label and outline colors based on actual contrast. Do not fade every object merely because the figure is intended for a paper. Conversely, do not increase saturation when the accepted soft composition already works. If only the palette is being revised, preserve the accepted geometry, objects and relationships.\n", "topics": []}, {"id": "rule-vivid-figures-ideas", "type": "使用规则", "path": "references/vivid-figures-ideas.md", "title": "Vivid Figures 的方法参考与取舍", "text": "# Vivid Figures 的方法参考与取舍\n\n来源：https://github.com/yjz211/vivid-figures-skill\n\n查阅日期：2026-10-02。版本：c043f0553c7c3188b1bb8dcbf7db76d2adf98375。\n\n实际阅读：SKILL.md、figure-selection.md、template-fidelity.md、color-selection.md、original/drawing-guide.md、original/review-policy.md、LICENSE。未遍历或验收全部模板图片，未导入模板库、源码、色板或脚本。\n\n## 吸收的通用方法\n\n- 由表达任务选择视觉形式，同时检查输入是否支持这些形式。\n- 使用实际图面判断候选，文字描述和图名不代替预览。\n- 主图与补充视图各自提供不同信息，叠加需要共同参照。\n- 修改既有图时辨认并保留有效的视觉特点，避免重新实现造成无意退化。\n- 成组绘图保持身份与色彩一致，把图内问题和论文排版问题分开修复。\n\n上述规则以本技能既有计算机系统绘图流程独立表述，已融入入口和visual-quality。没有另建主辅技能或改变工具依赖。\n\n## 不沿用的设置\n\n不把外部默认色板强制覆盖当前设计；按整图效果可以调整或替换既有配色，不统一限制所有机制图为单色；不为追求新颖强制复杂图型或多面板。不将数据图的源码模板流程强制用于没有模板的原生机制图。不引入原仓库的固定默认色板、目录结构、状态机或修复次数。\n\n## 来源边界\n\n原仓库采用个人非商业许可，并对改编及再分发作限制。本次仅参考一般设计方法，独立撰写适合本技能的规则；未复制其受限实现或整段说明，不将其内容声明为本技能自有模板。来源版本记录不表示所有示例均经过视觉审阅。\n", "topics": []}, {"id": "combinations", "type": "组合案例", "path": "examples/combined-recipes.md", "title": "跨主题组合描述", "text": "# 跨主题组合描述\n\n以下是可直接改编的整体构造样板，均为文字候选，没有生成图片。每个场景中的数字、具体架构、标签与算法由本次研究内容补齐，不直接充当任何已完成实验的证据。\n\n## 1. 任务性能预测驱动调度\n\n左侧用一个带稳定任务 ID 的小型算子 DAG 表示任务，图穿过少量斜置编码平面，节点身份保持。硬件条件从侧面以独立属性条进入，实时观测放在下方有时间窗口的短记录里。只将实际使用的特征连接到融合位置。右侧对几种候选资源配置给出带单位的时长或显存预测，未选者保留轻轮廓，最后只有一个选择指向资源底板中的落点。任务图、特征、预测记录和设备使用不同形体，但共享线宽与色彩逻辑。\n\n可组合词条：`graph-hardware-prediction`、`static-dynamic-features`、`multi-target-prediction`、`cost-model-search`、`topology-placement`。\n\n可见短标签示例：Job A、Graph features、Device、Observed window、Predicted time、Memory、Selected。先确认图中标签语言再使用；示例不是强制文字清单。\n\n## 2. 在线推理与离线训练资源借还\n\n画面上方保留在线请求流，下方为同一组设备资源。资源底线、安全余量和允许训练借用的部分采用明确分界，不混成一块未定义利用率。时间沿左到右推进；训练在可借区运行后，负载触发回收，状态从保存或停止、释放、推理实例准备逐步推进。原来训练占用的槽在实际释放点才变空，推理只有就绪后进入运行状态。用简洁服务和训练模型小结构定位参与者，主体放在资源与时间的对应上。\n\n可组合词条：`quota`、`training-inference-reclaim`、`preempt-resume`、`model-loading`、`lifecycle`。\n\n## 3. Prefill—KV 交接—Decode\n\n两类实例组并列，组内模型可以用少量层叠片与一个展开层表示。请求在上方进入 Prefill；生成的 KV 用与权重不同的数据片束经过传输区到 Decode。控制请求和中间数据保留同一请求身份，依赖线落到 KV 可用点。Decode 右侧展开连续 token，并保留后续缓存增长。多 GPU 实例用共同实例边界，不把一片权重、一个实例和一张设备混为一体。外围保留适量设备小轮廓即可。\n\n可组合词条：`pd-handoff`、`model-instance`、`kv-cache`、`host-device-buffer`、`inference-budget`。\n\n## 4. 分布式训练中的临时参数聚合与通信重叠\n\n固定几个 rank 的位置，参数分片在各自位置以编号薄片表示。焦点层在执行前形成临时完整视图，完成后按配置重分片；梯度走独立 ReduceScatter 路径。下方只有两条主要时间轨道：当前层计算与下一层参数预取，必要的同步点用短垂线表示。实例、rank、层号保持可追踪。临时完整参数只在存活区间出现，图中不会随着迭代增加永久副本。配色按参数身份分组而不按每个框随机着色。\n\n可组合词条：`fsdp-reshard`、`gradient-overlap`、`training-state`、`data-parallel`。\n\n## 5. RL 采样、策略版本与训练\n\n采样侧使用当前算法中的角色模型或同风格 Agent 图标，输出轨迹带，带上来源策略版本。轨迹经真实存在的评分与信号处理进入训练，更新后的权重沿独立反向路径返回。异步时保留多个采样器正在使用的不同版本，不让新权重发布瞬间覆盖已产生轨迹的来源。需要解释设备执行时，把逻辑角色映射到下方少量设备泳道；多个角色可在同设备顺序执行。角色、数据和资源三层保持区别。\n\n可组合词条：`rl-rollout-train`、`policy-version`、`reward-advantage-mask`，以及已保留的 Agent AP07、AP09。\n\n## 6. 系统软件的控制与执行分界\n\n上方用规格页和观测页形成协调闭环，变化事件先进入工作队列；下方显示实际容器、进程或服务实例。动作经过边界接口改变受控对象，状态随后返回。若同时展示设备执行，应用经运行时与驱动提交内核，设备插件只留在资源发现和分配侧。终端、容器和设备的小符号按同一家族处理，少量边界框仅表达真实归属。控制、数据与内核执行不画成同一条连续箭头。\n\n可组合词条：`controller-reconcile`、`watch-workqueue`、`pod-execution-chain`、`device-runtime-driver`、`process-isolation`。\n\n## 7. 云原生集群与平台标识\n\n复用集群、节点、CPU/GPU、内存和存储词条，按实际范围放置云轮廓及 Kubernetes Logo；节点仅展开焦点，存储区分本地与共享，物理互连与数据访问分别说明。Logo 不变成独立计算步骤，研究模块不因强调而改变真实部署归属。两种完整文字组合见 [Cloud 与 Logo 指南](../references/cloud-logo-composition.md)。\n\n\n## 可执行场景输入\n\n[GNN 预测与调度](scenarios/gnn-scheduling.md)、[Agent 生命周期](scenarios/agent-lifecycle.md)、[Kubernetes 异构集群](scenarios/kubernetes-cluster.md)提供具体对象和机制假设。当前是输入材料，不是已验收案例；[案例状态](scenarios/README.md)单独记录。\n", "topics": []}], "cases": [], "assets": [{"id": "mixed-task-scenes", "file": "mixed-task-scenes-reference.png", "status": "historical-visual-reference-with-known-semantic-error", "provenance": "GPT Image concept recorded during project development on 2026-10-02", "scope": ["sample-pages", "neural-network", "layered-model", "agent-role", "terminal-web-tool", "result-document", "tensor-planes", "kv-pairs"], "reuse": "Inspect original pixels. Extract or regenerate isolated elements without labels/arrow remnants; do not treat entire scientific diagram as verified.", "scientific_correction": "Original Agent KV gaps incorrectly conflate waiting time with missing cache; retained KV should be continuous.", "publication_rights": "No third-party license asserted; not official product imagery.", "legacy_status": "historical-visual-reference-with-known-semantic-error", "source_review": "inherited_record", "visual_review": "not_reviewed_for_current_use", "final_use": "reference_only", "user_acceptance": "not_recorded_for_current_use", "generation_record": "historical_asset; original transcript only where linked", "term_ids": []}, {"id": "mixed function safeURL(url,base=''){
 let u=String(url).trim();

  let m=line.match(/^(#{1,6})\s+(.+)$/);
  if(m){close();const n=Math.min(6,m[1].length+1);out.push(`<h${n}>${inline(m[2],base)}</h${n}>`);}
  else if(/^\s*(?:[-*]|\d+\.)\s+/.test(line)){if(table)close();if(!list){out.push('<ul>');list=true;}out.push('<li>'+inline(line.replace(/^\s*(?:[-*]|\d+\.)\s+/,''),base)+'</li>');}
  else if(line.startsWith('|')){if(list)close();if(/^\|[\s:|\-]+\|?$/.test(line))continue;if(!table){out.push('<table><tbody>');table=true;}out.push('<tr>'+line.replace(/^\||\|$/g,'').split('|').map(v=>'<td>'+inline(v.trim(),base)+'</td>').join('')+'</tr>');}
  else{close();if(line.trim())out.push('<p>'+inline(line,base)+'</p>');}
 }
 close();if(code!==null)out.push('<pre><code>'+E(code.join('\n'))+'</code></pre>');return out.join('\n');
}
function variantBrief(t,v){return [['Object role',v.level||'Unreviewed; determine from target material'],['Construction',`${v.name} [${v.id}]`],['Description',v.description],['Connect',v.connect||'Determine actual endpoint from target material'],['Use',v.suitable||'Unreviewed'],['Avoid',v.unsuitable||'Unreviewed'],['Boundary',t.guard],['Sources',t.refs.join(', ')],['Cases',v.cases.join(', ')||'No example']].map(([k,v])=>k+': '+v).join('\n');}
function combine(pairs){return 'Selection notes; alternatives are not automatically compatible. Resolve roles and conflicts against target material.\n\n'+pairs.map(([t,v])=>variantBrief(t,v)).join('\n\n');}
function eligible(a){return a.final_use==='eligible'&&!/reference|truncated|superseded|error/.test(a.legacy_status||a.status||'');}
function matches(value,q){return q.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean).every(p=>value.toLocaleLowerCase().includes(p));}
const api={E,safeURL,markdown,variantBrief,combine,eligible,matches};
if(typeof module!=='undefined')module.exports=api;
root.SFS=api;
if(typeof document==='undefined')return;
const D=JSON.parse(document.querySelector('#payload').textContent), $=s=>document.querySelector(s);
let selection=new Set(), state={topic:'all',q:'',term:'',variant:'',doc:''};
const findVariant=id=>{for(const t of D.terms){const v=t.variants.find(v=>v.id===id);if(v)return [t,v];}return null;};
function link(fields){return '#'+new URLSearchParams({...state,...fields}).toString();}
function readState(){const h=location.hash.slice(1);const p=new URLSearchParams(h);for(const key of Object.keys(state))state[key]=p.get(key)|| (key==='topic'?'all':'');if(h&&!h.includes('=')){state.term=h.replace(/^term-/,'');}if(!D.topics.some(t=>t.id===state.topic))state.topic='all';$('#q').value=state.q;$('#topic').value=state.topic;}
function writeState(){history.replaceState(null,'',link({}));}
function copy(text){$('#export').hidden=false;$('#copytext').value=text;$('#copytext').focus();$('#copytext').select();const promise=navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(text):Promise.resolve(document.execCommand('copy'));promise.then(()=>$('#notice').textContent='内容已准备，可复制或保存。').catch(()=>$('#notice').textContent='复制受限，请选择文本后手动复制。');}
function variant(t,v){return `<section class="variant" id="${E(v.id)}"><h3><a href="${E(link({term:t.id,variant:v.id,doc:''}))}">${E(v.name)}</a> <small>变体</small></h3>${markdown(v.description,t.path)}<p>${E(v.level||'选择元数据尚未审阅')} · ${E(v.suitable||'适用问题待结合目标材料判断')}</p><p>连接：${E(v.connect||'需从目标材料确定端点')}</p><p>不适用：${E(v.unsuitable||'尚未专门审阅')}</p><p>${v.cases.length?v.cases.map(id=>{const c=D.cases.find(c=>c.id===id);return `<a href="${E(link({doc:id,term:'',variant:'',q:'',topic:'all'}))}">${E(c?.title||id)}</a>`;}).join(' · '):'无完整示例'}</p><button class="plain" data-variant="${E(v.id)}">复制此画法</button> <label><input type="checkbox" data-select="${E(v.id)}" ${selection.has(v.id)?'checked':''}>加入组合</label></section>`;}
function render(){
 const ts=D.terms.filter(t=>(state.topic==='all'||t.topic===state.topic||(D.topics.find(x=>x.id===state.topic)?.related_ids||[]).includes(t.id))&&matches(JSON.stringify(t),state.q));
 const docs=D.docs.filter(d=>(state.topic==='all'||(d.topics||[]).includes(state.topic))&&matches(d.title+' '+d.text+' '+d.type,state.q));
 $('#count').textContent=`${ts.length} 个词条（含变体） · ${docs.length} 个扩展 / 案例 / 规则`;
 $('#list').innerHTML=ts.map(t=>`<details class="term" id="term-${E(t.id)}" ${state.q||state.term===t.id?'open':''}><summary><strong>${E(t.title)}</strong><span class="tag">词条 · ${E(t.topic_title)}</span></summary><div class="body"><p>${E(t.aliases.join(' / '))}</p><p>${E(t.meaning)}</p>${t.variants.map(v=>variant(t,v)).join('')}<div class="notes">必要边界：${E(t.guard)}<p>来源：${t.refs.map(id=>`<button class="plain" data-source="${E(id)}">${E(id)}</button>`).join('')}</p>文字画法：description-ready；案例检查见各案例记录。<p>关联素材：${D.assets.filter(a=>(a.term_ids||[]).includes(t.id)).map(a=>`<a href="${E(safeURL('assets/visual-library/'+a.file))}">${E(a.id)}</a> (${E(a.final_use)})`).join(' · ')||'无关联素材'}</p></div><div class="foot"><a href="${E(link({term:t.id,variant:'',doc:''}))}">定位此词条</a><button class="plain" data-term="${E(t.id)}">复制整个词条</button></div></div></details>`).join('');
 $('#docs').innerHTML=docs.map(d=>`<details class="card" id="doc-${E(d.id)}" ${state.doc===d.id?'open':''}><summary><strong>${E(d.title)}</strong><span class="tag">${E(d.type)}</span></summary><a href="${E(link({doc:d.id,term:'',variant:''}))}">定位</a><div class="doc-body">${markdown(d.text,d.path)}</div>${d.preview?`<img loading="lazy" src="${E(safeURL(d.preview))}" alt="${E(d.title)} preview"><p><a href="${E(safeURL(d.source))}">权威源文件</a> · <a href="${E(safeURL(d.path))}">制作及检查记录</a></p>`:''}${(d.variants||[]).map(id=>{const pair=findVariant(id);return pair?`<a href="${E(link({term:pair[0].id,variant:id,doc:'',q:'',topic:'all'}))}">${E(pair[1].name)}</a> · `:'';}).join('')}</details>`).join('');
 if(!ts.length&&!docs.length)$('#list').innerHTML='<p class="empty">没有匹配结果。尝试英文术语、中文名称，或清除主题筛选。</p>';
 document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>copy(variantBrief(...findVariant(b.dataset.variant))));
 document.querySelectorAll('[data-term]').forEach(b=>b.onclick=()=>{const t=D.terms.find(t=>t.id===b.dataset.term);copy(t.title+'\n'+t.meaning+'\n\n'+t.variants.map(v=>variantBrief(t,v)).join('\n\n'));});
 document.querySelectorAll('[data-select]').forEach(c=>c.onchange=()=>{if(c.checked&&selection.size>=8){c.checked=false;$('#notice').textContent='每次最多组合 8 个变体。';return;}c.checked?selection.add(c.dataset.select):selection.delete(c.dataset.select);updateSelection();});
 document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{const s=D.sources.find(s=>s.id===b.dataset.source);if(!s)return;$('#source-body').innerHTML='<h2>'+E(s.title)+'</h2>'+markdown([s.review_status,s.figure,s.observation,s.retain,s.avoid].filter(Boolean).join('\n\n'))+`<a href="${E(safeURL(s.url))}" rel="noopener noreferrer">来源</a>`;$('#source-dialog').showModal();});
}
function updateSelection(){$('#selected').textContent=[...selection].map(id=>findVariant(id)[1].name).join(' / ')||'尚未选择变体';}
function focusTarget(){const target=state.variant|| (state.term?'term-'+state.term:state.doc?'doc-'+state.doc:'');const el=document.getElementById(target);if(el){el.closest('details')?.setAttribute('open','');el.scrollIntoView({block:'center'});el.setAttribute('tabindex','-1');el.focus({preventScroll:true});}}
$('#topic').innerHTML='<option value="all">全部主题</option>'+D.topics.map(t=>`<option value="${E(t.id)}">${E(t.title)}</option>`).join('');
$('#stats').textContent=`${D.stats.theme_count} 主题 · ${D.stats.term_count} 词条 · ${D.stats.variant_count} 画法 · ${D.stats.worked_example_count} 完整案例${D.stats.worked_example_count?'':'（当前没有登记的完整案例）'}`;
$('#q').oninput=()=>{state.q=$('#q').value;state.term=state.variant=state.doc='';writeState();render();};
$('#topic').onchange=()=>{state.topic=$('#topic').value;writeState();render();};
$('#clear').onclick=()=>{state={topic:'all',q:'',term:'',variant:'',doc:''};writeState();readState();render();};
$('#combine').onclick=()=>selection.size?copy(combine([...selection].map(findVariant))):$('#notice').textContent='请先选择变体。';
$('#clear-selection').onclick=()=>{selection.clear();updateSelection();render();};
$('#close-source').onclick=()=>$('#source-dialog').close();
$('#asset-list').innerHTML=D.assets.map(a=>`<li><a href="${E(safeURL('assets/visual-library/'+a.file))}">${E(a.id)}</a> — <span class="status">${E(a.final_use)} / ${E(a.legacy_status||a.status)}</span>；视觉：${E(a.visual_review)}；当前接受：${E(a.user_acceptance)}</li>`).join('');
$('#asset-count').textContent=`默认可选最终素材 ${D.assets.filter(eligible).length}；其余保留为需审阅或参考素材。`;
window.addEventListener('hashchange',()=>{readState();render();focusTarget();});readState();render();updateSelection();focusTarget();
})(typeof globalThis!=='undefined'?globalThis:this);
</script></body></html>
