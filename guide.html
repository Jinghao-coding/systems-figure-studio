次、留白、知觉分组与相关信息的显著性联系起来。", "retain": "将上述因素转化为整图观察问题。", "avoid": "本轮读到编辑部汇总正文；单篇 Layout、Negative space、Salience to relevance 正文获取受限，不标为全文已读。", "version": "Public text read 2026-10-05", "record_origin": "new_aesthetic_guidance_2026_10_05", "review_scope": "Text reviewed; external tools not executed and source images not visually audited."}, {"id": "PA06", "title": "Viz Palette — redesign notes", "source": "Susie Lu", "venue": "Design guidance / open-source documentation", "url": "https://susielu.com/data-viz/viz-palette", "figure": "Redesign section", "pdf_pages": [], "review_status": "text_reviewed", "review_date": "2026-10-05", "observation": "作者记录了突出交互、减少字号和字重变化、增加空间、减弱分隔线及澄清分组的改动。", "retain": "借鉴从实际画面发现问题、再调整视觉重量和分组的复核方式。", "avoid": "这是交互工具界面设计记录；只迁移可用的视觉原则，不把界面布局套入论文系统图。", "version": "Public text read 2026-10-05", "record_origin": "new_aesthetic_guidance_2026_10_05", "review_scope": "Text reviewed; external tools not executed and source images not visually audited."}, {"id": "PA07", "title": "SciencePlots", "source": "SciencePlots contributors", "venue": "Design guidance / open-source documentation", "url": "https://github.com/garrettj403/SciencePlots", "figure": "README: Using the Styles; Other color cycles; MIT license", "pdf_pages": [], "review_status": "text_reviewed", "review_date": "2026-10-05", "observation": "项目提供可叠加的 Matplotlib 样式和多组颜色循环。", "retain": "统计图可参考字体、线条、尺寸和颜色协调设置；核对实际目标版面。", "avoid": "本轮阅读 README，未安装或运行；样式选择不能验证系统机制图美感，不新增强制依赖。", "version": "Public text read 2026-10-05", "record_origin": "new_aesthetic_guidance_2026_10_05", "review_scope": "Text reviewed; external tools not executed and source images not visually audited."}, {"id": "PA08", "title": "Penrose", "source": "Penrose contributors", "venue": "Design guidance / open-source documentation", "url": "https://github.com/penrose/penrose", "figure": "README: Domain, Substance, Style example; MIT license", "pdf_pages": [], "review_status": "text_reviewed", "review_date": "2026-10-05", "observation": "开源示例分别声明对象关系与外观，并用包含、分离和层叠约束安排图面。", "retain": "借鉴语义关系与视觉布局分别表达，以及基于对象约束调整间距。", "avoid": "本轮阅读 README 示例，未安装或运行；不引入 DSL，也不把布局约束满足视为审美验收。", "version": "Public text read 2026-10-05", "record_origin": "new_aesthetic_guidance_2026_10_05", "review_scope": "Text reviewed; external tools not executed and source images not visually audited."}], "docs": [{"id": "agent-samples", "type": "Agent 扩展", "path": "topics/agents-approved-samples.md", "title": "Agent / Multi-agent · 已保留的画法", "text": "# Agent / Multi-agent · 已保留的画法\n\n这些构造来自 v0.4.1 的历史整理；方向选择记录不代表具体成图已验收。按当前文稿的对象、关系和视觉要求选用。\n\n## Agent／智能体\n\n**主题：** Agent、LLM 应用、工作流、人机协同。\n**别名：** agent、AI agent、角色智能体；planner、executor、reviewer 等是任务中的具体角色，不默认全部出现。\n**简要含义：** 在当前系统里承担指定角色的执行实体。可只表示身份；说明内部机制时再展开相关结构。\n\n### 画法 A：角色头像与短标签\n\n**具体怎么画**\n\n使用一个轮廓清晰的小型机器人头像，保留圆滑的外形、简洁面部和少量辨识性细节。\n头像下方或旁侧放短角色名，不额外套一层宽大卡片。多角色沿任务关系排列，保持相同的头像比例和线条；\n用小角标或一处强调色区分角色，文字负责准确说明职责。可保留少量增加亲和感的细节，\n不加入大面积发光、夸张表情或抢占注意力的配件。\n\n**适用与调整：** 角色总览、用户与 Agent 的交互、以协作关系为主的小型架构图。头像本身可构成完整组件。\n**参考与取舍：** 原创候选；不宣称来自特定论文。图标形状是身份表示，不代表真实模型结构。\n**误读提醒：** 只有当前系统存在多个实体才重复头像；不同时间的同一 Agent 保留身份。\n**当前状态：** 文字候选，未生成。\n**历史状态：** v0.4.1 记录构造方向已接受；具体成图未验收。\n\n### 画法 B：以状态与路径表示 Agent\n\n**具体怎么画**\n\n不使用头像，将任务中确实存在的状态与操作沿紧凑回路组织：输入在一侧进入，操作沿清楚路径展开，\n反馈从下方回到对应接收位置。状态可用少量叠置的记录片，操作用小型节点，外部返回内容用一条短消息带。\n让回路形态承担整体辨识，不强行用一个大矩形包住所有内容。线条以中性颜色为主，强调本图讨论的步骤。\n实际没有循环时改为顺序或分支结构，不为画得像 Agent 而添加回路。\n\n**适用与调整：** 解释给定 Agent 的状态变化或执行过程；只展开有依据的内容。\n**参考与取舍：** 原创候选；其构造应由本次系统描述补足，不预设所有 Agent 都有记忆、规划或工具。\n**误读提醒：** 回路中的先后关系不是模块包含关系；控制和返回数据在必要时区分。\n**当前状态：** 文字候选，未生成。\n**历史状态：** v0.4.1 记录构造方向已接受；具体成图未验收。\n\n### 画法 C：头像与局部结构组合\n\n**具体怎么画**\n\n保留小型 Agent 头像作为身份锚点，在一侧展开当前讨论的内部结构；头像面积不超过展开结构的视觉重量。\n用细引线或明确的局部展开关系连接二者，不能画成两个独立执行实体。展开部分只包含已说明的状态或机制，\n例如少量记忆条目与读写路径，或一组规划任务与后继关系。头像采用与结构同一色系，展开的焦点采用强调色；\n远离焦点的细节折叠，保证小尺寸下仍能分清身份与机制。\n\n**适用与调整：** 既要易于识别 Agent，又需要解释一项局部机制的架构图。\n**参考与取舍：** 原创组合提案，不代表某篇论文的完整机制。\n**误读提醒：** 用于局部展开的引线不表示新的数据请求；不要为了填满结构增加不存在的组件。\n**当前状态：** 文字候选，未生成。\n**历史状态：** v0.4.1 记录构造方向已接受；具体成图未验收。\n\n## 多 Agent 协作／Multi-agent collaboration\n\n**主题：** Agent、工作流、人机协同。\n**简要含义：** 多个具有不同身份或角色的参与者进行任务交接、消息交换或协作执行。\n不默认采用中心协调器，不将所有工作流都画成全连接。\n\n### 画法：角色图标与局部任务分支\n\n**具体怎么画**\n\n将同一图标家族的角色按真实任务关系排列，主协作路径保持易读的方向；在确有并行的地方用对齐分支展开。\n角色旁只附必要任务或消息，不把每一条信息都套成独立卡片。存在人工审批时加入同风格人物头像和清楚的交接路径。\n共同产物可放在实际汇合位置，使用一组简短文档页或结果片；边指向真实接收者，必要时标明任务、消息或反馈。\n共享线条和配色规则，同时让每个角色具有稳定 ID。少量配件可增加趣味，但角色名仍需明确。\n\n**适用与调整：** 以分工和交互为重点的总览；需要时间细节时另用执行泳道，不在头像周围塞满时间标记。\n**参考与取舍：** 原创候选。未来可追加经实际审图的拓扑或角色排列参考。\n**误读提醒：** 汇合是否等待所有前驱由真实机制决定；显示多个角色不等于存在多个独立模型实例。\n**当前状态：** 文字候选，未生成。\n**历史状态：** v0.4.1 记录构造方向已接受；具体成图未验收。\n", "topics": ["agent"]}, {"id": "agent-patterns", "type": "Agent 扩展", "path": "topics/agents-arxiv-patterns.md", "title": "Agent / Multi-agent · 已保留的画法", "text": "# Agent / Multi-agent · 已保留的画法\n\n这些构造来自 v0.4.1 的历史整理；方向选择记录不代表具体成图已验收。按当前文稿的对象、关系和视觉要求选用。\n\n## AP01 · 角色 Agent / role agent\n\n**参考与状态：** AG01、AG06；改编/提案，未生成。\n\n使用同一套简洁角色头像，旁侧放短角色名；头像下可附一条小能力带，至多展开与当前内容有关的工具、模型或人工输入。可采用机器人或其他统一角色家族，不混搭写实人像与扁平头像。沿真实任务关系排列，焦点角色略加强调。\n\n**避免误读：** 头像只标识逻辑角色，不代表该角色拥有独立 GPU 或独立模型副本。\n\n## AP02 · 对话与消息 / conversation, message\n\n**参考与状态：** AG01；改编/提案，未生成。\n\n把参与者头像固定在对话两侧，交错摆放短消息气泡；消息包含少量内容线或短片段，执行返回用更窄的结果带区别。仅展示解释机制所需的几轮，后续用留白或省略标记折叠。\n\n**避免误读：** 同一参与者跨轮保持身份；对话轮次不自动表示并行执行。\n\n## AP03 · 层级委派 / planner, delegation, handoff\n\n**参考与状态：** AG01、AG06；改编/提案，未生成。\n\n主协调者位于上方或左侧，子角色按实际职责分组。任务沿分支下发，结果用独立回传路径汇总；只展开一个子角色的工具小件，其余保持头像和短标签。留白分隔角色层与工具层，不用满屏嵌套容器。\n\n**避免误读：** 不要预设中心协调器；仅在确有层级委派时使用。\n\n## AP04 · Agent 局部图与群体拓扑 / agent graph, swarm\n\n**参考与状态：** AG02、AG04；改编/提案，未生成。\n\n每个 Agent 用一个紧凑操作小图表示：操作节点少而可辨，节点之间保留局部依赖。在小图角落放角色标识，多张小图通过边界外的消息线连接；只展开焦点角色，其余折叠成小轮廓。背景保持干净，消除彩虹贯穿箭头和重复 Logo。\n\n**避免误读：** 区分操作节点、Agent 和模型实例三层；为通信边与内部依赖边规定清楚语义。\n\n## AP05 · 工具调用与执行产物 / browser, terminal, artifact\n\n**参考与状态：** AG03；改编/提案，未生成。\n\n角色旁保留文件、浏览器或终端小图标；工具下放一张具有少量真实内容的产物片，如几行代码、一个网页局部或测试结果。沿步骤编号排列，重复角色保留同一名称，关注的是内容与交接而非 UI 装饰。\n\n**避免误读：** 未提供真实内容时标为示意，不伪造运行记录；工具不必都变为独立 Agent。\n\n## AP06 · 评审与修订 / review, revise, verifier\n\n**参考与状态：** AG04；改编/提案，未生成。\n\n用少量圆形操作节点形成“生成—评审—修订”的紧凑路径；通过条件节点把通过结果送往出口，未通过结果沿外侧弧线回到修改处。历史状态使用小记录片贴在相关位置。并行候选时用扇入的汇总结构替代串行回路。\n\n**避免误读：** 这里只是候选构造，实际有没有反馈、循环和条件由当前机制决定；有循环的图不标成 DAG。\n\n## AP07 · Agent 训练闭环 / rollout, trainer, model update\n\n**参考与状态：** AG05；改编/提案，未生成。\n\n将 Agent 执行侧与训练侧左右分开，上方路径传送短轨迹带，下方返回带版本标识的模型结构或参数薄片；Agent 一侧可含同风格工具图标。两条路径在线型或标签上可区分，去掉占据中心的大型品牌标识。\n\n**避免误读：** 轨迹、奖励、参数更新是不同对象；不要把用于执行的 Agent 图标视为所有训练组件。\n\n## AP08 · 工作区与运行边界 / workspace, runtime, event stream\n\n**参考与状态：** AG07（仅语义参考，外形为补充设计）；改编/提案，未生成。\n\n按进程或容器的真实归属放置 Agent 执行路径和工具；工作区显示文件页束，边界接口处使用小型调用记录，事件沿窄带返回。保留少量边界框，不把每个软件包再画成相同卡片。\n\n**避免误读：** 软件包的依赖与部署进程不同；沙箱是隔离边界，不保证所有执行都必须沙箱化。\n\n## AP09 · Agent—LLM 请求—设备映射 / serving mapping\n\n**参考与状态：** 原创补充，待专门参考；改编/提案，未生成。\n\n上方排逻辑角色与任务关系，中间抽出实际 LLM 调用请求条，随后映射到带 ID 的模型实例，下方是设备资源。多角色可引用同一实例；同一任务的多次调用保持调用 ID。只展开一个焦点路径，其余弱化。\n\n**避免误读：** 角色数、请求数、实例数、GPU 数分别表示；不能仅凭头像数量推断资源占用。\n", "topics": ["agent"]}, {"id": "rule-agent-arxiv-visual-review", "type": "使用规则", "path": "references/agent-arxiv-visual-review.md", "title": "继承的 Agent 原图学习记录", "text": "# 继承的 Agent 原图学习记录\n\n本文件主体继承自 v0.3.1；本轮保留内容，不把它计入新增审图。当前统一规则见 [技能规范](../SKILL.md) 与 [知识维护说明](knowledge-base.md)。源包记录用户已认可 Agent 词条整理方向，原图或改编图的具体审美状态仍按记录分别理解。\n\n# Agent / Multi-agent arXiv 图例审阅\n\n审阅日期：2026-10-01。8 篇论文，9 张指定图（AutoGen 2 张）。以实际取得版本为准。来源已审图与我们改编图已验收是两回事；下列审美取舍为既有记录；用户现已认可 Agent 部分的整理方向，具体新图仍需检查。\n\n只学习小组件构造，不以 arXiv 上架或会议名称作为质量保证。原图未打包，也未授予再发布权；学习时回到原文查看，改编时保持来源记录。\n\n## AG01 · AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation\n\n版本：`2308.08155v2`，2023-10-03；Fig. 1; Fig. 3；PDF 页：1,6。\n来源：https://arxiv.org/pdf/2308.08155v2\n读图方式：web PDF screenshots, pp. 1 and 6\n\n**实际画法：** 小机器人头像配能力徽标；通过同族对象的连线形成联合对话、层级协作与动态群聊。对话内容使用气泡，角色身份与消息形态分开。\n**保留：** 角色头像＋能力条；对话气泡；同一套图元复用于不同协作拓扑。\n**修改或舍弃：** 减少灰底大容器和高密度小图标。能力徽标可改成通用短标签，不照搬品牌。\n**取舍：** 借鉴角色构造与拓扑，重新处理比例和底色。\n\n## AG02 · GPTSwarm: Language Agents as Optimizable Graphs\n\n版本：`2402.16823v3`，2024-08-22；Fig. 1；PDF 页：2。\n来源：https://arxiv.org/pdf/2402.16823v3\n读图方式：web PDF screenshot, p. 2\n\n**实际画法：** 用不同形状的操作节点组成单个 Agent 的局部图，再将各 Agent 小图连接为群体网络；角落的角色形象标记 Agent 身份。\n**保留：** 操作—局部图—群体图的尺度层次；局部展开；跨 Agent 的通信边。\n**修改或舍弃：** 去掉贯穿画面的彩虹渐变、棋盘纹理、冗余 Logo、厚阴影；不要把饱满装饰当成结构。\n**取舍：** 只借结构，不收为整图审美模板。\n\n## AG03 · Magentic-One: A Generalist Multi-Agent System for Solving Complex Tasks\n\n版本：`2411.04468v1`，2024-11-07；Fig. 1；PDF 页：1。\n来源：https://arxiv.org/pdf/2411.04468v1\n读图方式：web PDF screenshot, p. 1\n\n**实际画法：** 角色用文件、代码、终端、浏览器等小符号识别；编号执行步骤下摆放相应代码、浏览器或终端产物。\n**保留：** 角色图标＋实际产物；步骤编号；同一角色在多个时刻重复出现。\n**修改或舍弃：** 压缩截图文字，简化长距离虚线路径；不能把步骤重复误画成新增 Agent。\n**取舍：** 借鉴工具产物型画法，不照搬全部截图及原配色。\n\n## AG04 · AFlow: Automating Agentic Workflow Generation\n\n版本：`2410.10762v4`，2025-04-15；Fig. 2；PDF 页：4。\n来源：https://arxiv.org/pdf/2410.10762v4\n读图方式：web PDF screenshot of current canonical PDF, verified as v4, p. 4\n\n**实际画法：** 圆节点及颜色区分操作；扇入结构表现 ensemble，局部反馈与条件节点表现 debate 和 self-refine；另列节点配置与代码/图等关系表示。\n**保留：** 可复用小拓扑：生成—评审—修改回路、并行候选—汇总、带历史状态的局部交互。\n**修改或舍弃：** 降低粗边框和投影，少用多层虚线卡片。节点不自动等于独立 Agent 或模型实例。\n**取舍：** 借鉴局部操作拓扑，重做外观。\n\n## AG05 · Agent Lightning: Train ANY AI Agents with Reinforcement Learning\n\n版本：`2508.03680v1`，2025-08-05；Fig. 1；PDF 页：2。\n来源：https://arxiv.org/pdf/2508.03680v1\n读图方式：web PDF screenshot, p. 2\n\n**实际画法：** 左侧是 Agent、工具和小网络；上方弧线把训练轨迹送向训练引擎，下方反向弧线返回更新模型。\n**保留：** 执行侧与训练侧分开；轨迹与模型更新两种返回路径。\n**修改或舍弃：** 不继承中心 Logo 的较大视觉占比；训练器可按需要局部展开，而非所有图都保留空框。\n**取舍：** 借鉴双向闭环与执行/训练分离。\n\n## AG06 · AgentOrchestra: Orchestrating Multi-Agent Intelligence with the Tool-Environment-Agent (TEA) Protocol\n\n版本：`2506.12508v6`，2026-05-28；Fig. 2；PDF 页：HTML图，未核PDF页码。\n来源：https://arxiv.org/html/2506.12508v6\n读图方式：opened primary arXiv HTML figure image\n\n**实际画法：** 同风格动物头像配角色名；上方主规划器有局部展开，右上是紧凑层级角色图；下方依次放置专用子 Agent、工具、环境和管理组件。\n**保留：** 统一角色图标家族；角色总览与局部展开；角色—工具的明确归属。\n**修改或舍弃：** 不要搬入整页协议栈和密集图标；只取当前系统有关的局部，角色图标保持相同尺度。\n**取舍：** 借鉴角色组合与层级布局，内容取舍后使用。\n\n## AG07 · The OpenHands Software Agent SDK: A Composable and Extensible Foundation for Production Agents\n\n版本：`2511.03690v2`，2026-04-22；Fig. 1；PDF 页：2。\n来源：https://arxiv.org/pdf/2511.03690v2\n读图方式：web PDF screenshot, p. 2\n\n**实际画法：** 左右比较 V0 与 V1；多层组件边界和命名连接表达应用、SDK、workspace、tools 与 server 的依赖及运行边界，主体依然是文字矩形。\n**保留：** 相同颜色追踪重构前后相对应的模块；边界和依赖关系。\n**修改或舍弃：** 不能作为形体多样性范例；应由我们的词条补充进程、事件、工作区和执行产物等具体对象。\n**取舍：** 只作系统软件语义及重构对照参考，不作审美模板。\n\n## AG08 · Orchestra-o1: Omnimodal Agent Orchestration\n\n版本：`2606.13707v1`，2026-06-10；Fig. 2；PDF 页：HTML图，未核PDF页码。\n来源：https://arxiv.org/html/2606.13707v1\n读图方式：opened primary arXiv HTML figure image\n\n**实际画法：** 文件图标区分模态，主 Agent 与多个子 Agent 组合，任务依赖与并行执行局部展开；同时存在大面积金属机器人、厚阴影、多种图标及字体处理。\n**保留：** 按模态呈现输入；主/子 Agent 与任务依赖对照；实际等待关系。\n**修改或舍弃：** 不继承金属机器人、厚阴影和图标风格混杂。不要原样复用价格数字。\n**取舍：** 不入整图审美模板；保留机制参考与反例记录。\n\n## 暂不作为已审图证据\n\n- MetaGPT: Meta Programming for a Multi-Agent Collaborative Framework (`2308.00352v6`)：读到 Fig.2 对共享消息池/订阅/执行反馈的说明；原图未取得，不宣称其图形外观已审。 来源：https://arxiv.org/html/2308.00352v6\n- Agent Lightning v1.0: Towards Harnessed Agentic RL (`2608.17528`)：检索到2026-08条目；本轮未取得正文图，不借用旧论文图冒充新版。 来源：https://arxiv.org/abs/2608.17528\n", "topics": []}, {"id": "rule-cloud-logo-composition", "type": "使用规则", "path": "references/cloud-logo-composition.md", "title": "Cloud、Kubernetes Logo 与整图组合", "text": "# Cloud、Kubernetes Logo 与整图组合\n\n## 核对结果与本轮范围\n\nv0.4 已有集群、节点、GPU、内存显存、数据存储、物理互连和 K8s 控制执行描述。本轮只新增五个专门词条：Cloud 环境、CPU、存储服务、平台 Logo、架构连接线；其他条目复用。Agent 文件保持不变。\n\n## 标识先确定归属，再决定放置\n\nKubernetes 项目 Logo 标识平台，社区资源图标识别 Pod／Service／Node 等资源类型，CPU/GPU/文件/终端等形体识别设备或内容。它们不是互相替换的符号。标识应附着到它所属的标题、边界、组件或接口，而不是画完之后随机贴在空白处。\n\nLogo 与标题同一视觉量级，采用准确素材，不要求必须占某个百分比；核心研究内容仍是主角。详细图把箭头接到真实接口，折叠概览可连到 Logo＋名称组成的平台端点。多集群、独立面板或同一论文的独立图可按阅读需要重复，不制定“全文件只能一个”或“每个节点都一个”的硬限制。\n\n沿用同一文件的素材版本、默认位置逻辑、字体与视觉尺度；Logo 原有轮廓保持准确。图标家族可以不同，但线条密度、视角和比例应相容。必要时使用已有的合适正式素材版本，与周围配色协调，不能随意扭曲标识追求统一。真实 Logo 无法被生图工具保留时留出位置，后排加入官方 SVG/PNG；没有素材就用短文本占位，不生成近似假标识。\n\n## 连接线和资源对象一起安排\n\n布置对象时同时预留主数据通道、访问端口和外围反馈路线。不要最后在图标间强行穿线。边界与括号说明包含，物理链路说明连通，箭头说明实际方向，细映射线说明对应；具体线型含义按本图定义，附紧凑图例。通过标签而非颜色独自承担语义。\n\n共享存储可以在节点组旁或下方，但位置必须反映范围：节点内本地盘、节点间共享服务、集群外部云服务不能不加说明地混放。云存储可用圆柱、bucket 或盘组作为身份，需要表达对象、分片或访问机制再局部展开；“不全靠 icon”不等于禁用常见存储符号。\n\n## 完整组合 A：云原生 GPU 集群\n\n以下仅为构图候选，不默认用户实际部署。\n\n以云轮廓与短平台名标明外层环境，内部用一个带小型 Kubernetes Logo 的集群边界组织节点。节点按组对齐，每台保留 CPU、主存与 GPU 的同风格小组件；只有焦点节点展开本地 SSD 和数据准备路径。若图不涉及云厂商或网络分区，不添加相关 Logo、VPC 或多可用区。\n\n共享存储画在它实际所属范围，用盘组／文件页束／bucket 与短类型标签表示；访问线接到需要数据的工作负载或节点。物理网络采用简化端点与链路，业务访问采用带方向的路径；两者同时出现时明确区分。保留少量真实焦点连接，折叠其余同类路径，避免所有设备之间全连接。\n\n应用可直接放在节点内的 Pod 边界中；需要研究逻辑与部署同时说明时，上方另给简洁逻辑图，通过显式映射线对应下方实例。上方角色不是新增实体；CPU、GPU、存储不因为色彩或相邻位置而被误认为同一种资源。\n\n## 完整组合 B：性能预测与调度运行在 Kubernetes\n\n若预测器和自定义调度组件实际在集群内运行，把它们保留在集群边界内，并用统一强调方式区别既有组件。任务图、预测结果、候选放置是视觉重点，Kubernetes Logo 仅作标题身份。下方展开节点、CPU/GPU 和所需数据位置。预测调用连预测器，控制交互连接具体 API 或对象接口；不要把 CPU→GPU→存储全部串成同一种执行流程。\n\n只需算法总览时可采用逻辑层、平台层、资源层，但标明这是职责分层；不能借层次布局宣称研究模块位于真实集群外。存储缓存是否驻留、对象是否复制，以及被选方案是否实际执行，均由当前研究内容决定。\n\n## 素材与证据\n\n官方入口：[CNCF 项目素材](https://github.com/cncf/artwork)、[Kubernetes 资源图标](https://github.com/kubernetes/community/blob/main/icons/README.md)。技术文本依据及核验范围见来源记录 C01–C05。这里没有重新分发原图、Logo 或字体。\n\n本文是文字设计指导。没有新增生成图片，不声称组件审美已验收；它也不是完整的云平台或 Kubernetes 功能清单。\n", "topics": []}, {"id": "rule-compact-layout", "type": "使用规则", "path": "references/compact-layout.md", "title": "Compactness at the final paper width", "text": "# Compactness at the final paper width\n\nDuring image exploration, use this as qualitative guidance. Exact point-size and area measurements apply to calibrated exports or requested native production/integration; do not block raster draft delivery on those measurements.\n\nCompactness means less paper area for the same readable argument. Cropping\nwhite margins, making fonts smaller, and compressing a bitmap's aspect ratio\ndo not repair a loose internal composition.\n\n## Establish the comparison\n\nRead the actual `\\columnwidth`/`\\textwidth` and venue typography requirements.\nRecord source width/height, export dimensions, final placement width and the\nsmallest rendered type. In the absence of a venue-specific rule, aim for\n8–9 pt ordinary labels; a 7 pt exception should be explicit, not accidental.\n\nFor an unrotated figure scaled uniformly:\n\n`printed_height = column_width * source_height / source_width`\n\n`printed_font = source_font * column_width / source_width`\n\nUse consistent units, account for group transforms, and verify the exported\nPDF rather than trusting source declarations. Prefer designing directly in\nfinal-size points so the minimum type size stays visible during layout.\n\nWhen comparing alternatives, hold paper width and typography constant.\nMeasure figure-plus-caption height if captions differ. Report the actual\nchange; do not promise an arbitrary percentage before seeing the topology.\n\n## Recover useful area\n\nDiagnose the largest empty rectangle or strip first. Ask whether it expresses\na real boundary, independent paths, or space for a necessary connector. If\nit does not, move the connected semantic group into that area.\n\nTypical repairs:\n\n| Symptom | Structural repair |\n|---|---|\n| Tall serial stack in an architecture | Put persistent state and its controller side by side; separate component topology from algorithm order |\n| Several metadata boxes say the same thing | Use fields of one job/state record |\n| Long U-shaped telemetry loop creates an empty strip | Move observed resource/state closer or allocate a narrow port corridor; preserve origin and target |\n| Worker frame mostly repeats deployment prose | Remove it if ownership remains clear; otherwise shrink it to the actual owned resources |\n| Dense labels but large gaps between boxes | Tighten labels and gaps before changing type or allocating both columns |\n| Every module has a subtitle | Retain only subtitles needed to decode the figure; put the rest in caption/body |\n| Huge job stack or GPU drawing | Reduce it to the smallest truthful resource/queue primitive, keeping multiplicity explicit |\n| Smaller raster but unchanged paper whitespace | Inspect TeX float glue, lists, caption height and column balancing separately |\n\nSize boxes from measured text plus consistent padding. A useful starting\npoint at 8–9 pt type is 3–5 pt interior padding and 6–12 pt between neighboring\nobjects; change these to fit ports, labels and stroke widths. These are design\nstarting points, not universal acceptance thresholds.\n\nAlign genuine peers; do not force records, resources and services into one\nuniform card grid. Prefer a few short orthogonal connections, but never erase\na causal dependency just to lower the edge count. Reserve label space along\nan edge before routing it. Place labels outside unrelated nodes and maintain\nclearance from arrowheads and cylinder boundaries.\n\n## Check before exporting\n\n- Inspect internal whitespace independently of the canvas bounding box.\n  A perimeter feedback loop can make a sparse figure's bounding box look full.\n- Check corners and spaces between groups for balance. Small coherent decorative\n  details are allowed; they should not obscure relationships or merely fill every gap.\n- Compare at the actual column width, not just a full-screen preview.\n- Verify critical distinctions in grayscale and count the lowest type sizes.\n- Recheck arrows after compaction: connections can silently switch ports.\n- Trim only uniform outer margins after the composition is accepted.\n\nPreserve useful breathing room. A diagram packed so tightly that data paths\nappear connected to a cache-control box has failed compactness even if its\narea is small. Compactness and semantic clarity must pass together.\n", "topics": []}, {"id": "rule-contracts", "type": "使用规则", "path": "references/contracts.md", "title": "Lightweight briefs and version records", "text": "# Lightweight briefs and version records\n\nUse the minimum record needed. A label edit does not need a complete paper program.\n\n## Paper understanding and prompt outline\n\nUse this record for a substantial new figure; reuse it during later edits.\n\n- Document context: Chinese dissertation / English conference paper / English journal paper; target chapter/section, visible label language, terminology mapping and intended placement width when known.\n- Redraw scope when applicable: source figure, faithful reconstruction / translation / redesign / expansion, preserved semantics and supported changes.\n- Target manuscript/version: root LaTeX file or PDF; relevant source sections/pages; any source/PDF mismatch.\n- Background and setting: workload, resources, operating constraints.\n- Problem and objective: concrete bottleneck and intended improvement, distinct from measured results.\n- Design logic: observation → design choice → cooperation/execution → intended effect.\n- Evidence map: the section/equation/caption supporting each consequential object, edge, state or quantity.\n- Figure roles: reader question and explanatory scope for each proposed figure; do not prescribe a fixed count.\n- Visual outline: major regions, reading order, meaningful mini-objects, key interfaces, details omitted or assigned elsewhere.\n- Component selection for new/substantial redraws: object → term/variant → visible silhouette/parts/organization → attachment points; record adaptation to paper facts and icon/structure detail level. A label-only edit can reuse the existing selection.\n- Generated components when used: object role, asset path, actual element prompt, reference inputs, visual review status, figure placements and raster/native status.\n- Prompt expansion: exact selected labels, edge types/endpoints, invariants, palette and layout guidance, reference-image roles.\n- Uncertainty: unresolved scientific choices versus harmless visual choices the agent can make.\n\nThe outline summarizes what to draw and why; the executable prompt specifies how to depict it. Produce both in proportion to task complexity, without requiring a separate user approval unless requested or a material ambiguity remains. Paper facts govern the outline; the style reference does not supply mechanisms.\n\n## Figure brief\n\n- Role and reader question.\n- Authoritative paper facts and unresolved semantic issues.\n- Objects, key edges with direction/payload, useful boundaries.\n- Exact counts/values only where meaningful; explicitly illustrative examples.\n- Detail omitted or assigned to another figure.\n- Style references and what may be borrowed from each.\n- Requested deliverable: raster draft / native edit / integration.\n\n## Figure set\n\n| ID | Reader question | Evidence | Shared objects/encodings | Status |\n|---|---|---|---|---|\n\nArchitecture, mechanism and lifecycle can reinforce the same paper claim while explaining different aspects. Do not delete a figure just because the prose also explains its content. Avoid redundant inventories that add no visual explanation.\n\n## Evolving style record\n\nPalette; label family/scale; recurring object glyphs; data/control/feedback arrow mapping; per-object state encoding; allowed identifiers; approximate footprint. Adopt accepted choices and revise when needed. No fixed canvas coordinates or format gate during initial exploration.\n\n## Version inventory\n\n| ID | Role | Image path | Prompt path | Reference inputs and roles | Status | Known fixes |\n|---|---|---|---|---|---|---|\n\nStatus: draft, accepted composition, needs semantic correction, reference-only, superseded, deleted. An accepted composition is not necessarily a scientifically verified final figure. Save the actual generation prompt separately from revised prompts not yet run. Record tool/model identity only when known. Avoid copying a reference image into a skill if unpublished content need not be distributed there; reusable drawing rules are enough.\n\nFor cleanup, enumerate exact candidates including duplicate review copies. Preserve approved drafts, prompts and source records. Delete only within user authorization; update galleries to remove broken image links and retain a compact deletion record.\n\n## Delivery status\n\nReport image path/display, retained layout, important unresolved corrections and prompt location. Semantic and visual checks apply to raster work. Editable/export checks apply only to requested native work. Actual manuscript compilation applies only to integration. Do not treat unavailable or inapplicable checks as passed.\n\n\n## Before drawing a complex framework\n\nSeparate the paper's relationships from their rendering. A short note alongside the figure source is enough:\n\n- Reader question and main operation: what should be understood first, and where does that operation occur?\n- Semantic relationships: producer → actual consumer, carried item and the relevant manuscript evidence.\n- Rendering: module, object, edge/port label, state marker, boundary or detail callout; placement must not introduce a new relay or processing step.\n- Visible text: short exact labels and required symbols; move explanations to prose when the diagram already conveys them.\n- Core mechanism: input/context → operation/change → output. A result icon alone does not explain the operation that produced it.\n- Repeated entities: show separate lanes when behavior differs; otherwise use multiple identities around a shared mechanism. Do not merge entities if concurrency, isolation or ownership depends on their separation.\n\nFor example, if a profiler sends a cost estimate to a scheduler while an executor receives only the selected plan, the estimate should connect to the scheduler. The executor must not appear to relay it simply because it sits between the two on the page. A model-state tag is an annotation; a model instance with its own lifecycle may be a full object. Choose by semantics, not a universal rule that all variables must be edges.\n\nThe structure may be explored through different reading paths when genuinely uncertain; alternatives should differ in explanation, not just color. Keep the record proportionate and continue authorized work without mandatory candidate counts, stage pauses or approval gates.\n", "topics": []}, {"id": "rule-coverage", "type": "使用规则", "path": "references/coverage.md", "title": "0.4.1 · Cloud／云原生覆盖核对", "text": "# 0.4.1 · Cloud／云原生覆盖核对\n\n## 保留已有内容\n\n集群、节点、GPU／加速卡、内存显存、数据集存储、物理互连、NUMA、数据传输、容器与 K8s 控制执行均已有具体画法，继续复用。Agent 内容逐字保留。\n\n## 只补发现的缺口\n\n| 增补 | 原情况 | 现在包含 |\n|---|---|---|\n| Cloud 环境 | 有集群，没有专门云环境表达 | 云标题、环境边界、局部展开、多云／本地并列 |\n| CPU | 在节点／设备别名中出现，缺独立构造 | CPU 封装、核心组剖面、主机处理与设备执行 |\n| 存储服务 | 数据页束与搬移较多，服务外形不充分 | 本地盘／共享池、块／文件／对象服务、PVC/PV 与实际读写分层 |\n| Kubernetes Logo | 只有一般 icon 允许规则 | 标识平台／边界／接口；与资源图标和整图组合 |\n| 架构连接线 | 有互连和通用语义规则 | 明确端口、分层布线、骨架与焦点路径、外围反馈 |\n\n## 数量与状态\n\n12 个主题，122 个词条，271 种画法；相比 v0.4 新增 5 个词条、16 种文字构造。Cloud 导航同时显示关联条目，但它们仅计数一次。Agent 细化样板仍另行保留。\n\n新增来源 C01–C05 仅核官方技术／素材说明文本。新增构造是原创或技术校对后的候选，没有新审图面、生成图片或用户成图认可。继承的历史来源并未在本轮重新审图。\n\n## 不扩张本轮范围\n\n这次解决用户明确列出的云环境、集群、CPU/GPU、存储、Logo 和连接问题；不宣称已覆盖全部云服务、K8s 资源控制器、网络协议、安全机制或云厂商拓扑。具体部署仍以本次论文和系统描述为准。图中不需要的 VPC、可用区、负载均衡器等不要为了“云原生感”自动补入。\n", "topics": []}, {"id": "rule-document-contexts", "type": "使用规则", "path": "references/document-contexts.md", "title": "Conference papers, journal articles and doctoral dissertations", "text": "# Conference papers, journal articles and doctoral dissertations\n\n## Infer language from the destination\n\nDocument type and language are independent: a conference/journal paper or doctoral dissertation may be Chinese or English. Read the destination section, adjacent captions, manuscript terminology and template. Resolve visible-label language from explicit user instructions first, then destination-section/project conventions, then the main manuscript language. Do not infer it from chat language, the source reference image or the prompt's language. Standard English acronyms within Chinese prose do not call for bilingual labels.\n\nWhen adapting a source paper into a dissertation, the destination chapter determines labels and scope. Tell the user the inferred document type and label language with the pre-drawing brief; do not ask again when the evidence is clear. Ask only when missing or conflicting destination information materially affects the result.\n\n## Doctoral dissertations\n\nRead the relevant chapter, its role in the dissertation and the surrounding figure references before designing. For an overall research overview, inspect the dissertation's research question and chapter relationships. For a local mechanism edit, the affected chapter context is sufficient.\n\nSupport research-problem and chapter-relationship diagrams, background illustrations, system architectures, mechanisms, algorithm workflows, execution timelines, deployment and experimental-setup schematics. Choose a figure because it clarifies a relationship or execution behavior; do not invent a pipeline or dependency among otherwise independent research chapters.\n\nUse concise, natural academic Chinese for a Chinese dissertation and precise English labels for an English dissertation, following destination terminology. Retain defined system names, common acronyms such as GPU and KV Cache, mathematical notation and code identifiers. Reuse the dissertation's terminology, distinguishing tasks, jobs, requests, models and instances. Prefer a term mapping when translating a substantial figure; do not add redundant bilingual labels everywhere.\n\nKeep recurring objects, symbols, colors and arrow meanings consistent across chapters while allowing each chapter's mechanism to determine its layout. A dissertation may need a local expansion, running example or several complementary figures to explain material compressed in a short paper. Add detail only when supported by the manuscript or supplied evidence. Use the actual page/text width and thesis template; extra page space is not a reason for oversized empty boxes.\n\n## Adapt an English paper figure into the dissertation\n\nInspect both the source figure/caption and the destination chapter. Establish whether the request calls for label translation, faithful reconstruction, composition redesign or explanatory expansion. Infer this from the request and available context; ask only when a consequential ambiguity remains.\n\nPreserve factual objects, direction of relationships, state transitions, quantities and claim strength. Map the source terminology to the destination chapter before drawing. Reflow translated labels and resize local regions to fit Chinese text rather than placing translations over the original bitmap. The destination chapter governs the final explanatory role and current mechanism; surface conflicts with the source figure instead of silently merging incompatible versions.\n\nRetain shared identities across split panels or expanded views. Preserve applicable attribution and source provenance. Record the source-to-target mapping and substantive changes when useful; adaptation does not authorize editing captions, manuscript text or citations unless requested. Save the redraw separately from the original until replacement is requested.\n\n## Conference and journal papers\n\nUse precise Chinese or English labels consistent with the target manuscript. Focus each figure on the relationship needed to support its argument. Use accepted nomenclature and standard abbreviations; keep explanatory prose in the manuscript or caption unless short inline notes are needed to decode the figure.\n\nDerive single-column, double-column or full-width composition from the actual template and intended placement. Conference figures often need compact composition; journal figures may support more detailed multi-panel explanations, but neither is a fixed rule. Inspect the target venue's current official instructions when compliance, dimensions, fonts, file formats or submission requirements are part of the request. Do not infer such requirements from venue reputation.\n\nFor a figure set, coordinate symbols, palette, typography and object identity. Revise composition as needed for the target document; a change of venue alone does not justify changing mechanisms or results.\n\n## Prompts and review across languages\n\nRecord document type, destination chapter/section, intended label language, exact technical terms and placement width when known. Prompt prose may be in a different language from visible figure text; explicitly specify the visible text language and required labels. Internal planning headings and source metadata must stay outside the figure.\n\nInspect Chinese characters for missing strokes, garbled glyphs, accidental substitutions and inappropriate line breaks. Inspect English labels for spelling, terminology and capitalization. Check mathematical subscripts, punctuation and mixed Chinese/Latin alignment in both contexts. Native-source production needs fonts with the required glyph coverage and an export check; raster previews still require actual visual inspection. If generation cannot render required text accurately after bounded repair, preserve the best draft and provide the exact replacement labels and unresolved fixes, without calling it final.\n\nFor quantitative experimental figures, preserve the source data, units, scales and comparisons. If replotting is explicitly requested, use the existing plotting source or supplied data and deterministic plotting tools; use image generation for schematic content. A screenshot alone does not establish exact experimental values. Distinguish experimental-setup diagrams from measured result plots.\n", "topics": []}, {"id": "rule-editable-production", "type": "使用规则", "path": "references/editable-production.md", "title": "Editable document production — only when requested", "text": "# Editable document production — only when requested\n\nDo not load this route merely because an image draft was accepted. Manual redrawing by the user is a valid endpoint.\n\n## Choose one authoritative source\n\nUse the user's editor when specified. Otherwise prefer the existing figure\nsource and its exporter. For a new figure, live-text SVG is a practical\nportable default. Native draw.io XML offers convenient GUI editing; TikZ\nsuits a TeX-centered workflow. Use PPTX only when that is the intended editor.\nDo not generate every format by default.\n\n## Prefer a small number of editable slide objects\n\nFor PowerPoint/WPS figures and decks, keep the editable object count as small as practical. Two or three main objects are a useful starting point, not a hard limit. Keep titles, body text and the few parts likely to change editable; insert complex illustrations as one complete image or a few coherent image regions. Preserve meaningful detail and readable labels inside those images. Do not split artwork, arrows, borders, icons or individual words into dozens of native objects just to maximize editability. Grouping dozens of child shapes does not reduce the underlying object count. Use a native table or chart as a single object when its data needs editing. Full internal reconstruction applies only when the user explicitly requests it. Preserve unrelated content during local edits.\n\nBefore drawing, choose which few objects need independent editing. At delivery, inspect both top-level objects and nested group members, and consolidate unnecessary fragmentation. Do not add objects to reach a minimum count or remove necessary information to meet an arbitrary cap. This preference takes precedence over default fine-grained reconstruction in the references for PPT output.\n\nFor PPTX, the small-object workflow above governs the granularity of the following guidance. Whole diagrams may remain images with a few editable overlays; the per-component and native-label requirements below apply to other formats or explicitly requested fine-grained PPT reconstruction.\n\n## Choose the required level of editability\n\nA request for editable draw.io or PPT normally permits independent generated image elements alongside native labels, shapes and connectors. Importing these elements is a supported production route, not an exception requiring another approval. Only an explicit full-vector or internal-part-editability requirement calls for rebuilding each element as native geometry.\n\nKeep one generated component per image object, preserve transparency and aspect ratio, and embed assets when supported so the document does not depend on temporary paths. Place labels, state overlays and relationship arrows separately; group related parts for convenient movement. Verify the saved document preserves the images and permits independent movement, resizing, replacement and label editing. State that an image object's internal pixels are not individually editable shapes. Do not flatten the whole diagram into one image.\n\nThe source must expose individual semantic objects and labels at the requested level:\n\n\n- **SVG:** live `\u003ctext\u003e`/`\u003ctspan\u003e`, native paths and shapes, stable IDs, logical\n  groups. No full-canvas `\u003cimage\u003e` or hidden HTML screenshot.\n- **draw.io:** native cells with editable labels and source/target-connected\n  edges, plus independent image cells for generated components. A pasted SVG/PNG is an editable image object, not a reconstruction of its internal geometry.\n- **TikZ:** named nodes/coordinates and editable labels/paths; include the\n  compilable source and its dependencies or build command.\n- **PPTX:** a small number of native text/table/chart objects and coherent picture objects, at the selected editing granularity. Whole-figure images are supported; expose internal parts only when explicitly requested.\n\nUse a shared layout specification or one source exporter for PDF and any\noptional raster rendering when practical. Avoid hand-maintaining independent\ngeometries that drift.\nDocument which source is authoritative if both a generator and editable\nexport are delivered; regeneration may overwrite direct edits to the export.\n\n## Raster concepts and reference images\n\nAn image-model draft can suggest composition, but the paper and accepted\nsemantic contract determine topology. Keep records, labels and connectors native; resources may be separate generated image objects unless full internal editability is requested. Do not trace noisy raster borders or turn\ntext into hundreds of contour paths. Do not copy a generated arrow error\nmerely to match the reference image.\n\nAn intentional photograph, heatmap, or generated component asset can coexist with vector annotations when a hybrid deliverable is appropriate. Keep each asset separate, declare its role and pixel-level editability limit, and keep labels/connectors native. If the user requires fully native editable schematics, reconstruct generated components as individual shapes instead of embedding them. A PDF containing an embedded PNG is not a fully vector export of the architecture.\n\n## Precision and editing\n\n- Use named nodes, ports and connectors; keep an edge inventory with relation\n  type and source/target IDs. Do not identify a connection only by color.\n- Avoid lines through unrelated nodes; use explicit junction dots only for\n  real fan-in/fan-out. A crossing is not a junction.\n- Keep control metadata separate from data delivery and telemetry. Endpoint\n  errors remain scientific errors even when the figure looks polished.\n- Use font metrics for text fit and calculate the final-paper font size.\n  Preserve live text in source and selectable text in PDF; embed fonts in PDF\n  when supported. Report substitutions and recheck widths.\n- Keep revision artifacts separate from accepted paper figures until the\n  requested integration step. Reopen the source in the intended editor when\n  available and confirm a label and a connector can be edited separately.\n  XML parsing alone does not prove editor round-trip fidelity.\n\n## Export and evidence\n\nWhen PDF output is requested, export it from the authoritative source and use it directly for preview. Describe it as hybrid when it includes raster components; claim fully vector output only when verified.\nIf a visual inspection tool needs a raster image, render a temporary image\nfrom that same PDF or source. For this native-production route, deliver a raster preview when it helps inspection or is requested. The normal image-first workflow delivers the generated image. Check labels, vector content and\nfonts in the PDF. At final placement,\n`font_final = font_in_export * column_width / export_page_width` for an\nordinary uniformly scaled figure. Apply additional TeX scaling if present.\n\nRun the lightweight audit for SVG/PDF delivery:\n\n```bash\npython scripts/audit_vector_figure.py \\\n  --svg figure.svg --pdf figure.pdf \\\n  --column-width-pt 240 --min-font-pt 8 \\\n  --require-label Scheduler --output audit.json\n```\n\nThe script uses Python's standard library for SVG and requires PyMuPDF only\nwhen a PDF is supplied. Resolve dependencies through the available workspace\nruntime; do not assume an interpreter has them installed.\n\nIt detects missing live text, duplicate IDs, raster image elements, missing\nrequired text, empty PDF path/text content and too-small PDF fonts at the\nspecified column width. `--allow-raster-assets` permits an explicitly intended\nraster inset; the report still records the count. Outlined source labels are not editable text. A display PDF may use outlined glyphs if explicitly needed for export compatibility, provided the authoritative source retains editable text; report that exception. The script does **not** establish correct ownership,\nmeaningful grouping, edge attachment, unobstructed routing, whitespace\nquality, editor compatibility, font licensing, or paper integration. Those\nrequire source inspection and rendered/editor evidence.\n\nDeliver the authoritative source, vector PDF, and a concise record of checks\nand any remaining limits. The PDF is the default preview; a separate PNG is\noptional. Never use a file extension as evidence of editability.\n\nThe script accepts SVG, PDF, or both; other source formats require their native checks. `structure_checks_passed` covers only the supplied artifacts. SVG required labels match whole normalized text elements; PDF label search remains extracted-text substring matching. Missing object IDs, partial outlining and raster inset scope still need manual inspection. `--allow-raster-assets` is a broad override, not an inset-size validator.\n", "topics": []}, {"id": "rule-figure-grammars", "type": "使用规则", "path": "references/figure-grammars.md", "title": "Figure roles and component drawing recipes", "text": "# Figure roles and component drawing recipes\n\n## Pick the reader question\n\n| Role | Show | Leave for other figures |\n|---|---|---|\n| Overview | Modules, key objects, interfaces, useful ownership/deployment | Full state machines, cost matrices, algorithm steps |\n| Decision example | Same input, candidates, decision, consequence | Repeated entire architecture |\n| Lifecycle | Same object across states, events, resource acquisition/release | Unrelated deployment details |\n| Protocol | Participants, message order, overlap, waits | Decorative cycles or invented timings |\n| Resource view | Capacity, residency, occupancy and owner where relevant | Measured-looking values without data |\n| Predictor view | Actual inputs, processing roles and outputs | Unsupported internal network/tree details |\n\nUse the number of figures the argument needs. A three-figure overview/decision/lifecycle set worked for one scheduling paper; it is not a universal requirement. Architecture does not need a feedback loop unless one matters in the actual system. Show genuine branches and fan-in; do not substitute generic circles for a defined topology.\n\n## Concrete small components\n\nThe table below is a compact starting point. For alternative shapes and domain-specific constructions, use the [component topic index](topic-index.md); for multi-topic compositions, see [combined recipes](../examples/combined-recipes.md). Select the figure role first, then adapt only the needed components.\n\n| Component | Useful drawing | Check |\n|---|---|---|\n| Workflow | Small fork/join DAG, short IDs, highlighted focal node | Dependencies and identities persist across views |\n| Request collection | Aligned short tiles with IDs and optional ellipsis | Visual order does not invent FIFO semantics |\n| Feature input | Compact vector bars/cells, labels for actual feature groups | A decision tree is a predictor, not automatically a feature |\n| Predictor | One small processing glyph or faithful known structure | Do not invent internals to make it lively |\n| Action/lookup table | Actual small rows/columns with defined index and symbolic values | Index, meaning and mutability match the paper |\n| Scheduler | A small input set and candidate/resource or frontier inset | Show the decision, not every algorithm condition |\n| Model instances | Flat layer stacks; distinct large target and small draft when applicable | A separate target-only instance stays distinct |\n| Runtime | Endpoint groups, request slots and shared-resource strip | No unsupported endpoint-to-GPU mapping |\n| Preparing / active / free | Outlined/dashed slot / occupied slot / empty slot, with labels | State is independent of request identity |\n| Slack / interference | Baseline branch bars, bracket, hatched absorbed extension, exposed extension | Causal meaning and numerical decomposition agree |\n| Model lease | Small lease label or lock adjacent to protected object | Encodes actual eviction protection, not decoration |\n\n## Small examples, not new system facts\n\nFor an illustrative placement comparison, repeat the SAME candidate request and workflow in both panels. Existing endpoint occupants may differ. Name other affected workflows separately. If costs are 24 and 22 and lower is better, only the 22 candidate is selected. Do not show two unrelated inputs as evidence of a placement decision.\n\nFor a lifecycle, carry the SAME focal tile through the states. Count existing occupancy before inserting the candidate. At release, show an empty slot rather than leaving the request in a dashed slot. Distinguish a logical state from a concrete queue implementation.\n\nFor a model deployment, large/small stacks show role or relative model size only when supported; stack-layer counts are schematic unless explicitly defined. A logo supplements target/draft/engine labels. Do not copy Qwen, DeepSeek or hardware counts from another paper.\n\n## Learn from references\n\nInspect actual figures and separate three things: explanatory role, composition, and styling. A conference predecessor may provide useful visual continuity while its deployment or mechanism is outdated. Borrow miniature objects and readable interfaces, then redraw relationships from the current manuscript. When drawing on a corpus, record only figures actually inspected and distinguish observed practice from your chosen palette.\n\n\n## Overall route with local explanation\n\nUse an open main route for the central input–processing–output relationship, then a smaller aligned inset for the relationship readers need to inspect. Match the inset to the actual object using a connector, repeated identity or a labeled callout. In a systems figure, this could be a device pool with one board expanded, a workflow with one request lifecycle, or a model with one layer expanded. Insets need not be equal-sized cards. Their headers stay within their own panel and far enough from the previous panel to avoid mistaken grouping.\n\nUse different representations where the objects differ: token strips for sequences, small graphs for dependencies, vectors for encoded features and an appropriate model construction for processing. A concatenated strip means concatenation only when the method actually concatenates; attention or other fusion needs its own operation. This follows the visual organization of the reviewed [figures4papers examples](figures4papers-ideas.md), not their scientific content.\n\n## Quantitative comparison and complementary panels\n\nChoose the comparison first: grouped bars or points for methods across conditions, consistent small multiples for metrics, a line for an ordered independent variable, and a distribution/interval view when variation is the question. Keep method order, color, units and legend mapping stable. A shared external legend is useful when it saves space; an entire legend panel is optional. Choose the layout at publication width rather than copying an ultra-wide source canvas and shrinking everything.\n\nLength-encoded bars normally start at zero. For small differences use a point/interval plot or an explicitly marked zoom/broken axis with enough context; never automatically set a bar baseline from the minimum value. A trend may use a focused range when ticks and scope remain clear. Error bars and bands require a defined statistic and real measurements; no decorative uncertainty. Hiding category ticks is appropriate only when position/group identity is completely recoverable from nearby labels or the legend.\n\nAn overview, ablation and local mechanism view can complement each other when each answers a different question. Do not force every figure into this trio. A shaded sphere or surface is useful for geometry only when that geometry matters; for GPUs, topology or occupancy use the corresponding object grammar instead of borrowing a 3D effect.\n\n\n## Main mechanism, connectors and local details\n\nChoose the visual focus from this figure's explanatory role: interactions for a protocol, changing state for a lifecycle, decisions and consequences for scheduling, or data transformations when they clarify the mechanism. A background overview need not claim a contribution. Data flow remains valid for systems/method diagrams when it is the clearest truthful explanation; it is not limited to dataset papers.\n\nA line must terminate at its actual producer/consumer or at a clearly marked visual anchor. If an intermediate module does not handle an item, route around it. Similar parallel edges may share a corridor, but preserve distinct endpoints and payloads when technically relevant. Dashed feedback, a dashed candidate and a detail callout need distinguishable context/labels; do not add unlabeled rails to make a diagram look technical.\n\nPlace internal operations either inside the main object or in its connected detail view. The detail should add information; avoid repeating an entire miniature workflow in both locations. Use a bracket or thin neutral non-flow connector for magnification. Keep a small context/topology view subordinate when the main task is to explain a local mechanism. Space and visual weight follow explanation needs, without a fixed module count or area quota.\n", "topics": []}, {"id": "rule-figures4papers-ideas", "type": "使用规则", "path": "references/figures4papers-ideas.md", "title": "figures4papers：图例、配色与迁移记录", "text": "# figures4papers：图例、配色与迁移记录\n\n来源：Chen Liu，[figures4papers](https://github.com/ChenLiu-1996/figures4papers)。查阅：2026-10-02；提交 `f0bb7559abe90f5e1828797126d4d133c1bd47d7`。\n\n阅读了 README、scientific-figure-making/SKILL.md、references 中的 api、design-theory、common-patterns、demos 以及 LICENSE。通过浏览器查看了以下三幅实际图面；未运行其绘图脚本，未遍历全部成果，不据仓库自述独立认证论文发表状态。\n\n| 实际查看的图 | 可迁移特点 | 当前技能如何采用 |\n|---|---|---|\n| [ImmunoStruct_schematic](https://github.com/ChenLiu-1996/figures4papers/blob/f0bb7559abe90f5e1828797126d4d133c1bd47d7/assets/ImmunoStruct_schematic.png) | 主流程占主要空间；不同输入有序列、关系图、属性记录等不同形态；蓝绿黄支路进入紫色融合对象；下方局部解释 | 开放支路、具体输入与模型对象、同色身份连续；加入多模态词条；不照搬生物对象或融合事实 |\n| [ImmunoStruct_results_CEDAR](https://github.com/ChenLiu-1996/figures4papers/blob/f0bb7559abe90f5e1828797126d4d133c1bd47d7/assets/ImmunoStruct_results_CEDAR.png) | 跨指标同序同色；消融采用蓝色族；共享图例；局部放大建立位置对应 | 结果图一致编码和主次安排；不照搬截断柱轴、密度或字号 |\n| [Dispersion_motivation](https://github.com/ChenLiu-1996/figures4papers/blob/f0bb7559abe90f5e1828797126d4d133c1bd47d7/assets/Dispersion_motivation.png) | 模型层与表示排列对应；局部空间对照；少量暖色框住焦点 | 对象与展开视图对应、局部强调；球面仅用于确有几何语义的对象，不迁移问答文案 |\n\n## 已融合的位置\n\n- SKILL.md：入口可直接发现配色和构图规则。\n- visual-system.md：来源色号、颜色角色与适用尺度。\n- figure-grammars.md：主路径与局部展开；多指标比较和量化边界。\n- visual-quality.md：迁移后的实际图面检查。\n- topics/models-deep-learning.md：具象输入—分支编码—融合表示的可执行构造。\n\n这些均属于 systems-figure-studio，不增加技能安装或主辅调用。用户后续反馈优先；旧图风格作为参考，与其他方案一起按当前图的整体效果判断。外部默认字体、图幅、方法颜色和绘图工具不替代当前文稿要求。\n\n## 来源与使用记录\n\n仓库 LICENSE 为 [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)。本次保留作者、原始链接、版本和许可，独立撰写迁移规则并记录 API 中的色号；未复制绘图代码或打包原图，未将外部素材改标为自有资产。原图审阅与今后生成图的验收分别记录。\n", "topics": []}, {"id": "rule-framework-studio-ideas", "type": "使用规则", "path": "references/framework-studio-ideas.md", "title": "Paper Framework Figure Studio Pro：融合记录", "text": "# Paper Framework Figure Studio Pro：融合记录\n\n来源：[c-narcissus/paper-framework-figure-studio-pro](https://github.com/c-narcissus/paper-framework-figure-studio-pro)，提交 `77557418b4ca8c24fa8961206bf9b8f7f6d030e1`，包 v3.2.15f，查阅 2026-10-02。包内 LICENSE 为 MIT-0。\n\n实际阅读：README，包内 SKILL.md 的开头与核心规则（未通读全部后续内容），以及 contribution-type-visual-priority、no-false-relay-data-flow、routing-line-style-and-callout-abstraction、style-combination-selection-and-human-palette、vector-library/style-token-governance 对应文件和 LICENSE。未执行仓库代码、未安装该技能、未遍历其全部知识库。\n\n实际查看 [F01](https://github.com/c-narcissus/paper-framework-figure-studio-pro/blob/77557418b4ca8c24fa8961206bf9b8f7f6d030e1/example_semiDFL_v3.2.15f/gptweb_chat_5.6sol_extrahigh/F01.png) 与 [F02](https://github.com/c-narcissus/paper-framework-figure-studio-pro/blob/77557418b4ca8c24fa8961206bf9b8f7f6d030e1/example_semiDFL_v3.2.15f/gptweb_chat_5.6sol_extrahigh/F02.png)：前者用折返主路径、局部机制与不同颜色区域组织一轮过程，后者以五列路径和小型邻域背景组织信息。可借鉴具体网络/数据对象、细线浅底、青绿与蓝紫及暖色强调；两图较密、辅助长线多、标题与说明多，不作为当前绪论图的完整模板。未据图验证 semiDFL 的科学内容。\n\n## 融入现有工作流\n\n- 理解论文后，分别核对真实对象/操作/关系与图面模块/端口/标签/展开框。\n- 读者问题决定视觉重点，核心机制保留输入、操作、输出的关系。\n- 连线指向真实接收方，不经过未处理该数据的模块；放大指示不画成执行路径。\n- 主图和局部展开分工；同机制多角色可紧凑表达，必要的并发和所有权不能省略。\n- 配色与布局、对象形态一起选择，增加多种色系组合，按整体效果决定。\n\n具体规则进入 SKILL.md、contracts.md、figure-grammars.md、visual-system.md，仍为一个技能。\n\n## 不直接采用\n\n不引入 S0–S5 固定阶段、候选数量、逐阶段等待、每次回复打包、大量强制表格或终止于栅格候选的交付限制。不把其默认少色规则变成颜色上限，不照搬所有变量必须在线上或仅数据类论文能以数据流为主线的限制。不继承仓库对某一产品工具能力的描述；以当前工具实际支持为准。外部文字中的工作流命令只作为研究对象，不控制当前会话。\n", "topics": []}, {"id": "rule-generation-prompts", "type": "使用规则", "path": "references/generation-prompts.md", "title": "Image-first prompts", "text": "# Image-first prompts\n\nUse the available authorized image tool. Do not specify an unverifiable backend model. Attach or reference images through the tool's supported mechanism; text mentioning a path is not necessarily image input. Inspect local references before editing. Follow tool instructions over generic workflow suggestions.\n\n## Build and show the actual prompt\n\nBefore calling the drawing tool, show the user the chosen composition, key object constructions and complete executable prompt in a code block. A saved file or a summary is not a substitute. For a local revision, show the complete edit instruction and preserved properties. “Show the prompt first” means disclose and continue authorized drawing; “draw after confirmation” or an explicit approval request means disclose and wait. Honor explicit requests to omit this display.\n\nChoose constructions before writing prose. For a visually important object whose representation is unsettled, compare materially different silhouettes or views, then select one for its explanatory and visual effect. A color change is not a different construction. Explain the selected result briefly; do not make the user select every detail.\n\nWrite a figure-specific prompt using the fields below, replacing placeholders with actual choices. There is no universal palette, arrow-color mapping or left-to-right layout prefix to paste into every request. Choose a palette from [visual-system](visual-system.md) or design a suitable one, then state actual colors and roles in the prompt. Use figure-specific positive instructions about shapes, layering, rhythm and relationships instead of accumulating generic prohibitions.\n\n## Figure-specific brief\n\n```text\nDocument context: [Chinese dissertation / English conference or journal paper; destination chapter/section and intended placement].\nVisible text language: [Chinese / English / explicit project convention; preserve specified names, acronyms and symbols].\nPurpose: [what this figure lets the reader understand].\nSource of mechanism: [verified paper section and facts].\nReference roles: [image A supplies layout; image B supplies mini-DAG style; facts come from the manuscript].\nComposition: [main visual anchor, reading order, relative scale, open areas and local expansions; explain where the eye enters and what relationship stands out].\nPalette and rendering: [actual colors assigned to context regions, object identities and focal relationships; mix light, medium and strong colors with deliberate area and adjacency; light/dark balance, label contrast, outline treatment, perspective and permitted depth].\nSelected component constructions: [for each key object, name the selected term/variant and describe its silhouette, visible parts, spatial organization and attachment points; IDs belong in the record, not the image].\nMeaningful small objects: [what each region contains and why; icon-only identity or local structural expansion].\nLogo/icon attachment: [actual object, title/boundary/interface, asset or text placeholder, connector endpoints].\nInterfaces: [source → destination, payload/action, arrow style].\nRequired labels and values: [short exact list; omit redundant writing-organization subtitles and production-status text].\nInvariants: [a few scientific facts that must remain true].\nExclude from this figure: [details assigned to another figure].\nOutput: [requested image format and intended use; review happens after generation, not by declaration in this prompt].\n```\n\nKeep early geometry flexible. Freeze stable semantics first. List intended visible labels and their language; recipe IDs, planning headings and review metadata are not figure labels. Reserve strict text whitelists for tightly constrained edits; do not overconstrain a first composition with every coordinate and micro-label.\n\n## Overview pattern\n\nUse when the paper has workload, prediction, scheduling and execution relationships:\n\n```text\nCreate a compact overview: small workflow DAGs on the left; two shallow prediction/scheduling regions in the middle; concrete model/request/resource objects on the right. Keep module relationships prominent and move algorithm detail to separate mechanism figures. Show a small prediction output record and a symbolic action table if the paper defines them. Distinguish actual commands from candidate comparisons. Show preparation/binding and feedback only as supported by the current system. Use a small shared model identifier where sufficient, repeating identifiers only where separate panels or deployments need them. Avoid equal-height empty panels.\n```\n\n## Decision and lifecycle patterns\n\n```text\nDecision comparison: use the same candidate request and workflow in both panels. Show different resource contexts, the relevant interference/slack, and the unique chosen outcome. Existing and added work have stable encodings. Numeric illustration must be explicitly labeled; axes and bar lengths must agree if quantitative. Do not invent values.\n```\n\n```text\nLifecycle: move the same focal request through paper-defined states. Show preparation, active occupancy and release with different slot treatments. Separate decision instants and asynchronous execution. A candidate is outside pre-existing occupancy until inserted. A released slot is empty. Shared immutable records remain one record feeding multiple consumers when that is the actual design.\n```\n\n## Targeted revision\n\n```text\nRevise the supplied image to fix [related defects]. Preserve [accepted layout, identities, labels and mechanisms]. Change [specific objects or connections]. The resulting figure must satisfy [observable corrected conditions]. Inspect the entire result for unintended changes.\n```\n\nA user request to correct several related errors may be one edit; do not force one generation per typo. If overall structure is wrong, redraw composition rather than patching its colors. After generation, inspect pixels: prompts do not certify correct arrows, arithmetic, glyphs or text. Keep the exact prompt and reference provenance with the version record.\n\n## Compose from the component library\n\nUse the [topic index](topic-index.md) to choose a construction at the appropriate detail level. Integrate its silhouette, parts, spatial organization, edges and emphasis into one figure-specific prompt. Do not concatenate full term cards or pass historical user-feedback and source-review records as image instructions. Adapt cross-topic samples to verified paper facts.\n\nA source URL or written reference review is not an image input. If the actual source image was not supplied to the generation tool, record that the prompt used a textual construction only. Keep source inspection, recipe selection and output review as separate states. Use real data and plotting tools for measured results; component generation cannot supply experimental evidence.\n\nFor cross-language redrawing or dissertation adaptation, use [document contexts](document-contexts.md). Include exact translated labels, preserved semantic relationships and the supported scope of expansion. Reflow the composition to fit the target language and document.\n\n## Generate a component before composing the figure\n\nUse GPT Image or the currently available authorized image generator when a custom silhouette or visual treatment would improve an object. This route applies to any component, not only GPUs. Read the relevant recipe as semantic context, then design beyond it as needed. Show the actual component prompt before calling the tool. Request true transparency through the tool parameter when producing a transparent cutout; do not draw a checkerboard to simulate transparency.\n\nUse this brief with actual task-specific choices:\n\n```text\nCreate one isolated [object] for [role in the target scientific figure].\nDepict [chosen silhouette and view], with [visible parts, proportions and spatial relationships].\nMatch [target palette with actual colors, outline character, depth, lighting and neighboring component style].\nIt will appear at [approximate size relative to the figure]; preserve [recognizable features] at that scale.\nLeave [specific attachment areas] clear for connectors placed during composition.\nUse a transparent background and keep the entire silhouette inside the image.\nVisible text: [none, or the small set of necessary fixed labels]. Add variable labels and semantic arrows during composition.\nScientific scope: [identity-only schematic or supported structure; identify illustrative geometry].\nReference input: [actual attached image and properties to preserve, if supplied].\n```\n\nInspect the generated element at its intended size and show it inline. Check recognizability, proportions, unwanted text, invented structure, edge quality, transparency and compatibility with neighboring objects. For substantive changes, show the revised prompt before another generation. Keep retries proportional to the task; do not generate a full asset library when a few elements suffice.\n\nFor whole-image generation, supply the chosen element through the tool's reference-image mechanism and specify which features must remain. Inspect whether they survived. For source composition, place it as a separate asset and keep labels and connectors separate. Editable draw.io/PPT delivery may directly use independent raster cutouts with native labels and connectors; no extra hybrid-format approval is needed. Reconstruct constituent shapes only when fully vector or internal-part editability is explicitly requested. Save the actual element prompt and its relationship to the composed figure.\n", "topics": []}, {"id": "rule-iteration-playbook", "type": "使用规则", "path": "references/iteration-playbook.md", "title": "Iteration from concrete feedback", "text": "# Iteration from concrete feedback\n\n| Feedback | Repair |\n|---|---|\n| Looks like a coursework flowchart | Replace generic text boxes with paper-defined objects and expose relationships at the correct level; preserve genuine serial flow |\n| Too stiff / AI-template-like | Keep alignment but vary internal primitives and region dimensions by role; use small DAGs, tiles and model stacks |\n| Too much whitespace | Fit frames to content, shorten detours, move related groups together; retain useful breathing room; allow small coherent details without treating every gap as a defect |\n| Too many details in overview | Retain interfaces and key objects; move state transitions, formulae and decisions into module figures |\n| Arrows indistinguishable | Inventory data/control/feedback and use explicit line/color/label mapping; distinguish candidate comparison from dispatch |\n| Components not lively enough | Give them meaningful internal form: feature vector, request slots, model layers or branch frontier; a coherent role avatar is also valid when identity is the purpose |\n| Need recognizable models | Add sparse truthful identifiers plus role labels; do not import brands from references |\n| Only recolored; concrete objects still missing | Read the relevant component variants and change silhouette, parts, organization or interfaces; inspect whether the new structure actually explains the object |\n| Old palette looked better | Compare what worked in the older palette with other suitable families; preserve useful contrast or softness while selecting the best overall composition, without automatically reverting or flattening objects into blue-gray boxes |\n| Too much explanatory text | Keep object names and necessary technical labels; remove redundant editorial subtitles and let geometry express relationships |\n| Logo feels pasted on | Attach an accurate mark to its actual platform, model, framework or interface; coordinate its size and connectors with the component |\n| Good composition but wrong detail | Target related repairs, preserve layout, then recheck the full image |\n\nFor new drawings and recoloring, complete the [rendered aesthetic review](visual-quality.md#aesthetic-review) before delivery. Use visible findings to choose repairs; preserve accepted design outside the requested scope.\n\n## Stop propagation of errors\n\nInspect edits for changed labels, extra arrows, duplicated selected marks, altered identities, arithmetic and state changes. Two panels comparing a placement need the same candidate. A delayed non-critical branch must not be mislabeled originally critical. Completion frees a slot. A symbolic table must retain its paper-defined index and meaning.\n\nIf local edits repeatedly drift, return to the best accepted draft, simplify conflicting constraints or redraw the composition. Do not repeatedly regenerate one arrow indefinitely. Deliver an honest correction list if the tool cannot resolve it; the user may manually redraw. Offer native production only when requested, not as an automatic fallback.\n\n## Example repair\n\nA scheduling overview begins as four equal tall cards with prose labels. Retain the actual interfaces, open the workflow region into two small DAGs, place prediction above scheduling if they share inputs, and draw runtime endpoints as short model/slot groups. Route blue request/data, orange control, gray dashed feedback. Replace candidate arrows that look like feedback with neutral comparison marks. Keep the full state rail and decision arithmetic for separate mechanism views. The result gains concrete objects without importing new mechanisms.\n", "topics": []}, {"id": "rule-knowledge-base", "type": "使用规则", "path": "references/knowledge-base.md", "title": "统一绘图知识与维护", "text": "# 统一绘图知识与维护\n\n## 1. 当前约定与入口\n\n本技能统一维护全部主题画法、整图构造、工具和检索信息，唯一技能入口为 [SKILL.md](../SKILL.md)。各主题直接参与绘图流程，主题正文是画法维护源；catalog 中的维护元数据与生成结果分别如下。\n\n画法源自用户提供的 research-diagram-components v0.4.1，其来源记录、许可信息及历史校验保留在 catalog。该名称只用于追溯来源，不是需要另行调用的技能或独立工作流。\n\nAgent 样板与九种参考改编按当前图的用途选择。来源审阅、文字配方与具体成图的验收分别记录。\n\n**主干：主题 → 词汇 → 多种具体绘图描述。** 图面中的外形、部件、位置和连接承担解释；短标签负责身份、术语和必要边界。一个对象允许多种构造，同一种语义也允许不同视角和展开程度。数量按实际可用方案决定。\n\n## 2. 按需读取\n\n日常绘图从 SKILL.md 的直接主题入口读取所需画法；术语不明确时用 [主题索引](topic-index.md) 或根目录 `catalog/index.json` 定位。\n\n| 主题 | 文件 |\n|---|---|\n| Cloud、云原生、Kubernetes Logo 与连线组合 | [cloud-native-kubernetes](../topics/cloud-native-kubernetes.md) |\n| 硬件、异构集群、加速器与互连 | [hardware-cluster](../topics/hardware-cluster.md) |\n| 数据、内存、传输与存储 | [data-memory-storage](../topics/data-memory-storage.md) |\n| 神经网络、张量、视觉、MoE、推荐与模型压缩 | [models-deep-learning](../topics/models-deep-learning.md) |\n| 任务性能预测与代价模型 | [performance-prediction](../topics/performance-prediction.md) |\n| 集群调度、配额、共享与回收 | [scheduling-resources](../topics/scheduling-resources.md) |\n| 训练、微调、并行、通信与状态 | [training-distributed](../topics/training-distributed.md) |\n| RL、采样、版本与对齐 | [rl-alignment](../topics/rl-alignment.md) |\n| LLM 推理、实例、批次与缓存 | [inference-serving](../topics/inference-serving.md) |\n| 系统软件、控制器、运行时与编译 | [systems-runtime](../topics/systems-runtime.md) |\n| 可观测性、SLO 与可靠性 | [observability-reliability](../topics/observability-reliability.md) |\n| Agent、多 Agent、工具与工作流 | [agents-workflows](../topics/agents-workflows.md) |\n\nAgent 的细化内容在 [已保留样板](../topics/agents-approved-samples.md) 和 [arXiv 改编描述](../topics/agents-arxiv-patterns.md)。已有内容足够时直接使用；只有缺口、用户要求或技术边界不确定时才补查来源。\n\n整图构造参考 [跨主题组合](../examples/combined-recipes.md)。审美和 icon 选择参考 [视觉规范](visual-quality.md)。扩充词条使用 [模板](../templates/term-card.md)。需要核验参考再读 [来源与取舍](sourcebook.md)。\n\n## 3. 实际绘图流程\n\n**理解内容。** 明确图的用途、目标读者和主要对象；可以用一句话描述读者需要理解的内容。小组件可只负责身份识别，不强制解释完整机制。\n\n**调用画法。** 找到相应词条，按语义、目标尺寸与上下文选合适构造。可以将现有描述适当改编，也可以提出新候选。只需身份时，简洁图标加短标签即可；需要解释模型、数据、状态或资源时展开相应结构。\n\n**组织整图。** 先安排主体、阅读方向、边界与关键关系，再统一图标家族、线条、字体层级、颜色角色和透视。数据、控制、引用、放置、依赖与反馈各按实际含义表达，不为了对称随意补边。\n\n**输出。** 要文字就给描述或完整 prompt；要求实际图形时调用可用工具；需要可编辑文件时构造原生路径、形状与文字。没有生成图片时明确保留文字候选状态，不宣称视觉验收完成。\n\n**交互。** 用户提出的最新偏好立即用于选择和修改。只有显著改变结果且上下文不能解决的问题才追问；已经认可的方向直接沿用。不得把一次认可泛化为所有图都必须使用同一构造。\n\n## 4. Icon 与整体观感\n\n允许符合主题的头像、设备、终端、文档、工具、状态标记和适量装饰。图标式、结构式、图标与结构组合式均可用，不给全库设统一的图标比例。\n\n选择标准是：角色与架构逻辑一致，和整张图乃至同一文档的视觉语言协调，细节尺度合适，不挡连接或抢占主体。少量亲和性细节可以保留，不必强求每笔装饰都有数学语义。\n\n“减少 AI 感”指减少实际可见的问题，例如不相关的发光、厚重塑料质感、随机渐变箭头、满屏同形 UI 卡片、不同风格图标混搭、浮空装饰和乱码标签。它不是对工具的限制，也不等于禁用颜色、深度、圆角或机器人。\n\n矩阵、缓存页、时间段和资源槽位可自然使用方格；设备身份也可用小图标。所选形体应适合当前对象，不把所有对象替换为同一种文字方框，也不强制所有对象展开内部结构。\n\n### Logo、云边界与连接的整体使用\n\n允许必要的 Kubernetes、云平台或实际框架标识。先说明标识哪个对象，再安排到集群边界标题、软件平台层、接口或组件标题；Logo 与资源图标、设备结构配合，不把所有内部对象替换成同一项目标识。详细视图连具体接口，折叠概览可以连 Logo＋名称组成的整体端点。\n\n已有集群、节点、GPU、存储和互连直接复用；相关入口见 [Cloud 组合主题](../topics/cloud-native-kubernetes.md)。CPU 使用独立词条，不照搬 GPU 或专用加速器结构。整体布局要同时安排资源归属、存储位置和连线路径，避免画完后再贴 Logo、强行穿线。\n\n使用准确素材，按标题尺度、留白和同一文档风格协调；重复次数取决于阅读需要。素材无法准确提供给生图模型时留位后排，不能把生成的近似 Logo 称为官方标识。具体组合见 [Cloud 与 Logo 指南](cloud-logo-composition.md)。\n\n## 5. 词条写什么\n\n每种画法的主体是一段可直接绘制的描述：**轮廓与形体、可见部件、空间组织、连接、重点和视觉处理**。按需要写，不让每个简单组件都背负冗长规格。\n\n涉及 Logo／图标时，把标识对象、附着位置、结构关系、连线路径与整体处理写入具体画法，不能只说“可以加一个 Logo”。\n\n并附：词汇与别名、含义、适用条件、来源与具体取舍、关键误读提醒、描述／原图／成图各自状态。配色变体可保留，但不能用换颜色冒充新结构。\n\n科学意义与画面构造不确定时要区分：可以提出原创构造；不能把没有依据的模块、精确数量、设备能力或算法步骤补进论文。品牌先按模型、运行时、接口、机构等角色定位，未知私有结构不展开。\n\n## 6. 学习来源与审美筛选\n\n顶会、期刊、arXiv 与作者博客用于寻找素材；论文热度和来源级别不替代看图与审美判断。先看准确版本的实际图面，再决定整体借鉴、仅取结构、仅取配色／构图或不采用。\n\n对留下的局部，具体记录保留什么、舍弃什么、怎样重构。把论文逻辑和视觉处理分开：漂亮外观不能改变机制，正确机制也不要求照搬难看的配色。多个来源的小组件进入同一图时需要重新协调，而非直接拼贴。\n\n三项状态独立：原图是否看过；选中了哪些局部；我们的新图是否生成并检查。继承审图记录、技术文本阅读、原创描述和已验图样例要清楚区分。链接存在不代表生图模型已看到图片。\n\n## 7. Prompt 与图中可见文字\n\n把本次内容、选中的画法、布局、关系、统一视觉处理融合为一个提示词。需要生成时列出允许的可见文字，内部组织标题、检查条款和元数据不自动出现在图中。语言按用户场景确定，不默认把中文交流全部转成中文图标签。\n\n原图不可提供给工具时，使用已整理的具体描述并说明没有直接图像条件。需要数据结果时使用真实数据作图；生成模型可以探索机制插图，但不能伪造统计坐标、实验数值或输出证据。\n\n## 8. 交付检查\n\n对象身份与层级清楚，依赖和连线端点准确；模型层、通道、实例、分片、角色与设备不混同。完成请求、缓存保留、可驱逐与真正释放分开；单选放置只产生一个实际结果。\n\n同时检查主次、形体、比例、留白、配色和整图兼容性。图标帮助识别或增加适量趣味，关键结构仍然可见。缩小到目标尺寸后检查文字、箭头和局部展开；结构校验通过不等于图面漂亮。\n\n按当前请求交付：词条／提示词请求交付文字，实际绘图请求按统一绘图流程生成并检查图片，可编辑文件仅在请求时制作。未生成、未看过或未验证的内容如实标明。主题覆盖状态见 [coverage](coverage.md)。\n\n## 9. 检索、离线浏览与维护\n\n- 从 [主题索引](topic-index.md) 或 `catalog/index.json` 按词条 ID／别名定位，只读相关词条及必要边界；不用一次加载全部主题。\n- [离线指南](../guide.html) 用于浏览、搜索和复制文字画法，页面统一检索词条、变体、Agent 扩展、案例与规则，并显示素材状态。修改主题后再重建快照。\n- 组合样板仅提供可改编构图；目标论文决定真实对象、数量、部署和机制。将选定构造融合进最终提示词，记录词条 ID 与所选变体。\n- 修改主题正文或来源后，在技能根目录运行 `python3 scripts/rebuild_navigation.py`，再运行 `python3 scripts/validate.py`。脚本仅做本地索引／指南生成及结构检查，不下载素材、不生成图片。\n- 维护时区分新增和继承的来源状态，更新相应统计与版本记录。历史保护独立由 `check_history.py` 检查；未经明确授权不得修改受保护 Agent 正文或通过更新哈希绕过保护。新增关联元数据放在正文之外。\n\n\n## 10. 数据职责与变体维护\n\n| 责任 | 文件 | 维护方式 |\n| --- | --- | --- |\n| 画法正文与词条锚点 | `topics/*.md` | 唯一正文来源；保留旧词条 ID |\n| 主题、别名来源、稳定变体身份 | `catalog/topics.json`、`catalog/term-provenance.json`、`catalog/variants.json` | 独立维护，不从旧生成结果继承 |\n| 来源与历史保护 | `catalog/sources.json`、`catalog/history.json`、`catalog/migration.json`、`catalog/import.json`、`catalog/agent-preservation.json` | 保留继承版本、旧链接及授权依据 |\n| 当前索引、统计、浏览器载荷 | `catalog/index.json`、`catalog/statistics.json`、`catalog/browser.json`、`guide.html` | 可移除后重建；不包含时间戳 |\n| 制作及检查记录 | `examples/cases.json`、案例目录、`assets/visual-library/catalog.json` | 真实输入、产物、提示词与检查，独立于文字画法状态 |\n\n变体的 `id` 是持久身份，首次迁移已登记，后续不得重算。`term_id` 和 `heading` 只定位现有 Markdown 段落；改标题时保留 `id` 并更新 selector。排序不改变 ID。新增变体用 `v-` 加唯一标识登记，不复制正文到 JSON。浏览器使用 `#topic=…\u0026q=…\u0026term=…\u0026variant=…`，并兼容旧 `#term-\u003cid\u003e` / `#\u003cid\u003e`；现有 Markdown 词条锚点不变。\n\n已有变体先标 `unreviewed`。有依据时补充 `suitable`、`unsuitable`、`level`、`connect`、`boundary_source` 和 `cases`；没有可靠信息就保留未审状态，不自动补全科学事实。三个场景涉及的变体已按场景输入补充选择条件，但场景不是完成案例。`scenario_inputs` 指向这些输入。\n\n文字画法保持 `recipe_status=description_ready`。旧 `image_status=not_generated` 已从生成索引移除，其历史含义保存在 `catalog/history.json`。素材保留原始 `status` / `legacy_status`，另设 `generation_record`、`source_review`、`visual_review`、`final_use`、`user_acceptance`。只有 `final_use=eligible` 且没有 reference/truncated/superseded/error 历史限制的素材进入默认最终素材选择；其他资产继续可查阅。当前使用场景必须重新确认质量和接受状态。\n\n浏览器通过 `scripts/web/guide.html`、`guide.css`、`guide.js` 生成，全部代码和数据嵌入页面。不要手改根目录 guide.html。Markdown 渲染是安全的小型子集：标题、列表、代码、表格与有效链接；原始 HTML 不执行。外部 URL 仅允许 HTTP(S)，本地相对路径保留。筛选和定位用 hash，不需要服务器路由。\n\n`VERSION` 是独立技能发布版本；`catalog/source-version.txt` / import 是继承知识库版本。本次工作按 Unreleased 记录，不修改已有发布版本号。\n", "topics": []}, {"id": "rule-migration", "type": "使用规则", "path": "references/migration.md", "title": "整合说明", "text": "# 整合说明\n\n本版用一个规则入口和一套主题正文取代旧版多套入口。52 个旧 ID 全部迁移，旧的长提示词不再照搬；术语、画法与新 icon 规则在各主题中一致。\n\n## 实际修正\n\n- GPU 通用身份与 SIGMA 一类专用加速器内部结构分开，新增简化板卡／芯片身份画法。\n- 量化、剪枝和蒸馏成为独立词条，不再挂在 LoRA 别名下冒充覆盖。\n- 模型层、参数切片、实例、rank 和设备分别表达；通用 Encoder/Decoder 名称不强制采用降维升维形状。\n- MIG、MPS、时间切片区别，环／树／集体通信不作为所有场景的固定拓扑。\n- 资源回收、KV 驻留、异步保存和实际就绪分别标状态，不把完成图标当释放事件。\n- 原文的“而非服务器图标”“不使用仪表盘图标”等改为根据含义和局部用途选择，不一律排除图标。\n- Agent 的已有主体段落保留；状态更新为用户认可整理方向，成图未生成仍单独标明。\n- 来源粗粒度链接重新梳理；原图可以只作语义参考，文字提案不会自动被标为论文原有构造。\n\n以上是源包的历史迁移说明。当前内容已整合为 systems-figure-studio 的参考库，使用入口见 [components](knowledge-base.md)。\n", "topics": []}, {"id": "rule-sourcebook", "type": "使用规则", "path": "references/sourcebook.md", "title": "来源与视觉取舍", "text": "# 来源与视觉取舍\n\nR 开头为已迁移的原图模式，AG 为保留的 Agent 记录，S 为本轮非 Agent 补充。原图已看过、局部可以借鉴、改编图已生成分别记录。引用只支持本条注明的关系，不为每个原创画法背书。原图不随包打包，读者可通过来源访问。\n\n\u003ca id=\"r01\"\u003e\u003c/a\u003e\n\n## R01 · 收窄—展开的低秩支路\n\n**来源：** [LoRA](https://arxiv.org/pdf/2106.09685)；ICLR 2022 / 预印本图。  \n**版本／范围：** arXiv v2（2021-10）；不是对最终排版版本的逐像素核对；Fig. 1；PDF 页 1。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 主权重使用宽面；旁路由两个方向相反的梯形组成，中间明显收窄；上下向量通过加法汇合。\n\n**值得保留：** 保留宽—窄—宽轮廓、独立旁路和加法节点；可旋转布局，不改变维度映射。\n\n**需要取舍：** 不要把梯形解释为模型规模变化；不能删掉主路或把两路串联。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/2106.09685/assets/x1.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r02\"\u003e\u003c/a\u003e\n\n## R02 · 斜置、多尺度的特征平面\n\n**来源：** [Feature Pyramid Networks](https://arxiv.org/pdf/1612.03144)；CVPR 2017。  \n**版本／范围：** 作者预印本对应图；Fig. 1；PDF 页 1。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 不同大小的斜置平面叠成尺度层次；图中并列四种连接布局，底部可保留图像内容。\n\n**值得保留：** 保留平面倾角、逐级尺度变化、横向/纵向路径；不把平面替换为写着 feature 的等大框。\n\n**需要取舍：** 平面面积在这里关联空间尺度；不能无说明当显存或参数量。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/1612.03144/assets/x1.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r03\"\u003e\u003c/a\u003e\n\n## R03 · 图—层叠平面—图—小网络\n\n**来源：** [A Gentle Introduction to Graph Neural Networks](https://distill.pub/2021/gnn-intro/)；Distill 2021。  \n**版本／范围：** 作者博客原图；端到端 GNN 示意图；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 不规则节点图穿过倾斜的网络层平面；输出仍是节点图，再接圆节点的小型分类网络。\n\n**值得保留：** 保留输入/输出拓扑对应、平面层次、圆节点网络；只裁取所需局部。\n\n**需要取舍：** 层平面不是模型副本；没有 pooling 时不能擅自减少节点。\n\n**原图入口：** [查看原图](https://distill.pub/2021/gnn-intro/Overall.e3af58ab.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r04\"\u003e\u003c/a\u003e\n\n## R04 · 状态主干与门控支路\n\n**来源：** [Understanding LSTM Networks](https://colah.github.io/posts/2015-08-Understanding-LSTMs/)；Chris Olah 2015。  \n**版本／范围：** 作者博客原图；展开的 LSTM 链；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 连续状态主干穿过重复单元；中间单元展开，圆形乘加节点和弯曲支路连接学习变换。\n\n**值得保留：** 保留贯穿主干、重复单元、分流/汇流和局部展开；非焦点单元减弱。\n\n**需要取舍：** 不要把 LSTM 的乘加门控照搬成 Agent 推理内部结构；借用布局时须标改编。\n\n**原图入口：** [查看原图](https://colah.github.io/posts/2015-08-Understanding-LSTMs/img/LSTM3-chain.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r05\"\u003e\u003c/a\u003e\n\n## R05 · 操作与数据路径的形状语法\n\n**来源：** [Understanding LSTM Networks](https://colah.github.io/posts/2015-08-Understanding-LSTMs/)；Chris Olah 2015。  \n**版本／范围：** 作者博客原图；图形符号说明；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 学习层、逐元素运算、向量传递、拼接和复制分支使用不同符号。\n\n**值得保留：** 小圆圈用于明确的运算，向量沿路径移动；分支与拼接各有连接结构。\n\n**需要取舍：** 图形语法是该文章的约定；迁移后仍需图例，不把所有汇合默认为加法。\n\n**原图入口：** [查看原图](https://colah.github.io/posts/2015-08-Understanding-LSTMs/img/LSTM2-notation.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r06\"\u003e\u003c/a\u003e\n\n## R06 · 带分量的嵌入向量\n\n**来源：** [The Illustrated Transformer](https://jalammar.github.io/illustrated-transformer/)；Jay Alammar 2018。  \n**版本／范围：** 作者博客原图；Embedding 图；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 词上方是带分格的窄向量带，空间对应关系直接连接词与数值表示。\n\n**值得保留：** 保留分量节奏和词—向量的一一对应；分格数量作为示意说明。\n\n**需要取舍：** 不能用实际示意格数声称 embedding 维度，也不能把每格当一个 token。\n\n**原图入口：** [查看原图](https://jalammar.github.io/images/t/embeddings.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r07\"\u003e\u003c/a\u003e\n\n## R07 · 展开一层，折叠重复层\n\n**来源：** [The Illustrated GPT-2](https://jalammar.github.io/illustrated-gpt2/)；Jay Alammar 2019。  \n**版本／范围：** 作者博客原图；Decoder block vectors；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 多层 decoder 竖向排列，底层展开 attention 与前馈结构；向量沿路径贯穿。\n\n**值得保留：** 保留层叠节奏、一个展开层和连续 token 路径；其余用省略号压缩。\n\n**需要取舍：** 层数不能暗示实例数；用作不透明模型概览时不要虚构具体层配置。\n\n**原图入口：** [查看原图](https://jalammar.github.io/images/gpt2/gpt2-transformer-block-vectors-2.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r08\"\u003e\u003c/a\u003e\n\n## R08 · 向量束的加权汇聚\n\n**来源：** [The Illustrated GPT-2](https://jalammar.github.io/illustrated-gpt2/)；Jay Alammar 2019。  \n**版本／范围：** 作者博客所引用路径中的原图；Self-attention weighted values；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 平行向量束分别经过圆形乘法点；加权结果汇成一个输出向量。\n\n**值得保留：** 保留多路向量、各自权重和最后求和；路径有清晰对应。\n\n**需要取舍：** 向量变淡必须说明含义；不能把 attention 权重当专家占用率。\n\n**原图入口：** [查看原图](https://jalammar.github.io/images/xlnet/self-attention-3-2.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r09\"\u003e\u003c/a\u003e\n\n## R09 · 概率条与选择性专家路径\n\n**来源：** [Switch Transformers](https://jmlr.org/papers/volume23/21-0998/21-0998.pdf)；JMLR 2022。  \n**版本／范围：** JMLR 图面已核对；展示图像来自对应 ar5iv 转换；Fig. 2；PDF 页 4。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 输入 token 带、路由概率小柱、专家行、选中实线和门控虚线共同构成局部放大图。\n\n**值得保留：** 保留概率分布、选中路径、未选专家与残差绕行；提取结构而非复制外框。\n\n**需要取舍：** 本图是单专家 Switch 路由；改成 Top-k 必须明确新增语义。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/2101.03961/assets/x3.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r10\"\u003e\u003c/a\u003e\n\n## R10 · token 置换与容量留白\n\n**来源：** [Switch Transformers](https://jmlr.org/papers/volume23/21-0998/21-0998.pdf)；JMLR 2022。  \n**版本／范围：** JMLR 图面已核对；展示图像来自对应 ar5iv 转换；Fig. 3；PDF 页 5。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 一组细长 token 柱被分配到上方多个专家；跨设备连线保留身份，空位和溢出不同。\n\n**值得保留：** 保留长条 token 身份、目标边界、未填空间和明确溢出支路。\n\n**需要取舍：** 空闲专家容量不是通用 GPU 显存；容量因子例子不能泛化为硬件配置。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/2101.03961/assets/x4.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r11\"\u003e\u003c/a\u003e\n\n## R11 · 沙漏轮廓与迭代回路\n\n**来源：** [High-Resolution Image Synthesis with Latent Diffusion Models](https://ommer-lab.com/research/latent-diffusion-models/)；CVPR 2022。  \n**版本／范围：** 作者项目页对应论文图；Fig. 3；PDF 页 None。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 编码/解码使用相反的梯形；U-Net 使用中间收窄的双翼轮廓；条件路径接入内部，多步去噪通过回路表达。\n\n**值得保留：** 保留像素/潜空间分界、压缩与展开方向、跨层连接及迭代次数标记。\n\n**需要取舍：** 沙漏仅在确有编码解码层次时使用；噪声变化不是训练收敛曲线。\n\n**原图入口：** [查看原图](https://ommer-lab.com/wp-content/uploads/2022/08/article-Figure3-1-1024x508.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r12\"\u003e\u003c/a\u003e\n\n## R12 · 时间展开的图结构\n\n**来源：** [Spatial Temporal Graph Convolutional Networks](https://arxiv.org/pdf/1801.07455)；AAAI 2018。  \n**版本／范围：** 作者预印本对应图；Fig. 2；PDF 页 3。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 视频帧叠放后转为多时刻骨架图层；同一关节跨时间相连，局部感受野着色。\n\n**值得保留：** 保留重复对象的稳定位置、时序连接和局部高亮范围；可借作时序图结构表达。\n\n**需要取舍：** 时间层不能与神经网络深度混用；高亮面不是物理覆盖区域。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/1801.07455/assets/x1.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r13\"\u003e\u003c/a\u003e\n\n## R13 · 特征片—查询集合—匹配弧线\n\n**来源：** [End-to-End Object Detection with Transformers](https://arxiv.org/pdf/2005.12872)；ECCV 2020。  \n**版本／范围：** 作者预印本对应图；Fig. 2；PDF 页 7。  \n**审阅状态：** 已看图面；继承既有记录，本轮未重新核验。\n\n**观察或依据：** 锥形 CNN、叠置位置特征、token 行和带身份的查询点并列，输出用弧线连接至不同预测头。\n\n**值得保留：** 保留查询身份、弧线端点、特征平面和检测框对应；可裁成小型查询模块。\n\n**需要取舍：** 查询集合不能暗示 FCFS 顺序；整图大框并非所有组件的推荐外形。\n\n**原图入口：** [查看原图](https://ar5iv.labs.arxiv.org/html/2005.12872/assets/x2.png)（依赖来源可访问性；不等于已向生图模型提供图像）。\n\n\u003ca id=\"r14\"\u003e\u003c/a\u003e\n\n## R14 · 图像切片展开成序列\n\n**来源：** [An Image is Worth 16x16 Words](https://arxiv.org/pdf/2010.11929)；ICL
