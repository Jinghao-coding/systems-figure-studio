tatus": "text_reviewed", "review_date": "2026-10-01", "observation": "逻辑服务与后端端点的抽象关系。", "retain": "服务图标不是新增物理交换机，逻辑调用与网络连通分层。", "avoid": "没有依据时不外推云产品、部署与权限；不声称这些页面的原图经过本轮审美筛选。", "version": "公开页面，查阅日 2026-10-01", "record_origin": "new_v0.4.1", "our_image_status": "not_generated", "related_urls": []}], "agent_docs": [{"title": "Agent 样板：身份、结构与组合", "text": "# Agent / Multi-agent · 已保留的画法\n\n这些构造来自 v0.4.1 的历史整理；方向选择记录不代表具体成图已验收。按当前文稿的对象、关系和视觉要求选用。\n\n## Agent／智能体\n\n**主题：** Agent、LLM 应用、工作流、人机协同。\n**别名：** agent、AI agent、角色智能体；planner、executor、reviewer 等是任务中的具体角色，不默认全部出现。\n**简要含义：** 在当前系统里承担指定角色的执行实体。可只表示身份；说明内部机制时再展开相关结构。\n\n### 画法 A：角色头像与短标签\n\n**具体怎么画**\n\n使用一个轮廓清晰的小型机器人头像，保留圆滑的外形、简洁面部和少量辨识性细节。\n头像下方或旁侧放短角色名，不额外套一层宽大卡片。多角色沿任务关系排列，保持相同的头像比例和线条；\n用小角标或一处强调色区分角色，文字负责准确说明职责。可保留少量增加亲和感的细节，\n不加入大面积发光、夸张表情或抢占注意力的配件。\n\n**适用与调整：** 角色总览、用户与 Agent 的交互、以协作关系为主的小型架构图。头像本身可构成完整组件。\n**参考与取舍：** 原创候选；不宣称来自特定论文。图标形状是身份表示，不代表真实模型结构。\n**误读提醒：** 只有当前系统存在多个实体才重复头像；不同时间的同一 Agent 保留身份。\n**当前状态：** 文字候选，未生成。\n**历史状态：** v0.4.1 记录构造方向已接受；具体成图未验收。\n\n### 画法 B：以状态与路径表示 Agent\n\n**具体怎么画**\n\n不使用头像，将任务中确实存在的状态与操作沿紧凑回路组织：输入在一侧进入，操作沿清楚路径展开，\n反馈从下方回到对应接收位置。状态可用少量叠置的记录片，操作用小型节点，外部返回内容用一条短消息带。\n让回路形态承担整体辨识，不强行用一个大矩形包住所有内容。线条以中性颜色为主，强调本图讨论的步骤。\n实际没有循环时改为顺序或分支结构，不为画得像 Agent 而添加回路。\n\n**适用与调整：** 解释给定 Agent 的状态变化或执行过程；只展开有依据的内容。\n**参考与取舍：** 原创候选；其构造应由本次系统描述补足，不预设所有 Agent 都有记忆、规划或工具。\n**误读提醒：** 回路中的先后关系不是模块包含关系；控制和返回数据在必要时区分。\n**当前状态：** 文字候选，未生成。\n**历史状态：** v0.4.1 记录构造方向已接受；具体成图未验收。\n\n### 画法 C：头像与局部结构组合\n\n**具体怎么画**\n\n保留小型 Agent 头像作为身份锚点，在一侧展开当前讨论的内部结构；头像面积不超过展开结构的视觉重量。\n用细引线或明确的局部展开关系连接二者，不能画成两个独立执行实体。展开部分只包含已说明的状态或机制，\n例如少量记忆条目与读写路径，或一组规划任务与后继关系。头像采用与结构同一色系，展开的焦点采用强调色；\n远离焦点的细节折叠，保证小尺寸下仍能分清身份与机制。\n\n**适用与调整：** 既要易于识别 Agent，又需要解释一项局部机制的架构图。\n**参考与取舍：** 原创组合提案，不代表某篇论文的完整机制。\n**误读提醒：** 用于局部展开的引线不表示新的数据请求；不要为了填满结构增加不存在的组件。\n**当前状态：** 文字候选，未生成。\n**历史状态：** v0.4.1 记录构造方向已接受；具体成图未验收。\n\n## 多 Agent 协作／Multi-agent collaboration\n\n**主题：** Agent、工作流、人机协同。\n**简要含义：** 多个具有不同身份或角色的参与者进行任务交接、消息交换或协作执行。\n不默认采用中心协调器，不将所有工作流都画成全连接。\n\n### 画法：角色图标与局部任务分支\n\n**具体怎么画**\n\n将同一图标家族的角色按真实任务关系排列，主协作路径保持易读的方向；在确有并行的地方用对齐分支展开。\n角色旁只附必要任务或消息，不把每一条信息都套成独立卡片。存在人工审批时加入同风格人物头像和清楚的交接路径。\n共同产物可放在实际汇合位置，使用一组简短文档页或结果片；边指向真实接收者，必要时标明任务、消息或反馈。\n共享线条和配色规则，同时让每个角色具有稳定 ID。少量配件可增加趣味，但角色名仍需明确。\n\n**适用与调整：** 以分工和交互为重点的总览；需要时间细节时另用执行泳道，不在头像周围塞满时间标记。\n**参考与取舍：** 原创候选。未来可追加经实际审图的拓扑或角色排列参考。\n**误读提醒：** 汇合是否等待所有前驱由真实机制决定；显示多个角色不等于存在多个独立模型实例。\n**当前状态：** 文字候选，未生成。\n**历史状态：** v0.4.1 记录构造方向已接受；具体成图未验收。\n"}, {"title": "九种 Agent / Multi-agent 参考改编", "text": "# Agent / Multi-agent · 已保留的画法\n\n这些构造来自 v0.4.1 的历史整理；方向选择记录不代表具体成图已验收。按当前文稿的对象、关系和视觉要求选用。\n\n## AP01 · 角色 Agent / role agent\n\n**参考与状态：** AG01、AG06；改编/提案，未生成。\n\n使用同一套简洁角色头像，旁侧放短角色名；头像下可附一条小能力带，至多展开与当前内容有关的工具、模型或人工输入。可采用机器人或其他统一角色家族，不混搭写实人像与扁平头像。沿真实任务关系排列，焦点角色略加强调。\n\n**避免误读：** 头像只标识逻辑角色，不代表该角色拥有独立 GPU 或独立模型副本。\n\n## AP02 · 对话与消息 / conversation, message\n\n**参考与状态：** AG01；改编/提案，未生成。\n\n把参与者头像固定在对话两侧，交错摆放短消息气泡；消息包含少量内容线或短片段，执行返回用更窄的结果带区别。仅展示解释机制所需的几轮，后续用留白或省略标记折叠。\n\n**避免误读：** 同一参与者跨轮保持身份；对话轮次不自动表示并行执行。\n\n## AP03 · 层级委派 / planner, delegation, handoff\n\n**参考与状态：** AG01、AG06；改编/提案，未生成。\n\n主协调者位于上方或左侧，子角色按实际职责分组。任务沿分支下发，结果用独立回传路径汇总；只展开一个子角色的工具小件，其余保持头像和短标签。留白分隔角色层与工具层，不用满屏嵌套容器。\n\n**避免误读：** 不要预设中心协调器；仅在确有层级委派时使用。\n\n## AP04 · Agent 局部图与群体拓扑 / agent graph, swarm\n\n**参考与状态：** AG02、AG04；改编/提案，未生成。\n\n每个 Agent 用一个紧凑操作小图表示：操作节点少而可辨，节点之间保留局部依赖。在小图角落放角色标识，多张小图通过边界外的消息线连接；只展开焦点角色，其余折叠成小轮廓。背景保持干净，消除彩虹贯穿箭头和重复 Logo。\n\n**避免误读：** 区分操作节点、Agent 和模型实例三层；为通信边与内部依赖边规定清楚语义。\n\n## AP05 · 工具调用与执行产物 / browser, terminal, artifact\n\n**参考与状态：** AG03；改编/提案，未生成。\n\n角色旁保留文件、浏览器或终端小图标；工具下放一张具有少量真实内容的产物片，如几行代码、一个网页局部或测试结果。沿步骤编号排列，重复角色保留同一名称，关注的是内容与交接而非 UI 装饰。\n\n**避免误读：** 未提供真实内容时标为示意，不伪造运行记录；工具不必都变为独立 Agent。\n\n## AP06 · 评审与修订 / review, revise, verifier\n\n**参考与状态：** AG04；改编/提案，未生成。\n\n用少量圆形操作节点形成“生成—评审—修订”的紧凑路径；通过条件节点把通过结果送往出口，未通过结果沿外侧弧线回到修改处。历史状态使用小记录片贴在相关位置。并行候选时用扇入的汇总结构替代串行回路。\n\n**避免误读：** 这里只是候选构造，实际有没有反馈、循环和条件由当前机制决定；有循环的图不标成 DAG。\n\n## AP07 · Agent 训练闭环 / rollout, trainer, model update\n\n**参考与状态：** AG05；改编/提案，未生成。\n\n将 Agent 执行侧与训练侧左右分开，上方路径传送短轨迹带，下方返回带版本标识的模型结构或参数薄片；Agent 一侧可含同风格工具图标。两条路径在线型或标签上可区分，去掉占据中心的大型品牌标识。\n\n**避免误读：** 轨迹、奖励、参数更新是不同对象；不要把用于执行的 Agent 图标视为所有训练组件。\n\n## AP08 · 工作区与运行边界 / workspace, runtime, event stream\n\n**参考与状态：** AG07（仅语义参考，外形为补充设计）；改编/提案，未生成。\n\n按进程或容器的真实归属放置 Agent 执行路径和工具；工作区显示文件页束，边界接口处使用小型调用记录，事件沿窄带返回。保留少量边界框，不把每个软件包再画成相同卡片。\n\n**避免误读：** 软件包的依赖与部署进程不同；沙箱是隔离边界，不保证所有执行都必须沙箱化。\n\n## AP09 · Agent—LLM 请求—设备映射 / serving mapping\n\n**参考与状态：** 原创补充，待专门参考；改编/提案，未生成。\n\n上方排逻辑角色与任务关系，中间抽出实际 LLM 调用请求条，随后映射到带 ID 的模型实例，下方是设备资源。多角色可引用同一实例；同一任务的多次调用保持调用 ID。只展开一个焦点路径，其余弱化。\n\n**避免误读：** 角色数、请求数、实例数、GPU 数分别表示；不能仅凭头像数量推断资源占用。\n"}], "guide_docs": [{"title": "Framework Studio 方法取舍", "text": "# Paper Framework Figure Studio Pro：融合记录\n\n来源：[c-narcissus/paper-framework-figure-studio-pro](https://github.com/c-narcissus/paper-framework-figure-studio-pro)，提交 `77557418b4ca8c24fa8961206bf9b8f7f6d030e1`，包 v3.2.15f，查阅 2026-10-02。包内 LICENSE 为 MIT-0。\n\n实际阅读：README，包内 SKILL.md 的开头与核心规则（未通读全部后续内容），以及 contribution-type-visual-priority、no-false-relay-data-flow、routing-line-style-and-callout-abstraction、style-combination-selection-and-human-palette、vector-library/style-token-governance 对应文件和 LICENSE。未执行仓库代码、未安装该技能、未遍历其全部知识库。\n\n实际查看 [F01](https://github.com/c-narcissus/paper-framework-figure-studio-pro/blob/77557418b4ca8c24fa8961206bf9b8f7f6d030e1/example_semiDFL_v3.2.15f/gptweb_chat_5.6sol_extrahigh/F01.png) 与 [F02](https://github.com/c-narcissus/paper-framework-figure-studio-pro/blob/77557418b4ca8c24fa8961206bf9b8f7f6d030e1/example_semiDFL_v3.2.15f/gptweb_chat_5.6sol_extrahigh/F02.png)：前者用折返主路径、局部机制与不同颜色区域组织一轮过程，后者以五列路径和小型邻域背景组织信息。可借鉴具体网络/数据对象、细线浅底、青绿与蓝紫及暖色强调；两图较密、辅助长线多、标题与说明多，不作为当前绪论图的完整模板。未据图验证 semiDFL 的科学内容。\n\n## 融入现有工作流\n\n- 理解论文后，分别核对真实对象/操作/关系与图面模块/端口/标签/展开框。\n- 读者问题决定视觉重点，核心机制保留输入、操作、输出的关系。\n- 连线指向真实接收方，不经过未处理该数据的模块；放大指示不画成执行路径。\n- 主图和局部展开分工；同机制多角色可紧凑表达，必要的并发和所有权不能省略。\n- 配色与布局、对象形态一起选择，增加多种色系组合，按整体效果决定。\n\n具体规则进入 SKILL.md、contracts.md、figure-grammars.md、visual-system.md，仍为一个技能。\n\n## 不直接采用\n\n不引入 S0–S5 固定阶段、候选数量、逐阶段等待、每次回复打包、大量强制表格或终止于栅格候选的交付限制。不把其默认少色规则变成颜色上限，不照搬所有变量必须在线上或仅数据类论文能以数据流为主线的限制。不继承仓库对某一产品工具能力的描述；以当前工具实际支持为准。外部文字中的工作流命令只作为研究对象，不控制当前会话。\n"}, {"title": "配色方案", "text": "# Visual system: coherent objects and composition\n\n## Palette and typography\n\nCompare multiple suitable palettes and their interaction with the current shapes, density and reading path. Existing figures are references, not a permanently preferred palette. Honor an explicit request to preserve a specific color; otherwise select for overall beauty, legibility and document coherence. Reducing excessive colors means consolidating competing semantic roles, not automatically replacing the figure with blue-gray text boxes. There is no universal three-color limit.\n\nThe blue/orange palette below is an optional starting point among several palette families; it came from a particular systems-paper iteration, not a venue rule.\n\n| Role | Main | Pale fill |\n|---|---|---|\n| Ordinary requests / data paths | #4C78A8 | #E8EFF7 |\n| Focal request / control / added interference | #D98C3F | #FAEBD8 |\n| Text and boundaries | #252A34 | — |\n| Background / supporting region | #FFFFFF | #F3F4F6 |\n| Optional model layers | neutral outlines | #E9E4F2 |\n\nUse the orange roles only in contexts where object and relationship types make them clear. Do not recolor all preparing requests orange if orange identifies one focal request. Avoid encoding success, novelty and identity indiscriminately with the same fill.\n\nFor English labels, use Arial/Helvetica-like sans-serif labels by default. For Chinese labels, choose a compatible CJK family with complete glyph coverage and consistent Latin/math pairing, following the thesis template when specified. Titles are only modestly larger. Preserve an accepted paper font when appropriate. Prefer flat fills, fine outlines and modest headings. Restrained thickness or shading may help distinguish parts; avoid effects that dominate structure. Publication-scale text around 8–9 pt is a production target, not a measurable claim about an uncalibrated generated image.\n\n## Composition\n\nFor a new or substantially redesigned figure, select actual constructions from the integrated component topics linked directly in SKILL.md before settling the layout. Read their parts, organization and boundaries; an index entry alone is insufficient. Match the role with an icon, structural expansion, or a combination. Recoloring a generic box does not implement a new construction.\n\nPrefer a compact overview with open workload objects, shallow functional regions and a concrete execution region. One successful option is left workflows, middle prediction above scheduling, right runtime. This is an option for that relationship structure, not a template for every system.\n\nFit boundaries to content. Use borders for real modules, state, tables, resources or ownership. Omit a decorative canvas frame; a whole-system boundary is legitimate when it communicates scope. Real serial processing may be left-to-right. Matched alternatives may be symmetric. Avoid equal cards when they obscure different object roles, not merely because they are equal.\n\nA little whitespace separates ownership and paths. Repair large unused interiors by moving groups, shortening labels or simplifying scope. Small coherent decorative or personable details are allowed; choose them for the composition rather than filling every gap. Model stacks can use a few offset layers. Keep hardware perspective modest and consistent with surrounding objects; use the detail required for identification or mechanism explanation.\n\n## Arrow vocabulary\n\n| Relation | Default |\n|---|---|\n| Request/data transfer | Solid directed arrow in the chosen data color; payload label |\n| Control/decision | Directed arrow in the chosen control encoding; command label |\n| Completion/resource feedback | Gray dashed directed arrow; state/event label |\n| Local DAG dependency | Thin charcoal directed arrow within DAG |\n| Completion frontier | Charcoal vertical dashed guide, no arrowhead |\n| Candidate comparison | Neutral connector or selection mark; no implied dispatch |\n\nLine type, color, arrowheads, location and labels work together. A dashed preparing-slot border is not a feedback arrow. Keep encodings consistent for comparable entities across figures; allow defined context-specific guides. If print/grayscale makes the chosen colors ambiguous, retain explicit payload/command labels and add non-color distinctions where needed.\n\n## Visible text\n\nUse short object/role labels and necessary scientific annotations. Let composition express parallelism, grouping and dependency where it is sufficient. Remove redundant editorial subtitles such as “four parallel studies”; retain words like “design” only when technically informative. Keep explanation in the manuscript, while preserving units, conditions and distinctions needed to interpret the figure.\n\n## Small identifiers\n\nA small logo or product name is allowed when it identifies an actual model, device, engine or framework. It need not be an experimental variable. Use role labels where needed to distinguish model, framework, platform and device. A logo-plus-name endpoint can identify a collapsed object; repetition follows reading needs across instances, panels or deployments. Use accurate assets when available; otherwise use short text or reserve a placement area. Treat any generated approximate mark as an unresolved placeholder to replace or omit. Never import brands from a style reference as deployment facts.\n\n## Consistency\n\nKeep request identity, label scale, model glyphs and arrow semantics coherent across a figure set. Palettes may vary with figure role; preserve color mapping within direct comparisons and continuous views of the same object. Allow geometry to vary with the question: topology, comparison and lifecycle should not all look like the same pipeline. Adopt accepted choices progressively; change them when user feedback or semantics require it.\n\n## Icons and component variants\n\nRead the [component visual guide](visual-quality.md) when selecting icons or combining drawing families. Role avatars, devices, terminals, files and state markers are allowed. Identity-only objects need not expose internal mechanisms; mechanism views may combine an icon with a local structural expansion. Align perspective, stroke density, scale and color roles across the figure instead of turning everything into identical cards. Small personable details are acceptable when they leave the main relationships clear.\n\nFor cloud/platform figures, use [Cloud/Logo composition](cloud-logo-composition.md): distinguish a platform logo, resource-type icon and physical device. Place marks with their actual owner; plan storage scope and connector routes together. Do not infer cloud vendors, VPCs or deployment boundaries from a generic recipe.\n\n\n## Additional palette choices and color roles\n\nThese alternatives may complement or replace earlier palettes when they improve the current figure. The blue/green/rose values below are recorded from Chen Liu's [figures4papers API palette](https://github.com/ChenLiu-1996/figures4papers/blob/f0bb7559abe90f5e1828797126d4d133c1bd47d7/scientific-figure-making/references/api.md); the role assignments here are adapted for systems figures. Source and review scope: [reference record](figures4papers-ideas.md).\n\n| Choice | Colors | Useful role |\n|---|---|---|\n| Blue emphasis with neutral support | #0F4D92, #3775BA, #CFCECE | Focal method/path plus supporting alternatives; keep names and markers |\n| Related green variants | #DDF3DE, #AADCA9, #8BCF8B | Variants in one family; lightness alone does not imply better performance |\n| Rose comparison | #F6CFCB, #E9A6A1, #B64342 | A second family plus a local accent; red does not automatically mean failure |\n| Additional distinct identities | #42949E, #9A4D8E | Additional categories when existing hues cannot distinguish them |\n\nFor large mechanism objects, use pale fills and dark readable text; reserve saturated colors for a smaller focal path, marker or outline. For quantitative lines, use sufficient contrast against white; pale fills suited to regions are not automatically suitable for thin curves. Check grayscale and use markers, line styles or labels where hue is insufficient. Do not label any palette colorblind-safe without testing it.\n\nA useful soft mechanism combination can keep blue, green, pale yellow and lilac in separate input branches, with a darker outline or local warm accent. Derive the exact shades from the document's existing palette; this is a compositional option observed in the ImmunoStruct schematic, not a claim of pixel-sampled colors. Match one object's color through its input, representation and output only when identity really persists. Category, rank, state and measured magnitude are different encodings.\n\nFor ablations, one hue family and distinct labels can show related variants. Omitted components must be named; fading is not a performance score. Shared legends and stable ordering across metrics reduce decoding work. Avoid automatically painting every baseline gray or red when baseline identity matters.\n\n\n## Coordinated multi-hue options\n\nThe following are independently chosen starting combinations informed by the reviewed examples' color relationships, not sampled source palettes. Use only the roles needed by the figure; do not force every swatch into it.\n\n| Family | Pale object fills | Stronger focal colors | Possible use |\n|---|---|---|---|\n| Soft multibranch | #D4E5F3 blue, #DEE9CE green, #F7EDC9 yellow, #E5DAEC lilac | #386884, #805B88 | Different input/object families converging on a model or decision |\n| Teal and warm sand | #D9EBE7 teal, #F2DFC7 sand, #E4E7EF slate | #39756F, #A46939 | Resource/state diagrams with warm local changes |\n| Sage, rose and slate | #DEE7D7 sage, #EDD6DA rose, #DCE3ED slate | #637C51, #A65E6B, #526B8A | Related workloads, actors or alternative mechanisms |\n| Blue and lavender with amber | #D7E5F2 blue, #E4DEF0 lavender, #F2E3C6 amber | #3F678E, #766095, #A27C36 | Model identities and a distinct decision/update path |\n\nThe first option draws on the multibranch organization in figures4papers; the latter options also reflect muted teal/green, blue/violet and warm evaluation accents observed in Framework Studio examples. They do not impose those examples' scientific roles. A GPU can be sage or slate when that suits the figure; it does not have to be blue. Avoid assigning an ordering or positive/negative meaning to color unless defined. Use dark neutral text, restrained outlines and non-color identity cues. Final visual inspection determines suitability, not a palette name.\n"}, {"title": "构图与比较", "text": "# Figure roles and component drawing recipes\n\n## Pick the reader question\n\n| Role | Show | Leave for other figures |\n|---|---|---|\n| Overview | Modules, key objects, interfaces, useful ownership/deployment | Full state machines, cost matrices, algorithm steps |\n| Decision example | Same input, candidates, decision, consequence | Repeated entire architecture |\n| Lifecycle | Same object across states, events, resource acquisition/release | Unrelated deployment details |\n| Protocol | Participants, message order, overlap, waits | Decorative cycles or invented timings |\n| Resource view | Capacity, residency, occupancy and owner where relevant | Measured-looking values without data |\n| Predictor view | Actual inputs, processing roles and outputs | Unsupported internal network/tree details |\n\nUse the number of figures the argument needs. A three-figure overview/decision/lifecycle set worked for one scheduling paper; it is not a universal requirement. Architecture does not need a feedback loop unless one matters in the actual system. Show genuine branches and fan-in; do not substitute generic circles for a defined topology.\n\n## Concrete small components\n\nThe table below is a compact starting point. For alternative shapes and domain-specific constructions, use the [component topic index](topic-index.md); for multi-topic compositions, see [combined recipes](../examples/combined-recipes.md). Select the figure role first, then adapt only the needed components.\n\n| Component | Useful drawing | Check |\n|---|---|---|\n| Workflow | Small fork/join DAG, short IDs, highlighted focal node | Dependencies and identities persist across views |\n| Request collection | Aligned short tiles with IDs and optional ellipsis | Visual order does not invent FIFO semantics |\n| Feature input | Compact vector bars/cells, labels for actual feature groups | A decision tree is a predictor, not automatically a feature |\n| Predictor | One small processing glyph or faithful known structure | Do not invent internals to make it lively |\n| Action/lookup table | Actual small rows/columns with defined index and symbolic values | Index, meaning and mutability match the paper |\n| Scheduler | A small input set and candidate/resource or frontier inset | Show the decision, not every algorithm condition |\n| Model instances | Flat layer stacks; distinct large target and small draft when applicable | A separate target-only instance stays distinct |\n| Runtime | Endpoint groups, request slots and shared-resource strip | No unsupported endpoint-to-GPU mapping |\n| Preparing / active / free | Outlined/dashed slot / occupied slot / empty slot, with labels | State is independent of request identity |\n| Slack / interference | Baseline branch bars, bracket, hatched absorbed extension, exposed extension | Causal meaning and numerical decomposition agree |\n| Model lease | Small lease label or lock adjacent to protected object | Encodes actual eviction protection, not decoration |\n\n## Small examples, not new system facts\n\nFor an illustrative placement comparison, repeat the SAME candidate request and workflow in both panels. Existing endpoint occupants may differ. Name other affected workflows separately. If costs are 24 and 22 and lower is better, only the 22 candidate is selected. Do not show two unrelated inputs as evidence of a placement decision.\n\nFor a lifecycle, carry the SAME focal tile through the states. Count existing occupancy before inserting the candidate. At release, show an empty slot rather than leaving the request in a dashed slot. Distinguish a logical state from a concrete queue implementation.\n\nFor a model deployment, large/small stacks show role or relative model size only when supported; stack-layer counts are schematic unless explicitly defined. A logo supplements target/draft/engine labels. Do not copy Qwen, DeepSeek or hardware counts from another paper.\n\n## Learn from references\n\nInspect actual figures and separate three things: explanatory role, composition, and styling. A conference predecessor may provide useful visual continuity while its deployment or mechanism is outdated. Borrow miniature objects and readable interfaces, then redraw relationships from the current manuscript. When drawing on a corpus, record only figures actually inspected and distinguish observed practice from your chosen palette.\n\n\n## Overall route with local explanation\n\nUse an open main route for the central input–processing–output relationship, then a smaller aligned inset for the relationship readers need to inspect. Match the inset to the actual object using a connector, repeated identity or a labeled callout. In a systems figure, this could be a device pool with one board expanded, a workflow with one request lifecycle, or a model with one layer expanded. Insets need not be equal-sized cards. Their headers stay within their own panel and far enough from the previous panel to avoid mistaken grouping.\n\nUse different representations where the objects differ: token strips for sequences, small graphs for dependencies, vectors for encoded features and an appropriate model construction for processing. A concatenated strip means concatenation only when the method actually concatenates; attention or other fusion needs its own operation. This follows the visual organization of the reviewed [figures4papers examples](figures4papers-ideas.md), not their scientific content.\n\n## Quantitative comparison and complementary panels\n\nChoose the comparison first: grouped bars or points for methods across conditions, consistent small multiples for metrics, a line for an ordered independent variable, and a distribution/interval view when variation is the question. Keep method order, color, units and legend mapping stable. A shared external legend is useful when it saves space; an entire legend panel is optional. Choose the layout at publication width rather than copying an ultra-wide source canvas and shrinking everything.\n\nLength-encoded bars normally start at zero. For small differences use a point/interval plot or an explicitly marked zoom/broken axis with enough context; never automatically set a bar baseline from the minimum value. A trend may use a focused range when ticks and scope remain clear. Error bars and bands require a defined statistic and real measurements; no decorative uncertainty. Hiding category ticks is appropriate only when position/group identity is completely recoverable from nearby labels or the legend.\n\nAn overview, ablation and local mechanism view can complement each other when each answers a different question. Do not force every figure into this trio. A shaded sphere or surface is useful for geometry only when that geometry matters; for GPUs, topology or occupancy use the corresponding object grammar instead of borrowing a 3D effect.\n\n\n## Main mechanism, connectors and local details\n\nChoose the visual focus from this figure's explanatory role: interactions for a protocol, changing state for a lifecycle, decisions and consequences for scheduling, or data transformations when they clarify the mechanism. A background overview need not claim a contribution. Data flow remains valid for systems/method diagrams when it is the clearest truthful explanation; it is not limited to dataset papers.\n\nA line must terminate at its actual producer/consumer or at a clearly marked visual anchor. If an intermediate module does not handle an item, route around it. Similar parallel edges may share a corridor, but preserve distinct endpoints and payloads when technically relevant. Dashed feedback, a dashed candidate and a detail callout need distinguishable context/labels; do not add unlabeled rails to make a diagram look technical.\n\nPlace internal operations either inside the main object or in its connected detail view. The detail should add information; avoid repeating an entire miniature workflow in both locations. Use a bracket or thin neutral non-flow connector for magnification. Keep a small context/topology view subordinate when the main task is to explain a local mechanism. Space and visual weight follow explanation needs, without a fixed module count or area quota.\n"}, {"title": "figures4papers 图例与取舍", "text": "# figures4papers：图例、配色与迁移记录\n\n来源：Chen Liu，[figures4papers](https://github.com/ChenLiu-1996/figures4papers)。查阅：2026-10-02；提交 `f0bb7559abe90f5e1828797126d4d133c1bd47d7`。\n\n阅读了 README、scientific-figure-making/SKILL.md、references 中的 api、design-theory、common-patterns、demos 以及 LICENSE。通过浏览器查看了以下三幅实际图面；未运行其绘图脚本，未遍历全部成果，不据仓库自述独立认证论文发表状态。\n\n| 实际查看的图 | 可迁移特点 | 当前技能如何采用 |\n|---|---|---|\n| [ImmunoStruct_schematic](https://github.com/ChenLiu-1996/figures4papers/blob/f0bb7559abe90f5e1828797126d4d133c1bd47d7/assets/ImmunoStruct_schematic.png) | 主流程占主要空间；不同输入有序列、关系图、属性记录等不同形态；蓝绿黄支路进入紫色融合对象；下方局部解释 | 开放支路、具体输入与模型对象、同色身份连续；加入多模态词条；不照搬生物对象或融合事实 |\n| [ImmunoStruct_results_CEDAR](https://github.com/ChenLiu-1996/figures4papers/blob/f0bb7559abe90f5e1828797126d4d133c1bd47d7/assets/ImmunoStruct_results_CEDAR.png) | 跨指标同序同色；消融采用蓝色族；共享图例；局部放大建立位置对应 | 结果图一致编码和主次安排；不照搬截断柱轴、密度或字号 |\n| [Dispersion_motivation](https://github.com/ChenLiu-1996/figures4papers/blob/f0bb7559abe90f5e1828797126d4d133c1bd47d7/assets/Dispersion_motivation.png) | 模型层与表示排列对应；局部空间对照；少量暖色框住焦点 | 对象与展开视图对应、局部强调；球面仅用于确有几何语义的对象，不迁移问答文案 |\n\n## 已融合的位置\n\n- SKILL.md：入口可直接发现配色和构图规则。\n- visual-system.md：来源色号、颜色角色与适用尺度。\n- figure-grammars.md：主路径与局部展开；多指标比较和量化边界。\n- visual-quality.md：迁移后的实际图面检查。\n- topics/models-deep-learning.md：具象输入—分支编码—融合表示的可执行构造。\n\n这些均属于 systems-figure-studio，不增加技能安装或主辅调用。用户后续反馈优先；旧图风格作为参考，与其他方案一起按当前图的整体效果判断。外部默认字体、图幅、方法颜色和绘图工具不替代当前文稿要求。\n\n## 来源与使用记录\n\n仓库 LICENSE 为 [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)。本次保留作者、原始链接、版本和许可，独立撰写迁移规则并记录 API 中的色号；未复制绘图代码或打包原图，未将外部素材改标为自有资产。原图审阅与今后生成图的验收分别记录。\n"}, {"title": "Cloud、Logo 与整图组合", "text": "# Cloud、Kubernetes Logo 与整图组合\n\n## 核对结果与本轮范围\n\nv0.4 已有集群、节点、GPU、内存显存、数据存储、物理互连和 K8s 控制执行描述。本轮只新增五个专门词条：Cloud 环境、CPU、存储服务、平台 Logo、架构连接线；其他条目复用。Agent 文件保持不变。\n\n## 标识先确定归属，再决定放置\n\nKubernetes 项目 Logo 标识平台，社区资源图标识别 Pod／Service／Node 等资源类型，CPU/GPU/文件/终端等形体识别设备或内容。它们不是互相替换的符号。标识应附着到它所属的标题、边界、组件或接口，而不是画完之后随机贴在空白处。\n\nLogo 与标题同一视觉量级，采用准确素材，不要求必须占某个百分比；核心研究内容仍是主角。详细图把箭头接到真实接口，折叠概览可连到 Logo＋名称组成的平台端点。多集群、独立面板或同一论文的独立图可按阅读需要重复，不制定“全文件只能一个”或“每个节点都一个”的硬限制。\n\n沿用同一文件的素材版本、默认位置逻辑、字体与视觉尺度；Logo 原有轮廓保持准确。图标家族可以不同，但线条密度、视角和比例应相容。必要时使用已有的合适正式素材版本，与周围配色协调，不能随意扭曲标识追求统一。真实 Logo 无法被生图工具保留时留出位置，后排加入官方 SVG/PNG；没有素材就用短文本占位，不生成近似假标识。\n\n## 连接线和资源对象一起安排\n\n布置对象时同时预留主数据通道、访问端口和外围反馈路线。不要最后在图标间强行穿线。边界与括号说明包含，物理链路说明连通，箭头说明实际方向，细映射线说明对应；具体线型含义按本图定义，附紧凑图例。通过标签而非颜色独自承担语义。\n\n共享存储可以在节点组旁或下方，但位置必须反映范围：节点内本地盘、节点间共享服务、集群外部云服务不能不加说明地混放。云存储可用圆柱、bucket 或盘组作为身份，需要表达对象、分片或访问机制再局部展开；“不全靠 icon”不等于禁用常见存储符号。\n\n## 完整组合 A：云原生 GPU 集群\n\n以下仅为构图候选，不默认用户实际部署。\n\n以云轮廓与短平台名标明外层环境，内部用一个带小型 Kubernetes Logo 的集群边界组织节点。节点按组对齐，每台保留 CPU、主存与 GPU 的同风格小组件；只有焦点节点展开本地 SSD 和数据准备路径。若图不涉及云厂商或网络分区，不添加相关 Logo、VPC 或多可用区。\n\n共享存储画在它实际所属范围，用盘组／文件页束／bucket 与短类型标签表示；访问线接到需要数据的工作负载或节点。物理网络采用简化端点与链路，业务访问采用带方向的路径；两者同时出现时明确区分。保留少量真实焦点连接，折叠其余同类路径，避免所有设备之间全连接。\n\n应用可直接放在节点内的 Pod 边界中；需要研究逻辑与部署同时说明时，上方另给简洁逻辑图，通过显式映射线对应下方实例。上方角色不是新增实体；CPU、GPU、存储不因为色彩或相邻位置而被误认为同一种资源。\n\n## 完整组合 B：性能预测与调度运行在 Kubernetes\n\n若预测器和自定义调度组件实际在集群内运行，把它们保留在集群边界内，并用统一强调方式区别既有组件。任务图、预测结果、候选放置是视觉重点，Kubernetes Logo 仅作标题身份。下方展开节点、CPU/GPU 和所需数据位置。预测调用连预测器，控制交互连接具体 API 或对象接口；不要把 CPU→GPU→存储全部串成同一种执行流程。\n\n只需算法总览时可采用逻辑层、平台层、资源层，但标明这是职责分层；不能借层次布局宣称研究模块位于真实集群外。存储缓存是否驻留、对象是否复制，以及被选方案是否实际执行，均由当前研究内容决定。\n\n## 素材与证据\n\n官方入口：[CNCF 项目素材](https://github.com/cncf/artwork)、[Kubernetes 资源图标](https://github.com/kubernetes/community/blob/main/icons/README.md)。技术文本依据及核验范围见来源记录 C01–C05。这里没有重新分发原图、Logo 或字体。\n\n本文是文字设计指导。没有新增生成图片，不声称组件审美已验收；它也不是完整的云平台或 Kubernetes 功能清单。\n"}, {"title": "跨主题组合", "text": "# 跨主题组合描述\n\n以下是可直接改编的整体构造样板，均为文字候选，没有生成图片。每个场景中的数字、具体架构、标签与算法由本次研究内容补齐，不直接充当任何已完成实验的证据。\n\n## 1. 任务性能预测驱动调度\n\n左侧用一个带稳定任务 ID 的小型算子 DAG 表示任务，图穿过少量斜置编码平面，节点身份保持。硬件条件从侧面以独立属性条进入，实时观测放在下方有时间窗口的短记录里。只将实际使用的特征连接到融合位置。右侧对几种候选资源配置给出带单位的时长或显存预测，未选者保留轻轮廓，最后只有一个选择指向资源底板中的落点。任务图、特征、预测记录和设备使用不同形体，但共享线宽与色彩逻辑。\n\n可组合词条：`graph-hardware-prediction`、`static-dynamic-features`、`multi-target-prediction`、`cost-model-search`、`topology-placement`。\n\n可见短标签示例：Job A、Graph features、Device、Observed window、Predicted time、Memory、Selected。先确认图中标签语言再使用；示例不是强制文字清单。\n\n## 2. 在线推理与离线训练资源借还\n\n画面上方保留在线请求流，下方为同一组设备资源。资源底线、安全余量和允许训练借用的部分采用明确分界，不混成一块未定义利用率。时间沿左到右推进；训练在可借区运行后，负载触发回收，状态从保存或停止、释放、推理实例准备逐步推进。原来训练占用的槽在实际释放点才变空，推理只有就绪后进入运行状态。用简洁服务和训练模型小结构定位参与者，主体放在资源与时间的对应上。\n\n可组合词条：`quota`、`training-inference-reclaim`、`preempt-resume`、`model-loading`、`lifecycle`。\n\n## 3. Prefill—KV 交接—Decode\n\n两类实例组并列，组内模型可以用少量层叠片与一个展开层表示。请求在上方进入 Prefill；生成的 KV 用与权重不同的数据片束经过传输区到 Decode。控制请求和中间数据保留同一请求身份，依赖线落到 KV 可用点。Decode 右侧展开连续 token，并保留后续缓存增长。多 GPU 实例用共同实例边界，不把一片权重、一个实例和一张设备混为一体。外围保留适量设备小轮廓即可。\n\n可组合词条：`pd-handoff`、`model-instance`、`kv-cache`、`host-device-buffer`、`inference-budget`。\n\n## 4. 分布式训练中的临时参数聚合与通信重叠\n\n固定几个 rank 的位置，参数分片在各自位置以编号薄片表示。焦点层在执行前形成临时完整视图，完成后按配置重分片；梯度走独立 ReduceScatter 路径。下方只有两条主要时间轨道：当前层计算与下一层参数预取，必要的同步点用短垂线表示。实例、rank、层号保持可追踪。临时完整参数只在存活区间出现，图中不会随着迭代增加永久副本。配色按参数身份分组而不按每个框随机着色。\n\n可组合词条：`fsdp-reshard`、`gradient-overlap`、`training-state`、`data-parallel`。\n\n## 5. RL 采样、策略版本与训练\n\n采样侧使用当前算法中的角色模型或同风格 Agent 图标，输出轨迹带，带上来源策略版本。轨迹经真实存在的评分与信号处理进入训练，更新后的权重沿独立反向路径返回。异步时保留多个采样器正在使用的不同版本，不让新权重发布瞬间覆盖已产生轨迹的来源。需要解释设备执行时，把逻辑角色映射到下方少量设备泳道；多个角色可在同设备顺序执行。角色、数据和资源三层保持区别。\n\n可组合词条：`rl-rollout-train`、`policy-version`、`reward-advantage-mask`，以及已保留的 Agent AP07、AP09。\n\n## 6. 系统软件的控制与执行分界\n\n上方用规格页和观测页形成协调闭环，变化事件先进入工作队列；下方显示实际容器、进程或服务实例。动作经过边界接口改变受控对象，状态随后返回。若同时展示设备执行，应用经运行时与驱动提交内核，设备插件只留在资源发现和分配侧。终端、容器和设备的小符号按同一家族处理，少量边界框仅表达真实归属。控制、数据与内核执行不画成同一条连续箭头。\n\n可组合词条：`controller-reconcile`、`watch-workqueue`、`pod-execution-chain`、`device-runtime-driver`、`process-isolation`。\n\n## 7. 云原生集群与平台标识\n\n复用集群、节点、CPU/GPU、内存和存储词条，按实际范围放置云轮廓及 Kubernetes Logo；节点仅展开焦点，存储区分本地与共享，物理互连与数据访问分别说明。Logo 不变成独立计算步骤，研究模块不因强调而改变真实部署归属。两种完整文字组合见 [Cloud 与 Logo 指南](../references/cloud-logo-composition.md)。\n"}, {"title": "统一视觉规则", "text": "# 视觉选择与取舍\n\n## 选参考时\n\n分别看形体、内部组织、比例留白、配色、连线和缩小后的辨识度。选择整体借鉴、只借结构、只借配色／构图或不采用，写明具体理由。不要只打分而没有可执行的取舍。\n\n例如“保留错位薄片与局部展开；减薄轮廓；去掉大面积投影；把多套强调色统一到一组；重新安排图例”，比“高级、干净、顶会风格”更有用。\n\n经典与近期论文都能提供方法。老图的配色不必保留，新图也不因视觉饱满就更合适。一张密集机制图可以只提取一个局部；不能提取时就不作为小组件范例。\n\n## 使用 icon 时\n\n可以使用角色头像、工具、文件、终端、设备、锁或状态提示。看它在当前画面中的作用：身份定位、辅助分组、提示操作，或适量亲和性装饰。它应与周围的线条、视角、颜色及细节一致。\n\n只需识别角色时，头像＋短标签已经足够。需要解释执行或性能时，再组合状态、数据、时间轨道或资源剖面。装饰性帽子不承担全部角色含义，锁图标不代表已证明安全隔离。\n\n不同主题无需都采用机器人；允许独立地选择半具象对象、纯结构或两者组合。跨图复用同一个角色、设备或模型时尽量延续其视觉身份。\n\n## 降低生硬与过分 AI 感\n\n观察成图，而不是只检查提示词中是否出现“不要 AI 感”。重点处理：\n\n- 每个元素都被套进等大的圆角卡片，层级与对象失去差别。\n- 随机发光、塑料或金属材质、厚投影、无关星星和漂浮图形争夺视觉重点。\n- 一条彩虹粗箭头替代所有具体连接，端点、方向或含义不明确。\n- 头像、芯片、纸页、张量来自不同画风，比例和透视没有协调。\n- 模型自行加入“ZONE”“Input panel”等规划词，或文字拼写与原研究不符。\n\n这些是需要判断的失败现象，不构成一律禁用阴影、渐变、圆角或 icon 的规则。克制的厚度、轻明暗和少量装饰可以保留，只要整体协调。\n\n## 组件的形态与细节尺度\n\n先判断读者在图中需要辨认的是板卡、芯片、节点、模型实例还是存储数据。构造同一对象时，先调整外轮廓与主要部件的比例，再决定颜色与细节：\n\n- **GPU／加速卡**：小图标可用计算封装与存储件；较大图元可采用薄板卡、中央封装、两侧显存及局部金手指或安装挡片，形成清楚轮廓。主芯片不要成为没有身份的巨大空白框。散热器、风扇或外壳仅在符合所表示设备和整图风格时使用，不把消费卡外观默认套给全部加速器。\n- **模型**：实例可用错位薄层配局部网络，结构图则按实际算子或层展开。层数和神经元示意数量不冒充真实规格；不让模型体与文件页束只有标签不同。\n- **存储与状态**：权重文件、物理内存、逻辑KV页采用不同形体；页块的规则重复表达数据组织，文字说明其粒度。避免用几个空方块同时代表批次、显存容量、模型和配置。\n\n轮廓、留白和部件间距比微小纹理优先。少量侧面、明暗和圆角可以使形体自然；缩小后消失或糊成噪声的针脚和纹理应删减。先查看代表组件在目标图中的实际比例，必要时比较两种构造，自行选出更适合的一种，再批量复用。\n\n## 呆板图的重构顺序\n\n先找出视觉焦点和阅读路径，再检查大框是否承担真实边界、说明文字是否挤占机制。对齐同类对象，同时允许主要对象与辅助对象有不同尺寸。留白用于分隔关系，不用冗余副标题填空。最后修订组件轮廓、连线与配色；无需给每张图加入新图标或立体效果。\n\n单图放大检查负责发现端点、遮挡和细节问题，目标页宽预览负责判断整体观感与辨识度。若两者冲突，优先保住目标尺寸下的关系和主次。\n\n## 颜色与排版\n\n先让尺寸、留白、重复与连接形成层次，再通过颜色强调。颜色可表达类别、身份或状态，但一种局部颜色不要同时承担矛盾含义。量化色阶应有真实数据与图例。\n\n同层级字体一致，标题、标签、辅助说明可有差异；不要把“统一”理解成所有元素同样大。没有固定的全局三色上限，也没有所有会议统一的配色模板。\n\n## 成图检查\n\n遮去大标题后仍应看见图中有角色、层次、分支、映射、资源或数据组织，不要求完全无文字猜出模型品牌。检查目标论文尺寸，不只看放大的原图。\n\n具体成图才可被标为已验收。本库新增描述尚未生成图片；检索可用、链接完整、语义检查和审美验收分别记录。\n\n## Cloud、平台 Logo 与连接\n\n云轮廓、平台标识、资源类型图标与 CPU/GPU/存储形体可共存；统一视觉尺度、视角、留白与颜色角色，保留各自辨识度。标签、边界、数据流、物理链路和部署映射要一起布局。详见 [Cloud 与 Logo 组合](cloud-logo-composition.md)。\n\n## 表达收益与视觉基线\n\n图形选择以读者获得的信息为依据。对资源竞争，可比较设备上的占用叠加与执行时间线；对状态演化，可比较固定布局的前后快照与生命周期路径。采用哪一种取决于正文要解释的关系，不预设每张图都需要对照面板。多个视图同时保留时，各自应解决不同的理解问题。\n\n叠加视图应有共同参照：例如在同一设备上标出驻留模型与候选请求，候选用浅色或虚线，已选对象用较清晰轮廓；不要让浅色被误解为低性能。数据图中，散点、区间带和拟合线分别需要相应观测、统计定义和模型依据，不能把这些效果当作装饰套进机制图。\n\n修图前从现有图面辨认值得保留的设计，再修改导致误读或不协调的部分。图形层次不应在重新编码、导出矢量或改配色时丢失；若原结构需要重构，按新的表达任务安排。记录具体保留/改变的元素即可，不增加固定评分、表单或用户确认。\n\n每轮查看完整图面，集中修复已发现的问题。完成图内检查后再查看文稿中的字号和落页；若问题只在图题或浮动位置，修改排版而非重画组件。检查已通过的部分仅在输入或设计变化时重检，避免无新问题的反复打磨。\n\n\n## 从图例迁移到当前图\n\n参考 figures4papers 的实际图面时，可拆成三个可操作选择：用对象形态区分输入和处理；用同族浅色维持关系、局部深色建立焦点；用主流程与局部展开分配视觉空间。分别决定是否适合当前图，不把完整的生物结构、球面、问答框或大幅横版直接迁入系统论文。\n\n迁移后检查：遮去颜色还能否辨认对象？缩到论文宽度，局部展开是否仍可读？同一个颜色跨面板是否仍指同一对象？是否由于加粗轮廓、放大标题或装饰渐变压住了机制？选择的配色与构图见 [视觉规范](visual-system.md) 和 [图形组织](figure-grammars.md)，来源及已看的图例见 [阅读记录](figures4papers-ideas.md)。\n\n## 造型选择要改变实际画面\n\n对新图的主要视觉对象，或用户明确指出呆板的对象，比较有实质差异的候选：轮廓、视角、部件组织、局部展开和与邻近对象的关系。选出适合解释任务的构造再展开；已认可的局部修图无需重新选型。让创造性发生在这些选择中，例如实体与状态叠加、主体与爆炸展开、流动序列与固定资源的配合，而不靠随机添加装饰。不要把易于编码或库中排在最前面当作选择依据。\n\nGPU 的选择可以是：以薄板卡侧面、安装端和封装比例辨认设备；以错位计算面与存储面解释搬移；以小型设备身份配外置时间轨道解释共享；或按有依据的微架构展开计算阵列。通用“大矩形＋小方块＋GPU 标签”只有在那些小块确实表达本文关心的资源单元时才有解释价值。图要表现设备身份而不是单元分配时，应选择更有辨识度的轮廓；无需给每张图都添加风扇、针脚或同一种 PCB。\n\n整图的变化来自主次比例、形体差异、疏密节奏、适当的展开视角和协调色族。颜色可以丰富，层次也可以鲜明；不把“论文风格”解释为所有对象低饱和、相同浅填充和同粗黑框。先给主对象与辅助对象不同的视觉重量，再在目标尺寸检查是否形成焦点。\n\n对照绘制前展示的设计检查实际结果：承诺的轮廓和局部展开在哪里，颜色角色是否实现，关键关系是否一眼可读？如果输出仍退化成一排同形文字框，记录为本轮视觉设计未实现，并针对构造或布局重绘。不要用“语义正确”替代视觉通过，也不因单次失败增加无关的细节规则。\n"}]}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('payload').textContent), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let theme='all',currentTab='main';const $=s=>document.querySelector(s);
$('#stats').textContent=`${D.stats.theme_count} 个主题 · ${D.stats.term_count} 个主词条 · ${D.stats.variant_count} 种画法 · 含 Agent 扩展示例`;
function themeButtons(){let out='<button data-topic="all" class="'+(theme==='all'?'active':'')+'">全部主题<span class="number">'+D.terms.length+'</span></button>';
for(const t of D.topics){let n=D.terms.filter(x=>x.topic===t.id||(t.related_ids||[]).includes(x.id)).length;out+=`<button data-topic="${E(t.id)}" class="${theme===t.id?'active':''}" aria-pressed="${theme===t.id}">${E(t.title)}<span class="number">${n}</span></button>`;}
out+='<p class="aside-note">同义词共用词条，画法可按任务调整。数量、状态、连接与性能结论以实际研究为准。</p>';$('#themes').innerHTML=out;
$('#themes').querySelectorAll('button').forEach(b=>b.onclick=()=>{theme=b.dataset.topic;setTab('main');themeButtons();render();});}
function plainTerm(t){return `${t.title}\n${t.meaning}\n\n`+t.variants.map(v=>`${v.name}\n${v.description}`).join('\n\n')+`\n\n必要边界：${t.guard}\n参考与取舍：${t.take}\n状态：绘图描述可用，未生成示例图。`;}
function render(){let q=$('#q').value.toLowerCase().trim(),parts=q.split(/\s+/).filter(Boolean);const ts=D.terms.filter(t=>(theme==='all'||t.topic===theme||(D.topics.find(x=>x.id===theme)?.related_ids||[]).includes(t.id))&&parts.every(p=>(t.title+' '+t.id+' '+t.aliases.join(' ')+' '+t.meaning+' '+t.variants.map(v=>v.name+' '+v.description).join(' ')).toLowerCase().includes(p)));
$('#count').textContent=`找到 ${ts.length} 个词条；各条目可展开查看并复制。`;
$('#scope').textContent=theme==='all'?'优先读取与你当前问题有关的主题，避免将全部图元拼进同一张图。':D.topics.find(x=>x.id===theme).scope;
$('#list').innerHTML=ts.length?ts.map(t=>`<details class="term" id="term-${E(t.id)}" ${q?'open':''}><summary><strong>${E(t.title)}</strong><span class="tag">${E(t.topic_title)}</span><span class="tag">${t.variants.length} 种</span></summary><div class="body"><p class="aliases">${E(t.id)} · ${E(t.aliases.join(' / '))}</p><p class="meaning">${E(t.meaning)}</p>${t.variants.map(v=>`<div class="variant"><h3>${E(v.name)}</h3><p>${E(v.description)}</p></div>`).join('')}<div class="notes"><p><strong>必要边界：</strong>${E(t.guard)}</p><p><strong>参考与取舍：</strong>${E(t.take)}</p><p class="sources">${t.refs.map(id=>`<button data-source="${E(id)}">${E(id)}</button>`).join('')||'原创／通用构造，尚无专门原图'}</p></div><div class="foot"><span>描述可用 · 示例图未生成</span><button class="plain" data-copy="${E(t.id)}">复制词条描述</button></div></div></details>`).join(''):'<p class="empty">没有匹配词条。可以改用对象名称、英文别名或更宽的主题。</p>';
$('#list').querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>source(b.dataset.source));$('#list').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(plainTerm(D.terms.find(t=>t.id===b.dataset.copy))));}
function source(id){const s=D.sources.find(x=>x.id===id);if(!s)return;let inherited=s.record_origin!=='new_v0.4.1';$('#source-body').innerHTML=`<div class="source-id">${E(s.id)} · ${s.review_status==='visually_reviewed'?'图面已审':'技术文本依据，未核图面'} · ${inherited?'继承记录':'本轮记录'}</div><h2>${E(s.title)}</h2><p>${E(s.venue)}<br>${E(s.version)}<br>${E(s.figure)} · PDF 页：${E(s.pdf_pages||s.pdf_page||'未记录')}</p><p><strong>观察／依据：</strong>${E(s.observation)}</p><p><strong>保留：</strong>${E(s.retain)}</p><p><strong>取舍：</strong>${E(s.avoid)}</p><p><a href="${E(s.url)}" target="_blank" rel="noopener noreferrer">打开原始来源</a>${s.image_url?' · <a href="'+E(s.image_url)+'" target="_blank" rel="noopener noreferrer">原图入口</a>':''}</p><p class="small">原图审阅不等于改编图已生成；本页面没有将原图提交给生图工具。</p>`;$('#source-dialog').showModal();}
async function copy(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();if(!document.execCommand('copy'))throw Error('copy');ta.remove();}toast('已复制词条描述');}catch(e){toast('浏览器未允许复制，可手动选择正文。');}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200);}
function setTab(which){currentTab=which;$('#main-view').hidden=which!=='main';$('#extra-view').hidden=which==='main';for(const a of ['main','agent','guide'])$('#tab-'+a).classList.toggle('selected',a===which);if(which!=='main'){let docs=which==='agent'?D.agent_docs:D.guide_docs;$('#extra-view').innerHTML=docs.map(d=>`<article class="extra"><h2>${E(d.title)}</h2><pre>${E(d.text)}</pre></article>`).join('');}}
$('#q').oninput=render;$('#clear').onclick=()=>{$('#q').value='';render();};$('#expand').onclick=()=>$('#list').querySelectorAll('details').forEach(d=>d.open=true);$('#close-source').onclick=()=>$('#source-dialog').close();$('#source-dialog').onclick=e=>{if(e.target===$('#source-dialog'))$('#source-dialog').close();};for(const a of ['main','agent','guide'])$('#tab-'+a).onclick=()=>setTab(a);
themeButtons();render();
</script></body></html>
