interface:
  display_name: "Systems Figure Studio"
  short_description: "Draw academic figures for papers and dissertations"
  default_prompt: "Use $systems-figure-studio to infer the target conference paper, journal article or doctoral dissertation and its Chinese or English figure labels. Select concrete constructions for models, devices, workflows or platform symbols from the integrated knowledge base, preserve accepted visual choices, show the design and complete prompt before drawing, then generate or redraw, inspect and deliver the requested images, prompts or editable sources."
