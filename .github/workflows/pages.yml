name: Publish static guide
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/rebuild_navigation.py
      - run: python scripts/validate.py
      - run: python scripts/check_history.py
      - run: python scripts/prepare_site.py --output "${{ runner.temp }}/systems-figure-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/systems-figure-site
      - uses: actions/deploy-pages@v4
