name: Validate skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/rebuild_navigation.py
      - run: python scripts/validate.py
      - run: python scripts/check_release.py
      - run: git diff --exit-code -- catalog/index.json catalog/statistics.json guide.html
