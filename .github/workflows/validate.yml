name: Validate skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/rebuild_navigation.py
      - run: python scripts/validate.py
      - run: python scripts/check_history.py
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_browser.cjs
        env:
          PYTHON: python
      - run: python scripts/evaluate_behavior.py
      - run: python scripts/check_generated.py
      - run: git diff --exit-code -- catalog/index.json catalog/statistics.json catalog/browser.json guide.html
  optional-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install PyMuPDF
      - run: python -m unittest discover -s tests/optional -v
